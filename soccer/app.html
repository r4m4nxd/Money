<title>Airdrie United FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: sticky club header + angled tab bar, one working column; FC-style cut-corner panels; kit-coloured team columns */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F3F6FB; --ink:#0B1630; --muted:#56627A; --line:#D6DDE9;
  --accent:#D96A0F; --accent-ink:#FFFFFF; --gold:#B8862A; --warn:#B4531A; --bad:#C62F3E; --good:#138A5A;
  --hdr1:#0A1F44; --hdr2:#123A7A; --hdr-ink:#F4F7FB;
  --gold1:#F6DC86; --gold2:#B8862A; --silver1:#EEF1F4; --silver2:#9AA4AF; --bronze1:#EDBB8C; --bronze2:#94603A; --card-ink:#17120A;
  --star1:#0B1D3F; --star2:#1C3F86; --star-ink:#F7D27A;
  --blue:#2F6FD6; --green:#1E9A52; --orange:#EE8A1A; --red:#D23B3B; --purple:#7B4BC9; --black:#2A2E35;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --cut:12px; --club-orange:#E07B24; --boards:#C9D1D8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060D1A; --surface:#0E1A2F; --surface2:#13223C; --ink:#EAF0F8; --muted:#8D9BB4; --line:#22324E;
  --accent:#F58A2A; --accent-ink:#1B0C00; --gold:#F2C46B; --warn:#FFB547; --bad:#FF5C6C; --good:#3DDC97;
  --hdr1:#050B17; --hdr2:#0E2552; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060D1A; --surface:#0E1A2F; --surface2:#13223C; --ink:#EAF0F8; --muted:#8D9BB4; --line:#22324E;
  --accent:#F58A2A; --accent-ink:#1B0C00; --gold:#F2C46B; --warn:#FFB547; --bad:#FF5C6C; --good:#3DDC97;
  --hdr1:#050B17; --hdr2:#0E2552; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding-block:12px 4px;flex-wrap:wrap}
.brand{align-items:center}.crest{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--club-orange)}
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(130% 90% at 50% 40%,#0B3466 0,#062650 42%,#03142C 100%);display:grid;place-items:center;transition:opacity .55s cubic-bezier(.4,0,.2,1),visibility .55s}
#splash.out{opacity:0;visibility:hidden}#splash.out .sp-in{transform:scale(1.035);transition:transform .55s cubic-bezier(.4,0,.2,1)}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:0}
.sp-glow{position:absolute;top:calc(min(56vw,260px)*-.35);left:50%;width:calc(min(56vw,260px)*1.9);aspect-ratio:1;margin-left:calc(min(56vw,260px)*-.95);border-radius:50%;background:radial-gradient(closest-side,rgba(242,196,107,.22),rgba(224,123,36,.08) 55%,transparent 75%);pointer-events:none;opacity:0}
.sp-crest{position:relative;width:min(56vw,260px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px rgba(242,196,107,.55),0 24px 60px rgba(0,0,0,.55)}
.sp-crest img{width:100%;height:100%;display:block}
.sp-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,240,210,.28) 50%,transparent 62%);transform:translateX(-130%)}
.sp-ring{position:absolute;top:calc(min(56vw,260px)/-2*0.1);width:calc(min(56vw,260px)*1.1);left:50%;margin-left:calc(min(56vw,260px)*-.55);overflow:visible}
.sp-ring circle{fill:none;stroke:url(#spg);stroke-width:1.4;stroke-linecap:round;stroke-dasharray:604;stroke-dashoffset:604;transform:rotate(-90deg);transform-origin:center}
.sp-t{margin-top:30px;font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.16em;text-transform:uppercase;color:#F2D58F}
.sp-line{display:block;width:120px;height:1px;margin:12px 0 10px;background:linear-gradient(90deg,transparent,#E07B24,transparent);transform:scaleX(0)}
.sp-s{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.42em;text-transform:uppercase;color:rgba(242,213,143,.75)}
@media (prefers-reduced-motion:no-preference){
  .sp-glow{animation:spGlow 1.4s .1s cubic-bezier(.16,1,.3,1) forwards}
  .sp-crest{animation:spIn 1s cubic-bezier(.16,1,.3,1) both}
  .sp-ring circle{animation:spRing 1.25s .15s cubic-bezier(.65,0,.35,1) forwards}
  .sp-shine{animation:spShine 1.1s .9s cubic-bezier(.4,0,.2,1) both}
  .sp-t{animation:spTxt .9s .55s cubic-bezier(.16,1,.3,1) both}.sp-line{animation:spLine .8s .8s cubic-bezier(.16,1,.3,1) forwards}.sp-s{animation:spTxt .9s .9s cubic-bezier(.16,1,.3,1) both}
}
@keyframes spGlow{to{opacity:1}}
@keyframes spIn{from{transform:scale(.9);opacity:0;filter:blur(10px)}to{transform:none;opacity:1;filter:blur(0)}}
@keyframes spShine{to{transform:translateX(130%)}}
@keyframes spTxt{from{opacity:0;letter-spacing:.42em;transform:translateY(6px)}}
@keyframes spLine{to{transform:scaleX(1)}}
@keyframes spRing{to{stroke-dashoffset:0}}
@keyframes spUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand small{color:var(--muted);font-size:13px}
.sync{margin-left:auto;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 8px}
nav.tabs button{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h2{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
button,.btn{font:inherit;cursor:pointer}
.btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.num{font-variant-numeric:tabular-nums}
.pos{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.3}
.pos.DEF{color:#2F6FD6} .pos.MID{color:#1E9A52} .pos.FWD{color:#D23B3B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pos.DEF{color:#7EA9F0}:root:not([data-theme="light"]) .pos.FWD{color:#F08A8A}:root:not([data-theme="light"]) .pos.MID{color:#5FD08E}}
:root[data-theme="dark"] .pos.DEF{color:#7EA9F0}:root[data-theme="dark"] .pos.FWD{color:#F08A8A}:root[data-theme="dark"] .pos.MID{color:#5FD08E}

/* availability chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 10px 5px 6px;cursor:pointer;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .o{font-family:var(--f-display);font-weight:700;font-size:13px;min-width:22px;text-align:center}
.grp{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;padding-block:6px;border-top:1px dashed var(--line)}
.grp:first-child{border-top:0}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;display:flex;flex-direction:column}.team .plist{flex:1 0 auto}
.team .hd{padding:10px 12px;color:#fff;display:flex;align-items:center;gap:8px}
.team .hd input{background:rgba(255,255,255,.18);border:0;color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;width:100%}
.team .hd select{background:rgba(0,0,0,.18);border:0;color:#fff;padding:3px}
.p2 .tok .dot.ini.lt{color:#1B1F26}.team .hd.lt,.team .hd.lt input,.team .hd.lt select,.sharecard .st h4.lt{color:#1B1F26}.team .hd.lt input{background:rgba(255,255,255,.35)}
.plist{list-style:none;margin:0;padding:4px 0}
.plist li{display:grid;grid-template-columns:40px 1fr auto auto;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist select{padding:2px 4px;font-size:12px}
.lock{background:none;border:0;padding:2px 4px;color:var(--muted);font-size:14px}
.lock[aria-pressed="true"]{color:var(--warn)}
.stats{padding:10px 12px;background:var(--surface2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stats .d{font-size:11px}
.up{color:var(--good)} .dn{color:var(--bad)}
.lines{font-size:12px;color:var(--muted);padding:0 12px 8px;background:var(--surface2)}
.balance{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:600;font-size:12px}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.meh{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* FIFA-style cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;border-radius:12px 12px 40px 40px/12px 12px 24px 24px;padding:10px 10px 14px;color:var(--card-ink);cursor:pointer;border:0;text-align:left;font:inherit;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 1px 0 rgba(0,0,0,.08)}
.card.gold{--t1:var(--gold1);--t2:var(--gold2)} .card.silver{--t1:var(--silver1);--t2:var(--silver2)} .card.bronze{--t1:var(--bronze1);--t2:var(--bronze2)}
.card.off{opacity:.5}
.card .ovr{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:.9}
.card .ps{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.05em}
.card .cn{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;margin-top:10px;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cs{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;margin-top:6px;font-size:13px;font-variant-numeric:tabular-nums}
.card .cs b{font-family:var(--f-display);font-size:15px;margin-right:3px}
.card .fm{position:absolute;right:10px;top:10px;font-size:12px;font-weight:700}
.card .wl{font-size:11px;margin-top:6px;opacity:.8}

/* matches */
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mact{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.mact .btn{width:100%}.mact .mdel{grid-column:1/-1;justify-self:end;width:auto}@media(max-width:600px){.mact{grid-template-columns:1fr 1fr}}
.score{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.score .k{width:12px;height:12px;border-radius:3px;display:inline-block}
.score input{width:52px;text-align:center}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,10,16,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px 12px}
.scrim>.modal{max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:mIn .18s ease-out}@keyframes mIn{from{opacity:0;transform:scale(.97)}}.scrim>.modal.nudge{animation:nudge .25s}@keyframes nudge{50%{transform:scale(1.015)}}
body.mopen #main,body.mopen header.top{pointer-events:none;user-select:none}
.modal{background:var(--bg);color:var(--ink);border-radius:14px;width:100%;max-width:760px;padding:16px;border:1px solid var(--line)}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal .mh h2{margin:0}
.modal .mh .x{margin-left:auto}.modal .mh .mhb{margin-left:auto;display:flex;gap:6px;flex:none;align-items:center}.modal .mh .mhb .x{margin-left:0}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.attrs input{width:100%}
.rate{border-top:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:6px}
.atgrid{display:flex;flex-direction:column;gap:6px}.atrow{display:grid;grid-template-columns:minmax(90px,1fr) auto;gap:2px 10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.atrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.atn{font-size:13px;color:var(--muted);text-align:right}.ads{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px}
.ad{width:10px;height:10px;border-radius:3px;display:inline-block}.ad.on{background:var(--good)}.ad.ns{background:#7A1020;color:#fff;font-size:8px;font-style:normal;display:inline-grid;place-items:center;line-height:1}.ad.off{background:var(--bad);opacity:.75}.ad.na{background:var(--line)}.ad.up{border:1px solid var(--line)}
.gai{display:flex;gap:10px}.gai label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.gai input{width:64px;padding:6px 8px}
.attrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}.attrow .an{font-weight:600;flex:1 1 120px}
.attseg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.attseg .as{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:8px 10px;cursor:pointer;min-height:40px}
.attseg .as+.as{border-left:1px solid var(--line)}.attseg .as.p[aria-pressed=true]{background:var(--good);color:#fff}.attseg .as.l[aria-pressed=true]{background:var(--warn);color:#111}.attseg .as.a[aria-pressed=true]{background:var(--bad);color:#fff}
.sh3{margin:10px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.seasonbox{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fbin{font-size:14px;padding:6px 10px}
.rate .attrs{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.rate .attrs label{font-size:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* share card: fixed look so the screenshot is identical on every phone */
.sharecard{background:#0F1B2B;color:#F2F5F8;border-radius:14px;padding:18px;font-family:var(--f-body);max-width:560px;margin:0 auto}
.sharecard .sh{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.sharecard .sd{color:#A9B6C6;font-size:14px;margin:4px 0 14px}
.sharecard .sg{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:10px}
.sharecard .st{background:#172638;border-radius:10px;overflow:hidden}
.sharecard .st h4{margin:0;padding:8px 10px;font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff}
.sharecard .st ol{margin:0;padding:6px 10px 10px 30px;font-size:14px}
.sharecard .st li{padding:2px 0}
.sharecard .st li em{font-style:normal;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;color:#A9B6C6;margin-left:6px}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.tb select{padding:3px 6px}
.stitle{background:var(--surface2);border-top:1px solid var(--line);padding:8px 12px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.prate{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;max-width:400px;margin:0 auto 8px;font-size:12px;color:var(--muted)}
.prate b{color:var(--ink);font-family:var(--f-display);font-size:15px}
.prate span:first-child{width:100%;text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pwrap{padding:4px 12px 12px}
.pitch{position:relative;width:100%;max-width:400px;aspect-ratio:3/4;margin:0 auto;border-radius:18px;border:5px solid var(--boards);background:#2F8F52;overflow:hidden}
.pitch .mk{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:25%;background:none;border:0;padding:0;font:inherit;color:#fff;z-index:1}
button.tok{cursor:pointer}
.tok .dot{width:32px;height:32px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.02em;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.tok .tn{font-size:10px;line-height:1.15;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:4px;max-width:100%;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tok.sel .dot{outline:3px solid #FFD54A;outline-offset:2px}
.pitch.p2{container-type:inline-size;aspect-ratio:1/1.04;max-width:460px;border:0;border-radius:14px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.p2 .ptitle{position:absolute;top:4%;left:0;right:0;text-align:center;color:#111;font-family:var(--f-display);font-weight:900;font-size:clamp(17px,5.4vw,26px);letter-spacing:.01em;text-transform:uppercase;z-index:1;pointer-events:none;line-height:1}
.p2 .ptitle i{display:block;width:34px;height:4px;border-radius:2px;margin:6px auto 0}
.p2 .tok{gap:4px;color:#fff}.p2 .dw{position:relative;display:block}
.p2 .tok .dot{position:relative;width:clamp(30px,11cqw,50px);height:clamp(30px,11cqw,50px);border:2.5px solid var(--kc);background:#fff;color:#fff;font-size:clamp(11px,3.6cqw,17px);box-shadow:0 3px 8px rgba(0,0,0,.3)}

/* ---------- Premium feel: smooth motion, refined type, tactile controls ---------- */
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.panel{box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 6px 24px rgba(0,0,0,.12)}
:root[data-theme="light"] .panel{box-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.06)}
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  #main.enter>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
  #main.enter>*:nth-child(2){animation-delay:.04s}#main.enter>*:nth-child(3){animation-delay:.08s}#main.enter>*:nth-child(4){animation-delay:.12s}#main.enter>*:nth-child(5){animation-delay:.16s}#main.enter>*:nth-child(n+6){animation-delay:.2s}
  :root{interpolate-size:allow-keywords}
  details::details-content{transition:block-size .34s cubic-bezier(.2,.8,.2,1),content-visibility .34s allow-discrete;overflow:clip;block-size:0}
  details[open]::details-content{block-size:auto}
  .btn,.chip,.themebtn,.cxc{transition:transform .14s cubic-bezier(.2,.8,.2,1),background-color .18s,color .18s,box-shadow .2s,border-color .18s}
  .btn:active,.chip:active,.themebtn:active,.lock:active{transform:scale(.96)}
  .scrim>.modal{animation:mIn2 .32s cubic-bezier(.2,.8,.2,1)}@keyframes mIn2{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  @media(hover:hover){.panel.game,.mcx,.tcard,.team{transition:box-shadow .25s,transform .25s}.panel.game:hover,.mcx:hover,.tcard:hover,.team:hover{box-shadow:0 14px 40px rgba(0,0,0,.28)}
    .cx>summary:hover .cxc,.mcx>summary:hover .cxc{border-color:var(--accent)}}
}
/* ---------- Wide screens (desktop, 1440p, 4K): use the whole canvas, fewer scrolls ---------- */
.team .hd select{min-width:5.5em}
@media(min-width:1200px){.wrap{max-width:none;padding-inline:clamp(24px,2.4vw,72px)}}
@media(min-width:1400px){
  #main[data-v=match]:has(>.cx[data-cx=m_teams]){display:grid;grid-template-columns:minmax(320px,23%) minmax(0,1fr);column-gap:clamp(20px,2vw,48px);align-items:start}
  #main[data-v=match]>.cx{grid-column:1;min-width:0}
  #main[data-v=match]>.cx[data-cx=m_teams]{grid-column:2;grid-row:1/span 9}
  #main[data-v=match] .mdx>.teams{grid-template-columns:1fr}
  #main[data-v=history] .mlist,#main[data-v=p-games]>.panel.game~.panel.game{align-items:start}
  #main[data-v=history] .mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:14px}
  .lbs{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .modal.wide{max-width:1280px}
  .atgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));column-gap:28px}
  .chart svg{max-height:300px}
  .mgrid{flex-direction:row;gap:clamp(20px,2vw,48px);align-items:flex-start}.mgc{display:flex;flex-direction:column;flex:1 1 0;min-width:0}
  .tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));column-gap:20px;align-content:start;max-height:640px}.tlist .tsep{grid-column:1/-1}
  .tstaff .fgrid.g2{max-width:900px}
  .charts{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
}
@media(min-width:2200px){
  header.top>.wrap,#main{zoom:1.2}/* big monitors: scale the page, not just stretch it (modals and share images stay 1:1) */
  #main[data-v=match]:has(>.cx[data-cx=m_teams]){grid-template-columns:minmax(360px,22%) minmax(0,1fr)}
  #main[data-v=match] .mdx>.teams{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
}
@media(min-width:3000px){
  header.top>.wrap,#main{zoom:1.5}
  .cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  #main[data-v=history] .mlist{grid-template-columns:repeat(auto-fill,minmax(680px,1fr))}
}

function supaDB(client,uid){
  const cols={};
  const snap=col=>({docs:[...cols[col].map].map(([id,d])=>({id,exists:true,data:()=>d}))});
  const emit=col=>{const c=cols[col];if(!c.ready)return;const s=snap(col);c.cbs.forEach(f=>f(s))};
  function watch(col,fn,err){
    if(!cols[col]){cols[col]={map:new Map(),cbs:[],ready:false};
      client.from('atb_docs').select('id,data').eq('col',col).then(({data,error})=>{
        if(error){err&&err(error);return}data.forEach(r=>cols[col].map.set(r.id,r.data));cols[col].ready=true;emit(col)})}
    cols[col].cbs.push(fn);if(cols[col].ready)fn(snap(col));
  }
  client.channel('atb-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'atb_docs'},p=>{
    const row=p.eventType==='DELETE'?p.old:p.new;if(!row||row.owner!==uid||!cols[row.col])return;
    if(p.eventType==='DELETE')cols[row.col].map.delete(row.id);else cols[row.col].map.set(row.id,row.data);emit(row.col)}).subscribe();
  const split=path=>{const i=path.indexOf('/');return [path.slice(0,i),path.slice(i+1)]};
  return {
    collection:col=>({onSnapshot:(fn,err)=>watch(col,fn,err)}),
    doc:path=>{const [col,id]=split(path);return {
      async set(data){const {error}=await client.from('atb_docs').upsert({owner:uid,col,id,data,updated_at:new Date().toISOString()});if(error)throw error;cols[col]&&(cols[col].map.set(id,data));},
      async delete(){const {error}=await client.from('atb_docs').delete().eq('col',col).eq('id',id);if(error)throw error;cols[col]&&cols[col].map.delete(id)},
      onSnapshot(fn,err){watch(col,s=>{const d=s.docs.find(x=>x.id===id);fn(d||{id,exists:false,data:()=>undefined})},err)}}}
  };
}

function scores(a){
  const fwd=(a.pas+a.sho+a.bal+a.min+a.tea+a.spd+a.sta+a.str)/80;
  const mid=(a.pas+a.sho+a.def+a.bal+a.min+a.tea+a.sta)/70;

    const N=+S.settings.recentN||0; if(N>0) rs=rs.slice(-N);

    const a={};for(const k of K){let s=(p.base?.[k]??7)*w;for(const x of rs)s+=+x.r[k];a[k]=s/(w+rs.length)}

    let W=0,D=0,L=0;
    for(const m of ms){const ti=m.teams.findIndex(t=>t.players.includes(p.id));if(ti<0||absentIn(m,p.id))continue;const gs=m.teams.map(t=>t.goals);if(gs.some(g=>g===''||g==null))continue;

  const per={};R.forEach(x=>{const k=x.kind+':'+x.who,o=per[k]=per[k]||{n:nm(x),open:0,go:0,close:0,last:x.at};o[x.action]++});
  const tot=a=>R.filter(x=>x.action===a).length,op=tot('open'),go=tot('go'),cl=tot('close'),ppl=Object.keys(per).length;
  const SRC={header:'☕ header',home:'Home line',club:'Club card',guide:'Guide'};const bySrc=Object.entries(R.filter(x=>x.action==='open').reduce((o,x)=>(o[x.src]=(o[x.src]||0)+1,o),{})).sort((a,b)=>b[1]-a[1]);
  return `<h2>☕ Support button <span class="small muted">(only you see this)</span></h2><div class="panel stack">
    <label class="small row chk"><input type="checkbox" id="tipon" data-a="settip" ${tipOn()?'checked':''}> Show the ☕ Support the builder button (header, player home, Club page and guides)</label>
    <label class="f" style="max-width:420px">Ko-fi link<input id="tipurl" data-a="settip" value="${esc(tipUrl())}" inputmode="url" autocapitalize="none" spellcheck="false"></label>
    ${tipStats?.loading?'<p class="small muted" style="margin:0">Loading…</p>':`<div class="kpis">${kpi(op,'Popup opened')}${kpi(go,'☕ Went to Ko-fi')}${kpi(cl,'Closed')}${kpi(op?Math.round(go/op*100)+'%':'–','Click-through')}${kpi(ppl,'People')}</div>
    ${bySrc.length?`<div class="small muted">Opened from: ${bySrc.map(([k,v])=>`${SRC[k]||k||'?'} ${v}`).join(' · ')}</div>`:''}
    ${ppl?`<div class="tbl"><table><tr><th>Who</th><th>Opened</th><th>Ko-fi</th><th>Closed</th><th>Last</th></tr>${Object.values(per).sort((a,b)=>b.go-a.go||b.open-a.open).map(o=>`<tr><td>${esc(o.n)}</td><td>${o.open}</td><td>${o.go?'<b>'+o.go+'</b>':0}</td><td>${o.close}</td><td class="small">${when(o.last)}</td></tr>`).join('')}</table></div>`:'<p class="small muted" style="margin:0">No clicks yet.</p>'}
    <p class="small muted" style="margin:0">“Went to Ko-fi” means they tapped Buy a coffee; Ko-fi itself shows who actually paid. Your own clicks and previews aren’t counted.</p>
    <div class="row"><button class="btn ghost small" data-a="tiprefresh">Refresh</button></div>`}</div>`}
let pactQ='';
function playerActPanel(when){const acts=mgrs.pact;
  if(!acts)return `<h2>Player activity</h2><div class="panel muted">Loading…</div>`;
  const by={};acts.forEach(x=>(by[x.player_id]=by[x.player_id]||[]).push(x));const wk=Date.now()-7*864e5;
  const roster=S.players.filter(p=>!p.guest).map(p=>({p,acts:by[p.id]||[]})).sort((a,b)=>(b.acts[0]?.at||'').localeCompare(a.acts[0]?.at||'')||a.p.name.localeCompare(b.p.name));
  const q=pactQ.toLowerCase();const icon=a=>/Wrong|Locked|blocked/.test(a)?'⚠ ':'';
  const row=x=>`<li><span class="at num">${when(x.at)}</span><span class="who">${icon(x.action)}${esc(x.action)}${x.detail?` <span class="muted">· ${esc(x.detail)}</span>`:''}</span></li>`;
  const signed=roster.filter(r=>r.acts.some(a=>a.action==='Signed in')).length,bad=acts.filter(a=>/Wrong|Locked/.test(a.action)&&new Date(a.at)>wk).length;
  return `<h2>Player activity</h2><p class="small muted">What each player did after signing in with their PIN, plus answers and wrong PINs on the availability link. Kept 180 days; only you can see it.</p>
  <div class="kpis">${kpi(signed+' / '+roster.length,'Players who signed in')}${kpi(roster.filter(r=>r.acts[0]&&Date.now()-new Date(r.acts[0].at)<7*864e5).length,'Active this week')}${kpi(bad,'Wrong PINs this week',bad?'warnk':'')}</div>
  <details class="panel"><summary><b>Latest from everyone</b></summary><ol class="alog">${acts.slice(0,40).map(x=>`<li><span class="at num">${when(x.at)}</span><span class="who"><b>${esc(pById(x.player_id)?.name||x.player_id)}</b> ${icon(x.action)}${esc(x.action)}${x.detail?` <span class="muted">· ${esc(x.detail)}</span>`:''}</span></li>`).join('')||'<li class="muted">Nothing yet</li>'}</ol></details>
  <input id="pactq" data-a="pactq" placeholder="Search a player" value="${esc(pactQ)}" style="margin:10px 0">
  <div class="mlist">${roster.filter(r=>!q||r.p.name.toLowerCase().includes(q)).map(({p,acts:a})=>{const last=a[0],ins=a.filter(x=>x.action==='Signed in').length,wr=a.filter(x=>/Wrong|Locked/.test(x.action)&&new Date(x.at)>wk).length;
    return `<details class="panel pact"><summary><div class="mgrh"><div><b>${esc(p.name)}</b><div class="small muted">${ins} sign-in${ins===1?'':'s'}${wr?` · <span style="color:var(--bad)">${wr} wrong PIN${wr===1?'':'s'} this week</span>`:''}</div></div><span class="pill ${last?(Date.now()-new Date(last.at)<864e5?'ok':'meh'):''}">${last?'Active '+ago(last.at):'Never'}</span></div></summary>
      <div class="row" style="margin-top:8px"><button class="btn small" data-a="pview" data-id="${p.id}">👁 View as player</button><button class="btn small" data-a="editp" data-id="${p.id}">Access & PIN</button>${p.noLogin?'<span class="pill bad">Access off</span>':''}</div>
      ${a.length?`<ol class="alog">${a.slice(0,60).map(row).join('')}</ol>`:'<p class="small muted">No activity yet.</p>'}</details>`}).join('')}</div>`}

  ${sec('ppage','Player pages and PlayStyles',`<ul><li>Tap a player → <b>📄 Player page</b> for an EA FC-style page: card, nation, club, tier, position with best position, age, foot, height, skill and weak-foot stars, shirt number, apps, goals, assists, POTM, tournaments and titles.</li>

  ${sec('security','Security',`<ul><li>Nothing loads without signing in. Managers use passwords; players use their own PIN (4–6 digits; 6 is safer).</li>
    <li><b>PIN protection:</b> 5 wrong PINs lock a name for 1 hour, 10 for 24 hours. If the whole team sees more than 30 wrong PINs in a day, every wrong PIN locks that name for 24 hours. Managers with vote alerts get a notification for every lock and for unusual activity. Everything shows in Player activity.</li>

  ${sec('squad','Squad and players',`<ul><li><b>Player sign-in</b> (Settings → Player portal) has three modes: <b>On</b> (portal open), <b>PIN setup only</b> (players see their names and create a PIN, but can’t open the portal yet; great before a launch) and <b>Off</b>.</li><li><b>🔔 Admin activity</b> (admin only): the bell in the header shows a red count of new major actions by managers and players (last 14 days) and opens the feed, filterable by Managers or Players. Phone alerts for the same events: Managers → <b>Admin alerts</b> (uses your Vote alerts ntfy channel).</li><li><b>Portal access</b> (admin, in the Squad setup panel): <b>Pause all</b> closes the portal for everyone; then tap names to give just those players access. <b>Resume all</b> opens it to everyone again. You can also tick <b>Can open the player portal</b> on a player’s card. Paused players still see their name and can create a PIN.</li><li><b>📱 Player app setup</b> (top of Squad): how many active players have made their PIN, who is still missing (tap a name to open their card), and <b>Copy WhatsApp reminder</b>: an announcement with the launch date, link, steps and the list of who still needs a PIN. Admin also sees when each player last signed in. A player with a PIN but “not signed in yet” made it on the availability link.</li>
    <li>Each player has a name, one position (DEF, MID or FWD), shirt number, nation, favourite club, photo, <b>Active this season</b>, <b>★ Star player</b>, and nine starting ratings from 1 to 10.</li>
    <li><b>Add player</b> in Squad; new players start at 7 in everything. Returning players start from last season’s averages.</li>

  ${sec('ratings','Ratings and scores',`<p>Nine attributes: Passing, Shooting, Defending, Ball Skill, Mindset, Team Work, Speed, Stamina, Strength.</p>

  ${sec('balance','How teams are balanced (the full recipe)',`<p>Press <b>Balance</b> and the app builds the fairest teams it can in about 0.15 seconds. Here is exactly what it does, step by step.</p>
    <h4>1. Every player gets a rating profile</h4>
    <ul><li>Each player has 9 match attributes, each scored 1–10: Passing, Shooting, Defending, Ball Skill, Mindset, Team Work, Speed, Stamina, Strength.</li>
    <li>Their value = an average of their <b>starting ratings</b> (weighted by “Base weight” in Settings) and <b>every match rating</b> they have had (or only the last N matches if “Recent matches only” is set).</li>
    <li>From these, four area scores out of 100:
      <ul><li><b>Attack</b> = everything except Defending</li><li><b>Midfield</b> = everything except Speed and Strength</li><li><b>Defence</b> = everything except Ball Skill</li><li><b>Pace</b> = Speed</li></ul></li>
    <li><b>OVR</b> = the average of the four. <i>Example:</i> Attack 74, Midfield 72, Defence 68, Pace 80 → OVR 74.</li></ul>
    <h4>2. Extra features read for each player</h4>
    <ul><li><b>Position</b> (DEF / MID / FWD), or today’s override if you changed it on Match Day.</li>
    <li><b>★ Star</b> tick.</li>
    <li><b>Chemistry style type</b> (attacking, midfield or defensive style, e.g. Hunter = attacking, Anchor = defensive).</li>
    <li><b>PlayStyles earned</b> from their ratings (e.g. Speed 78+ = Quick Step).</li>
    <li><b>Reliability</b>: anyone with a late drop or a no-show.</li>
    <li><b>Team chemistry</b>: how players rated each other 1–5 in the Squad tab (both directions averaged).</li>
    <li><b>Last week’s teammates</b> (if “Mix up last week’s teammates” is on).</li></ul>
    <h4>3. Many starting splits, each improved by swapping</h4>
    <ul><li>Players are sorted by position, then by OVR with a small random shuffle (so every run is a bit different). Locked players 🔒 go to their team first.</li>
    <li>Each player goes to the team that is smallest, has fewest of their position and the lowest total so far (a “snake draft”).</li>
    <li>Then every possible <b>one-for-one swap</b> between two teams is tried. A swap is kept only if it lowers the <b>penalty score</b> below. This repeats until no swap helps.</li>
    <li>This is done up to <b>80 times</b> from different starts (at least 6). The <b>8 best different results</b> are kept; <b>Another balanced option</b> steps through them.</li></ul>
    <h4>4. The penalty score (lower = fairer)</h4>
    <div class="tbl"><table><tr><th>Rule</th><th>Penalty</th><th>Example</th></tr>
    <tr><td>Team sizes differ by more than 1</td><td>1000 per extra player</td><td>8 v 6 = 1000</td></tr>
    <tr><td>Two ★ stars of the same position on one team</td><td>800 per extra star</td><td>2 star FWDs together = 800</td></tr>
    <tr><td>DEF / MID / FWD counts differ</td><td>6 per player of difference, +60 for each beyond 1</td><td>3 DEF v 1 DEF = 12 + 60 = 72</td></tr>
    <tr><td>Gap in team average OVR</td><td>12 per point</td><td>74.0 v 72.5 = 18</td></tr>
    <tr><td>Gap in Attack, Midfield or Defence</td><td>3 per point each</td><td>Defence 70 v 66 = 12</td></tr>
    <tr><td>Gap in Pace</td><td>1.5 per point</td><td>Pace 80 v 72 = 12</td></tr>
    <tr><td>Chemistry-style types uneven (attacking / midfield / defensive styles)</td><td>5 per style of difference</td><td>3 attacking styles v 0 = 15</td></tr>
    <tr><td>Earned PlayStyles uneven</td><td>1.2 per PlayStyle of difference</td><td>9 v 4 = 6</td></tr>
    <tr><td>Team chemistry gap (average teammate rating)</td><td>6 per point of gap</td><td>4.0 v 3.0 = 6</td></tr>
    <tr><td>Good chemistry inside a team (bonus)</td><td>−2 per point of each team’s average</td><td>avg 4.5 = −9 (rewarded)</td></tr>
    <tr><td>Last week’s teammates together</td><td>1.2 per pair</td><td>5 repeat pairs = 6</td></tr>
    <tr><td>Unreliable players bunched</td><td>4 per player of difference, +40 for each beyond 1</td><td>3 v 0 = 12 + 80 = 92</td></tr></table></div>
    <p>So the order of importance is: equal sizes → stars spread → positions spread → equal strength → equal style mix and chemistry → small tie-breakers.</p>
    <h4>5. A worked example</h4>
    <p>16 players, 2 teams. Split A: OVR 75.0 v 72.0 (gap 3 = 36), Defence gap 6 (18), two star FWDs together (800) → <b>854</b>. Swap one star FWD for a similar FWD → stars split (0), OVR 73.6 v 73.4 (2.4), Defence gap 2 (6) → <b>8.4</b>. The swap is kept because 8.4 is lower.</p>
    <h4>6. After the teams are made</h4>
    <ul><li><b>Formation</b> is picked automatically from each team’s DEF/MID/FWD mix (every line gets at least 1 player). <i>Example:</i> 7 on the pitch with 3 DEF, 2 MID, 3 FWD → 3-2-2 or similar; you can choose any shape.</li>
    <li><b>Who starts</b>: the best Defence scores fill DEF, best Midfield fill MID, best Attack fill FWD. With Keeper ticked, the best remaining defender goes in goal. The rest are subs.</li>
    <li><b>Pitch chemistry</b> (Team Management): each starter earns 0–3. +1 for playing in their area (their position, best position, or a chemistry style for that line), plus 0–2 from how they rate the 3 nearest teammates (avg 4+ = 2, 3+ = 1, below 3 = 0, no ratings = 1). <i>Example:</i> a MID in midfield next to teammates they rate 4.3 = 1 + 2 = 3/3.</li>
    <li><b>Best positions for chemistry</b> tries every swap of positions and keeps the arrangement with the highest total. Tap a player to see green / amber / red lines to everyone and a suggested swap with the chemistry gain.</li>
    <li>Team ratings shown are averages of all players (subs included). An overall gap under 1.5 points is marked <b>Balanced</b>.</li></ul>
    <h4>What does NOT affect balancing</h4>
    <ul><li>Card designs, nicknames, favourites, XP and badges. Skill ★ and weak-foot ★ are shown on cards but are not used.</li>
    <li>Manager overrides of the 29 FC attributes change how a player’s page looks, not their match ratings. To change balancing, change their ratings.</li></ul>`)}

  ${sec('stars','Star players',`<ul><li>Tick ★ on a card. Balancing never puts two same-position stars on one team if it can avoid it (800 penalty); a warning pill shows if you do it by hand.</li>
    <li>Pick the star’s card design on their card (<b>Star card</b>); leave it on “Earned card” to use gold / silver / bronze.</li></ul>`)}

  ${sec('chem','Chemistry, chemistry styles and PlayStyles',`<ul><li><b>Team chemistry</b>: players rate each teammate 1–5 in the Squad tab. Only managers see it. It is used in balancing and on the pitch (see above).</li>
    <li><b>Chemistry styles</b> (23, like EA FC: Hunter, Hawk, Marksman, Finisher, Deadeye, Sniper, Engine, Maestro, Architect, Powerhouse, Shadow, Anchor, Sentinel, Wall and more): each player picks one. It adds +3 to the stat groups it boosts on their player page (Basic adds +1 to all) and counts as attacking, midfield or defensive in balancing. The player page shows the best styles for them.</li>
    <li><b>PlayStyles</b> (36): earned automatically from match ratings, or awarded / removed by you on the player’s card. Gold “+” = elite (88+). Players pick up to 5 of their own; tapping one shows what it means. Goalkeeper ones are only ever awarded by you.</li></ul>`)}

  ${sec('attrs','Ratings, FC attributes and the player page',`<ul><li>The 9 match attributes (1–10) are the real ratings. They make the six FC groups (PAC, SHO, PAS, DRI, DEF, PHY) and 29 FC attributes (Acceleration, Finishing, Vision…).</li>
    <li>You can <b>override any of the 29 attributes</b> with a slider on the player’s card. Overrides change the player page and card numbers only.</li>
    <li><b>Strip under the card</b> on the player page: <b>R/L</b> = preferred foot, <b>3★</b> = skill moves, <b>3WF</b> = weak foot (out of 5), green number = best role rating.</li>
    <li><b>Best ratings / roles</b>: position rating × 0.7 + the role’s two key attributes × 0.3. <i>Example:</i> ST 76 with Shooting 82 and Speed 78 → 76×0.7 + 80×0.3 = 77.2.</li>
    <li><b>AcceleRATE</b>: Acceleration minus Strength, with height. 10+ faster and up to 182 cm = Explosive; 5+ = Mostly Explosive; Strength 10+ higher and 174 cm+ = Lengthy; 5+ = Mostly Lengthy; else Controlled.</li></ul>`)}

  ${sec('analytics','Stats dashboards',`<ul><li><b>Stats</b> tab: spider chart of a player’s attributes, a form line over their matches, and leaderboards.</li>
    <li><b>Team vs team</b>: pick a match, then compare any two of its teams on a spider chart.</li></ul>`)}

  ${sec('peer','Teammates rate each other',`<ul><li>For 7 days after a match, each player rates <b>only the teammates they played with that night</b>: 1–10 for how they played, plus chemistry stars. The app asks them the first time they open it after the match, and each rating earns XP.</li>
    <li>Once ${peerMin()}+ teammates have rated a player (Settings: <b>Teammates’ ratings count after</b>), their average blends with your rating for that match (Settings: <b>Teammates’ ratings weight</b>, default 50%). If you didn’t rate that player, the teammates’ average is used on its own.</li>
    <li>Fairness, all automatic: players can’t rate themselves or other teams.
      <ul><li><b>Harsh or generous raters are evened out.</b> Someone who gives everyone 5s has their 5 count as average.</li>
      <li><b>Outliers are ignored.</b> A score 3+ points away from what the other teammates gave doesn’t count. <i>Example:</i> 8, 8, 2 → the 2 is ignored → 8.</li>
      <li><b>Grudges and favouritism are spotted.</b> If one player rates another 2.5+ away from everyone else in 3+ matches, their ratings of that player are ignored and the pair shows under <b>⚠ Possible bias</b>.</li>
      <li>Once 5+ have rated, the single highest and lowest are also dropped.</li></ul></li>
    <li>You decide too: on 👥 Peer ratings tap any rating to exclude or include it, or <b>Mute for good</b> a biased pair. Players are never told.</li>
    <li>See who gave what: <b>Matches &amp; Ratings → 👥 Peer ratings</b> on any match. The rating screen also shows each player’s teammates’ average. Players never see each other’s answers.</li>
    <li><i>Example:</i> you rate a player 6 in every area; 6 teammates give 9, 8, 8, 7, 7 and 3. The 9 and 3 are dropped, so the average is 7.5. At 50% each area becomes 6.75.</li></ul>`)}
  ${sec('compete','Player competition',`<ul><li>Players get a <b>Compete</b> tab: performance vs their usual, weekly challenges (2 on the pitch, 1 off), daily streak, weekly XP league with top-3 bonuses, a weekly rival, match predictions, Team of the Week reveal and a season track.</li>
    <li>Performance is the core: beating their usual match rating +40, improving their focus area +30, best match yet +75, on top of turning up, winning, goals, assists, POTM and Team of the Week. Daily check-ins are only +5.</li>
    <li>Only XP is ranked. Ratings stay private: players only see ticks for their own improvement.</li>
    <li>Each player’s app works out their weekly XP and sends it to the league when they open it.</li>
    <li>Turn it all off in Settings → <b>Competition for players</b>.</li></ul>`)}
  ${sec('unlocks','Unlocks and exclusives (admin)',`<ul><li>Card designs, chemistry styles and PlayStyles open up as players earn XP; they get a notification for each unlock. Set the XP needed with the sliders in Settings → <b>Unlocks &amp; exclusives</b> (far left = free).</li>
    <li><b>Only me</b> keeps a design or style for your own player profile; nobody else sees it, and the server refuses it for anyone else.</li></ul>`)}

  ${sec('search','Search, changelog and tips',`<ul><li>🔍 in the header (or Ctrl/Cmd + K) finds any feature or setting and jumps straight to it.</li>
    <li><b>Changelog</b> tab (admin only) lists every version and what changed.</li>
    <li>Numbers use sliders; scores, goals and quantities use − / + buttons.</li></ul>`)}

  ${sec('manual','Moving and locking',`<ul><li>Move players with the team dropdown; 🔒 keeps them there when you balance again. Team names and kit colours are in each team header.</li>
    <li>Once teams exist, tapping a player in adds just them to the team that needs them most; tapping out removes only them.</li></ul>`)}

  ${sec('form','Formations and the pitch',`<ul>
    <li>On pitch per team = starters incl. keeper (now ${onPitch()}); the rest are subs. Tick <b>Keeper</b> to reserve a goalkeeper. Pick any DEF-MID-FWD shape.</li>
    <li><b>Draft options</b> (Match Day, above Teams): try different setups for the same match, e.g. 27 players as <b>4 teams (7·7·7·6)</b> or <b>3 teams of 9</b>. Balance, then <b>＋ Save current teams as an option</b>. Every manager sees the options live and can <b>Open</b>, 👍 vote and 💬 comment. Press <b>Publish this</b> on the one you agree on; the app then asks before deleting the unused drafts. All drafts are deleted automatically at kick-off.</li>
    <li><b>Uneven teams</b> (e.g. 27 players → 7·7·7·6): the short team borrows a player from the team that’s resting that game, as goalie or defender. It’s unofficial: that player stays on their own team and nothing is counted for the borrow. The app marks it on the team card, the share image, the WhatsApp text and the short team’s players’ screens.</li>
    <li><b>Match day in 3 steps</b> (shown at the top of Teams):
      <ol><li><b>Build teams</b>: balance, move players, pick formations. Only managers see them.</li>
      <li><b>Publish teams to players</b>: everyone sees their team on Me. Late drop? Change anything and press <b>Update players’ teams</b>; nothing is locked until kick-off. <b>Unpublish</b> hides them again.</li>
      <li><b>🏁 Match finished</b> (appears from kick-off): saves the match with the final teams. The POTM vote, teammates’ ratings, the rating prompt and results open for players <b>1 hour after the session ends</b> (e.g. 9:00 PM finish → 10:00 PM), or right away if you tap it later than that.</li></ol>
      Then enter scores, goals and your ratings in Matches &amp; Ratings as before. Until it opens, players still see the match as their upcoming teams.</li>
    <li>The <b>pitch</b> is an angled FC-style pitch with mini player cards (rating, position, photo, name, flag, club, shirt number, captain/★). Editable line-ups open in <b>Team Management</b>: Tactics (team ratings), Formation, Squad Selector (subs), Kit Numbers (show or hide numbers) and Player Stats (tap a card; bars are green 75+, orange 60–74, red below 60). The ratings toggle (eye) hides every number here too. Shared images and the player portal never show ratings.</li>
    <li><b>Back</b> (phone or browser) walks back through every screen and pop-up you opened, e.g. player page → player card → Squad. The app always opens on Match Day.</li>
    <li><b>Tactic Board</b> (Team Management menu): drag players and ball, passes, runs, opponents, chemistry links (green good, amber ok, red poor) and step-by-step playback; save it as an image. Pick a <b>Captain</b> for each team in Formation; captains get the board on their Next match card.</li>
    <li><b>Show pitches</b> (Teams header) turns the line-up card on or off for every team at once. Kits: blue, green, <b>yellow</b>, orange, red, purple, black.</li>
    <li>Next match, Who’s playing, Teams and each match on Matches &amp; Ratings <b>fold away</b>; the header keeps the key facts (date, count, balance gap, scores, POTM). The app remembers what you folded.</li>
    <li>On a wide screen (desktop, 1440p, 4K) Match Day shows setup and Who’s playing on the left and all teams side by side on the right; other pages spread into columns.</li>
    <li>Tournaments have a <b>Coach</b> and <b>Manager</b>; each game in Results can name different ones.</li>
    <li>Theme button switches between dark and light.</li>
    <li>The line-up card: a green perspective pitch on white, each player in a circle ringed in the <b>team’s kit colour</b>, shirt number top-left and a badge top-right. Players without a photo get a kit-coloured circle with initials.</li>
    <li>Each pitch card shows the nation flag and favourite-club crest together.</li>
    <li>Tap two players on the pitch or in subs to swap them. The strip above shows the on-pitch (starters only) rating.</li></ul>`)}

  ${sec('share','Sharing to WhatsApp',`<ul><li><b>All teams</b> card: date, time${s.venue?', venue':''}, rotation and every team. <b>Team on pitch</b>: one team’s line-up card.</li>
    <li><b>Save as image</b> or <b>Copy text for WhatsApp</b>. Nothing shared ever contains ratings.</li><li>Images are saved at the highest quality the phone allows. In WhatsApp, tap <b>HD</b> before sending (or send as a Document) so WhatsApp doesn’t shrink it.</li></ul>`)}

  ${sec('rot','Match-night rotation',(()=>{const r=rotation({teams:[{},{},{}]}),r4=rotation({teams:[{},{},{},{}]});
    return `<p>Three teams: <b>A v B → B v C → C v A</b>, repeated. Four teams use a 6-game round. The app fits as many games as the session allows (no break after the last game), then trims so every team plays the same number.</p><p>Now (${r.tot} min, ${r.g}-min games, ${r.c}-min breaks): 3 teams = <b>${r.games} games, ${r.each} each</b>${r.spare?`, ${r.spare} min spare`:''}; 4 teams = <b>${r4.games} games, ${r4.each} each</b>${r4.spare?`, ${r4.spare} min spare`:''}. Change these in Settings.</p>`})())}

  ${sec('save','Saving a match',`<ul><li><b>Save match</b> stores teams, kits and line-ups. Saving while editing updates the same match. <b>Edit teams</b> on a past match reloads it; <b>Start a new match instead</b> clears Match Day.</li></ul>`)}

  ${sec('attend','Attendance (after every game)',`<p>This is the most important step after a game: it decides appearances and reliability.</p><ul>
    <li>Matches &amp; Ratings → <b>Take attendance</b>. Everyone in the teams starts as <b>✅ Present</b>; tap <b>⏰ Late</b> or <b>✕ No-show</b>, then Save. The button turns into “✓ Attendance”.</li>
    <li><b>No-show:</b> no appearance (not in attendance %, W-D-L, streaks, badges), their rating for that match is removed and the rate screen marks them “not rated”, +1 in the No-shows column, lower on Most reliable, ✕ in Season attendance, −100 XP, and spread across teams when balancing.</li>
    <li><b>Late:</b> counts as played, shows in the Late column, earns 100 XP instead of 150, and breaks the “Always On Time” badge.</li>
    <li>Players only ever see their <b>own</b> no-shows; other players’ no-shows are removed from what their phone receives.</li>
    <li><b>Season attendance</b> (Stats) shows every player against every scheduled date: green = played, red = missed, ✕ = no-show, grey = upcoming. A game counts once its match is saved.</li></ul>`)}

  ${sec('rate','Rating, goals and notes',`<ul>
    <li><b>Rate players</b>: one row per player: −1, −½, =, +½, +1 compared with their usual level (= is default). <b>All 9 ratings</b> opens detail. <b>Skip</b> leaves a player unrated.</li>
    <li><b>⚽ Goals / 🅰️ Assists</b> boxes under each player feed Top scorers, Top assists, profiles, XP, badges and personal bests.</li>
    <li><b>Note</b> (optional, 140 characters): shown only to that player on their profile, e.g. “Great pressing tonight”.</li>
    <li><b>Save ratings</b> saves everyone; averages, balance, cards, Team of the Week and growth update immediately.</li></ul>`)}

  ${sec('results','Scores, wins and Player of the Match',`<ul><li>Type each team’s total goals; results count once every team has a score. Most goals = win, tied top = draw, others lose.</li>
    <li><b>🏆 Player of the Match</b>: pick one per match. Players can vote from their portal from match day until the end of the 2nd day after it (Matches → <b>POTM vote message</b> copies a WhatsApp message with the result, scorers, link and closing time); <b>Players voted: …</b> shows the top picks next to your dropdown. Your pick is the official one.</li></ul>`)}

  ${sec('stats','Stats and reliability',`<ul>
    <li>Tiles, charts (players per match, balance gap), leaderboards (Top rated, Most improved, ⚽ Top scorers, 🅰️ Top assists, Ever-present, POTM, Winners, Most reliable, ✕ No-shows, Late drops, Late joins) and a sortable table.</li>
    <li>Table columns: OVR, ± since start, Apps, ⚽, 🅰️, Att. (played ÷ matches), Win %, 🏆, Answered, No-shows, Late, Late drops, Late joins, Notice (average time between first answer and kick-off).</li>
    <li><b>Most reliable</b> = answer rate − 20 per late drop − 40 per no-show − 5 per late arrival − 2 per changed answer.</li></ul>`)}

  ${sec('awards','Awards',`<ul><li>Stats → Awards: This month, Last month or Season → share card. <b>Player of the Month / Season</b> stays hidden until you pick one from the list (the top suggestion is marked). Team of the Month (${onPitch()} best by position) and Most wins show automatically. <b>Ever-present</b> appears once 5+ Saturdays have been played in that period. No-shows don’t count as appearances.</li></ul>`)}

  ${sec('cards','Player cards and photos',`<ul><li><b>Gold</b> 78+, <b>silver</b> 71–77, <b>bronze</b> 70 and below; ★ stars get a black special card. Six stats: PAC = Speed, SHO = Shooting, PAS = Passing, DRI = Ball Skill, DEF = Defending, PHY = Strength + Stamina.</li>
    <li><b>Photo:</b> tap a card → Add photo → drag and pinch into the frame (eyes on the gold line). <b>✨ Remove background</b> gives the cut-out look. A small thumbnail is made automatically for pitches and players’ phones.</li>
    <li><b>Nation</b> and <b>Favourite club</b> (about 70 clubs, official crests) show on the card and pitch.</li>
    <li><b>👁 / 🙈</b> in the header blurs every rating for safe screenshots (cards turn gold, lists sort by name).</li></ul>`)}

  ${sec('portal','The player portal',`<ul>
    <li>Players open the <b>same app link</b>, tap <b>Player</b>, choose their name and enter their PIN. They stay signed in on that phone.</li>
    <li><b>Me</b>: next game (countdown, going count, in/out buttons, waitlist), their card, level and XP, Player of the Match vote, your note, weekly focus, Team of the Week, badges, growth, numbers (matches, W-D-L, win rate, goals, assists, G+A per match, POTM, attendance, streaks), personal bests, teammates, last match and reliability.</li>
    <li><b>Matches</b>: every match they played with scores, their line-up card and other teams. <b>Availability</b>: the season schedule marked Played / Missed / No-show / answer, and their link history. <b>Leaders</b>: Most improved (ranks only), Top scorers, Top assists, appearances, win rate, POTM. <b>Account</b>: edit card (if allowed), change PIN, sign out. <b>Guide</b>: a player-friendly help page.</li>
    <li>They never see anyone else’s ratings or no-shows. Their own ratings stay hidden unless you allow them.</li>
    <li><b>Managers who play:</b> tap <b>My profile</b> (last tab), pick your name and PIN; <b>↩ Manager</b> switches back without signing out. The PIN is asked every time.</li></ul>`)}

  ${sec('motiv','Growth, XP and badges',`<ul>
    <li><b>Card colour</b> reflects their real level even when ratings are hidden, with a “% of the way to Silver/Gold” bar and an upgrade animation. After Player of the Match or Team of the Week they get a glowing <b>In-Form</b> card.</li>
    <li><b>Weekly focus</b>: their weakest area for their position, with a coaching tip; ✅ when they beat their usual in that area.</li>
    <li><b>Growth arrows</b>: each attribute, last 3 rated matches vs the 3 before (or their start).</li>
    <li><b>Team of the Week</b>: best match rating per position from the latest rated match. <b>Most improved</b>: recent form vs start, ranks only.</li>
    <li><b>XP</b>: play on time +150, arrive late +75, say OUT 0, no-show −200 (and no link points), win +50, draw +20, goal +40, assist +25, POTM +200, Team of the Week +100, answer 2+ days early +50 (else +20), each badge +100, chemistry +10 per first rating of a teammate, +15 per teammate rated within 7 days of a match, +150 with the whole squad rated. Levels: Rookie → Squad Player → Regular → Starter → Key Player → Fan Favourite → Captain Material → Club Legend → Icon. XP is personal, never ranked.</li>
    <li><b>Badges</b>: First Goal, Hat-trick, Double Figures, Goal Machine, Playmaker, Provider, On Fire, Unstoppable, Iron Man, Regular, Veteran, Match Winner, Hat-trick Hero, Team of the Week, Early Bird, Rock Solid, Always On Time, Perfect Month, Winner, On the Rise.</li>
    <li>Turn growth features off with Settings → “Players see their growth”.</li></ul>`)}

  ${sec('control','Controlling player access (admin)',`<ul>
    <li>Squad → tap a player → <b>Profile access</b> box: devices signed in, last seen, locked or no PIN yet.</li>
    <li><b>👁 View as player</b> opens their portal exactly as they see it (also in Managers → Player activity). Buttons do nothing in preview; <b>Exit preview</b> returns.</li>
    <li><b>Sign out everywhere</b> ends all their sessions. Untick <b>Can sign in to their player profile</b> and save to block them (they’re signed out on their next refresh). <b>Reset PIN</b> clears their PIN.</li>
    <li>Settings → untick <b>Players can sign in</b> to switch the portal off for everyone.</li></ul>`)}

  ${sec('managers','Managers and activity',`<ul><li>Until <b>Nov 3</b> every tap and setting change a manager makes is recorded (not yours). See it under each manager’s <b>Activity</b> on the Managers tab.</li><li><b>Sign out</b> on a manager (or <b>Sign out all managers</b>) ends their sessions; their devices sign out within a minute and they need their password to get back in.</li>
    <li><b>Admin</b> (${ADMIN_EMAIL}) is the only account with the <b>Managers</b> tab. Add a manager with a username and password (8+ characters); send the login privately. <b>Set password</b> replaces it, <b>Remove</b> deletes the login (their changes stay). Managers can’t use Forgot password.</li>
    <li>Managers see and change everything except the Managers tab and player access controls.</li>
    <li><b>Manager activity</b>: “Active … ago” and a log (opened app, players, teams, matches, ratings, attendance, links, PINs, settings, schedule), 90 days.</li>
    <li><b>Player activity</b>: sign-ins, pages viewed, matches opened, in/out answers (profile and link), POTM votes, card edits, PIN changes, wrong PINs and lock-outs (⚠), admin sign-outs. 180 days. Search a player and tap to open their log.</li></ul>`)}

  ${sec('settings','Every setting explained',`<div class="tbl"><table><tr><th>Setting</th><th>What it does</th></tr>
    <tr><td>Last season counts as</td><td>How many matches the starting ratings weigh (now ${s.baseW})</td></tr>
    <tr><td>Average over</td><td>All matches or only the last N</td></tr>
    <tr><td>Last minute means</td><td>Window for late drops and late joins (now ${lateH()} h)</td></tr>
    <tr><td>Match time</td><td>Usual time; a schedule line can override it</td></tr>
    <tr><td>Session / Game / Break</td><td>Minutes used for the rotation</td></tr>
    <tr><td>Max players per night</td><td>Turns on the waitlist</td></tr>
    <tr><td>Spread players with late drops</td><td>Balancing spreads late droppers and no-shows</td></tr>
    <tr><td>Every Saturday at 9 PM…</td><td>Auto close/open links following the schedule</td></tr>
    <tr><td>Players can sign in</td><td>Player portal on/off for everyone</td></tr>
    <tr><td>Players can see their own ratings</td><td>Shows their OVR and attributes (off = blurred)</td></tr>
    <tr><td>Players can set their own number, nation, club</td><td>Self-edit in Account; numbers stay unique</td></tr>
    <tr><td>Players see their growth</td><td>Card colour, focus, arrows, upgrades, bests</td></tr>
    <tr><td>Badge next to each player</td><td>Nation flag or club crest on pitches</td></tr>
    <tr><td>Mix up last week’s teammates</td><td>Avoids repeating last match’s pairs</td></tr>
    <tr><td>Season schedule / Venue</td><td>Game dates, special start times, location</td></tr>
    <tr><td>Vote alerts</td><td>Your phone notifications for answers</td></tr></table></div>`)}

  ${sec('data','Privacy, sync and devices',`<ul>
    <li>The app opens to a sign-in screen with <b>Player</b> and <b>Manager</b>. Without signing in nothing loads. Anyone with the link can see the list of squad names on the Player tab, nothing else.</li>
    <li>Managers’ data lives in your private Supabase database and syncs to every signed-in device within seconds. Players’ phones only receive their own profile plus names, positions, numbers, nations, clubs and small photos of the squad, never other players’ ratings, notes or no-shows.</li>
    <li><b>Forgot password?</b> (admin) emails a reset link. The app works offline at the gym for viewing; changes need a connection.</li>
    <li><b>Theme</b> ◐ cycles Auto, Dark and Light per device.</li></ul>`)}

  ${sec('backup','Backup, delete and reset',`<ul><li><b>Export backup</b> saves squad, matches and settings to one file; <b>Import backup</b> adds or replaces by ID.</li>
    <li><b>Delete player</b> (Undo for a few seconds) and <b>Delete match</b> (removes its ratings, goals and attendance) both need a second tap.</li></ul>`)}
  ${sec('tip','Support link',`<ul><li>The same pop-up asks for a <b>★ 1–5 app rating and a written comment</b>. Only you see them: Managers tab → <b>Feedback</b>, under <b>App rating</b>, with the average.</li><li>A small <b>☕ Support the builder</b> card (Ko-fi) shows at the bottom of the Club page and the guides, for managers and players. Tapping it shows a short confirmation popup first. Tips are optional and go to the Ko-fi account. Only the admin can turn it off or change the link.</li></ul>`)}${tipCard(true)}`;
}
function vpGuide(){const d=PM.data,g=d.growth,sec=(id,t,body,open)=>`<details class="gsec" ${open?'open':''}><summary>${t}</summary><div class="gbody">${body}</div></details>`;
  return `<h2>Your player guide</h2><p class="gintro">Everything about your Airdrie United profile in two minutes.</p>

  ${sec('in','Signing in and your PIN',`<ul><li>Open the team app link, tap <b>Player</b>, choose your name and type your PIN. You stay signed in on your phone.</li>

  ${sec('show','Turning up (attendance)',`<ul><li>After each game the managers mark everyone <b>Present</b>, <b>Late</b> or <b>No-show</b>.</li>

  ${sec('badges','Badges',`<div class="bdg">${badgeList().map(b=>`<div class="bd got"><span class="bi">${b.ic}</span><b>${esc(b.n)}</b><span class="small muted">${esc(b.desc)}</span></div>`).join('')}</div>`)}
  ${sec('totw','Team of the Week and Player of the Match',`<ul><li><b>Team of the Week</b> is the best performer in each position from the last rated match. Get picked and you earn XP, a badge and an In-Form card.</li>

  ${sec('page','Your player page and PlayStyles',`<ul><li>Me → <b>📄 My player page</b>: your FC-style page with your details, apps, goals and titles, your six stat groups, your rating in every position on a pitch, and your <b>PlayStyles</b>.</li><li>PlayStyles unlock when your match ratings reach a level (e.g. Rapid at Speed 82+), or when the managers award one. Awarded ones are coloured (gold = elite “+”); the grey ones are still to earn. Only managers set ratings, skills and PlayStyles.</li></ul>`)}
  ${sec('peerp','Rating your teammates',`<ul><li>After each match you get 7 days to rate the teammates you played with: <b>1–10</b> for how they played and <b>★</b> for how well you click. +10 XP per match rating, +15 per chemistry.</li>
    <li>Only managers see your answers. Everyone’s ratings together help set fair ratings and better teams, so be honest.</li></ul>`)}
  ${sec('compete','Compete: get better every week',`<ul><li><b>On the pitch comes first.</b> After every rated match you see if you beat your usual (+40 XP), improved your focus area (+30) and whether it was your best match yet (+75). Only ticks, never numbers.</li>

    <li><b>Daily streak 🔥</b>: open the app every day. +5 a day and bonuses at 3, 7, 14, 30, 60 and 100 days. Miss a day and it starts again.</li>
    <li><b>Weekly league</b>: everyone ranked by XP earned since Monday. Top 3 win +150 / +100 / +50. Only XP is ranked, never ratings.</li>

  ${sec('styles','Chemistry styles and PlayStyles',`<ul><li><b>Chemistry style</b> (Edit my profile): pick one of 23, like Hunter (Pace + Shooting) or Anchor (Defending + Physical). It boosts those stats on your player page, and your page shows which styles suit you best.</li>

    <li>White icon = PlayStyle, gold icon = PlayStyle+ (elite).</li></ul>`)}
  ${sec('unl','Unlocks',`<ul><li>New card designs, chemistry styles and PlayStyles unlock as you earn XP. 🔒 shows the XP needed; you get a notification when one opens.</li>

  ${sec('strip','Reading your player page',`<ul><li>Under your card: <b>R/L</b> = preferred foot, <b>3★</b> = skill moves, <b>3WF</b> = weak foot (out of 5)${d.showRatings?', and the green number is your best role rating':''}.</li>

    <li><b>Roles</b> (like ST Poacher or CAM Playmaker) show the positions and jobs that suit you most. ++ = a perfect fit.</li></ul>`)}
  ${sec('teams','How the managers make teams',`<ul><li>The app balances teams using everyone’s match ratings, positions, ★ star players, chemistry styles, PlayStyles and the teammate chemistry you rate in the Squad tab. Rating your teammates honestly helps make fairer, better teams.</li>
    <li>It also spreads out players who often drop late, and can mix up last week’s teammates.</li></ul>`)}
  ${sec('find','Search and sharing',`<ul><li>🔍 in the header finds anything in the app.</li>
    <li>Saved images are full quality. In WhatsApp, tap <b>HD</b> before sending (or send as a Document) to keep them sharp.</li></ul>`)}
  ${sec('club','The Club page',`<ul><li>The club cabinet: trophies, kits, balls, training gear and nets on shelves. Tap anything to see its photos. Also our grounds: Bayview in summer, Genesis Centre in winter.</li><li>The Tournaments tab shows the tournaments the managers have shared with you, including past ones you played in.</li></ul>`)}
  ${sec('tabs','The other tabs',`<ul><li><b>Matches</b>: every game you played, the score, your team on the pitch, the other teams, and any note from the managers.</li>
    <li><b>Availability</b>: the whole season schedule marked Played, Missed, No-show or your answer, plus your answer history.</li>
    <li><b>Leaders</b>: Most improved, Top scorers, Top assists, appearances, win rate and Player of the Match. Never ratings.</li>
    <li><b>Account</b>: ${d.canEdit?'edit your card, ':''}change your PIN, theme and sign out.</li></ul>`)}
  ${sec('priv','Privacy',`<ul><li>Only you see your profile, XP, focus, notes and no-shows. Managers can see your profile to help you.</li>
    <li>Teammates only see names, positions, numbers, nations, clubs and photos, plus leaderboards.</li></ul>`)}${tipCard(true)}`}

  if(ntf.none)return `<h2>Vote alerts</h2><div class="panel stack"><p style="margin:0">Get a notification on your phone every time someone says they’re in or out, with a ⚠ when it’s last-minute.</p>

// admin only: cut out every star photo once and publish them for all phones
let starJob=null;
async function starJobRun(){if(starJob)return;const names=Object.keys(STARS).filter(n=>!STARIX.has(starSlug(n)));starJob={done:0,tot:names.length,ok:0,fail:0};const out=()=>{const e=document.getElementById('starjob');if(e)e.textContent=`Working… ${starJob.done}/${starJob.tot} · ${starJob.ok} ready${starJob.fail?` · ${starJob.fail} skipped`:''}. Keep this page open.`};out();
  for(let i=0;i<names.length;i+=40){const ch=names.slice(i,i+40).filter(n=>!(WIKI[n]&&WIKI[n].u));if(!ch.length)continue;try{const m=await wikiBatch(ch),miss=ch.filter(n=>!m[n]);let m2={};if(miss.length)try{m2=await wikiBatch(miss.map(n=>n+' (footballer)'))}catch(e){}ch.forEach(n=>{WIKI[n]={u:m[n]||m2[n+' (footballer)']||'',t:Date.now()}})}catch(e){}}
  try{ls('atb_wiki2',WIKI)}catch(e){}
  let lib=null;const cut=async u=>{const w=cutWorker();if(w){const id=Math.random().toString(36).slice(2);const r=await new Promise(res=>{cutWait[id]=res;w.postMessage({id,url:u});setTimeout(()=>{if(cutWait[id]){delete cutWait[id];res({err:'timeout'})}},120000)});if(r.blob)return r.blob}
    lib=lib||await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');return await lib.removeBackground(u,{model:'isnet_quint8',output:{format:'image/png'}})};
  const pubIx=async()=>{const v=Date.now();await supa.storage.from('stars').upload('index.json',new Blob([JSON.stringify({l:[...STARIX],v})],{type:'application/json'}),{upsert:true,contentType:'application/json',cacheControl:'60'});STARIXV=String(v)};
  for(const n of names){const u=WIKI[n]&&WIKI[n].u;if(!u){starJob.fail++;starJob.done++;out();continue}
    try{const raw=await cut(u),b=await cutTrim(raw);if(!b)throw 0;const {error}=await supa.storage.from('stars').upload(starSlug(n)+'.webp',b,{upsert:true,contentType:'image/webp',cacheControl:'31536000'});if(error)throw error;STARIX.add(starSlug(n));starJob.ok++;if(starJob.ok%10===0)await pubIx()}catch(e){starJob.fail++}
    starJob.done++;out()}
  try{await pubIx()}catch(e){}const r=starJob;starJob=null;toast(`Star photos ready: ${r.ok}${r.fail?` (${r.fail} had no usable photo)`:''}`);render()}
function starJobPanel(){if(!isAdmin)return '';const tot=Object.keys(STARS).length,have=Object.keys(STARS).filter(n=>STARIX.has(starSlug(n))).length;
  return `<h2>Dream Team star photos</h2><div class="panel stack"><div class="small muted">Cut out every star’s photo once (background removed) and publish it, so players’ phones never do this work. Takes about 10–20 minutes; keep this page open.</div>
    <div><b>${have}</b> of ${tot} ready</div><div id="starjob" class="small">${starJob?'Working…':''}</div><div class="row"><button class="btn primary" data-a="starjob" ${starJob||have>=tot?'disabled':''}>${have?'Prepare the missing ones':'Prepare all star photos'}</button></div></div>`}

function unlockPanel(){if(!isAdmin)return '';const u=S.settings.unlocks||{},P=S.players.filter(p=>!p.guest),grp=[['card','Card designs',Object.entries(CARDTHEMES).map(([k,v])=>[k,v[0]])],['cs','Chemistry styles',Object.entries(ABILITIES).map(([k,v])=>[k,v[1]])],['ps','PlayStyles (players’ own picks)',PSTYLES.flatMap(([,l])=>l).map(x=>[x[1],x[1]])]];

let ulT=0;const ulSave=()=>{clearTimeout(ulT);ulT=setTimeout(()=>putSettings(),500)};
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.ul)return;const v=+el.value,o=el.nextElementSibling;o.textContent=v?v.toLocaleString()+' XP':'Free';const u=S.settings.unlocks=S.settings.unlocks||{};(u[el.dataset.ul]=u[el.dataset.ul]||{})[el.dataset.k]=v;ulSave()});
document.addEventListener('change',e=>{const el=e.target;if(!el.dataset)return;if(el.dataset.ulx){const u=S.settings.unlocks=S.settings.unlocks||{},t=el.dataset.ulx,k=el.dataset.k;(u[t]=u[t]||{})[k]=el.checked?-1:(UL_DEF[t]||{})[k]??0;ulSave();render()}else if(el.dataset.ulown!=null){(S.settings.unlocks=S.settings.unlocks||{}).owner=el.value;ulSave()}});

/* Device for sign-in alerts: phone/computer, model where the browser tells us (Android, Chromebook), iPhone model estimated from its screen */
const IPHONES={'375x667':'iPhone SE/8','375x812':'iPhone X/11 Pro/12-13 mini','414x896':'iPhone XR/11/11 Pro Max','390x844':'iPhone 12/13/14','428x926':'iPhone 12-13 Pro Max/14 Plus','393x852':'iPhone 14 Pro/15/16','430x932':'iPhone 14 Pro Max/15 Plus/15 Pro Max/16 Plus','402x874':'iPhone 16 Pro/17','440x956':'iPhone 16-17 Pro Max','420x912':'iPhone Air'};
async function deviceStr(){const ua=navigator.userAgent||'';let os='',model='';
  if(/iPhone/.test(ua)){os='iOS';model=IPHONES[Math.min(screen.width,screen.height)+'x'+Math.max(screen.width,screen.height)]||'iPhone'}
  else if(/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1)){os='iPadOS';model='iPad'}
  else if(/Android/.test(ua)){os='Android '+((ua.match(/Android ([\d.]+)/)||[])[1]||'');model=(ua.match(/Android [\d.]+; (?:[a-z]{2}-[a-z]{2}; )?([^;)]+?)(?: Build|\))/i)||[])[1]||''}
  else if(/Windows/.test(ua))os='Windows';else if(/CrOS/.test(ua))os='Chromebook';else if(/Mac OS X/.test(ua))os='Mac';else if(/Linux/.test(ua))os='Linux';
  const v=ua.match(/OS (\d+)_(\d+)/);if(v&&/iOS|iPadOS/.test(os))os+=' '+v[1]+'.'+v[2];
  try{if(navigator.userAgentData&&navigator.userAgentData.getHighEntropyValues){const h=await navigator.userAgentData.getHighEntropyValues(['model','platformVersion']);if(h.model)model=h.model}}catch(e){}
  if(model==='K')model='';
  const br=/Edg\//.test(ua)?'Edge':/SamsungBrowser/.test(ua)?'Samsung Internet':/CriOS|Chrome\//.test(ua)?'Chrome':/FxiOS|Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'';
  const app=(matchMedia('(display-mode: standalone)').matches||navigator.standalone)?'home-screen app':br;
  return [model,os,app].filter(Boolean).join(' · ').slice(0,120)}

const HD={};let hdBusy=false;
const hdDB=()=>new Promise((ok,no)=>{try{const r=indexedDB.open('atb_hd',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}});
async function hdGetAll(ids){try{const db=await hdDB();return await new Promise(ok=>{const t=db.transaction('p'),st=t.objectStore('p'),out={};let n=ids.length;if(!n)ok(out);ids.forEach(id=>{const q=st.get(id);q.onsuccess=()=>{if(q.result)out[id]=q.result;if(!--n)ok(out)};q.onerror=()=>{if(!--n)ok(out)}})})}catch(e){return {}}}
async function hdPut(map){try{const db=await hdDB();const t=db.transaction('p','readwrite');Object.entries(map).forEach(([id,v])=>t.objectStore('p').put(v,id))}catch(e){}}
function hdApply(){let n=0;S.players.forEach(p=>{const h=HD[p.id];if(p.pv&&h&&h.pv===p.pv&&p.photo!==h.photo){p.photo=h.photo;n++}});return n}
async function hdLoad(){if(!PM||hdBusy)return;const need=S.players.filter(p=>p.pv&&!p.photo&&!(HD[p.id]&&HD[p.id].pv===p.pv));if(!need.length)return;hdBusy=true;
  try{const got=await hdGetAll(need.map(p=>p.id));need.forEach(p=>{if(got[p.id]&&got[p.id].pv===p.pv)HD[p.id]=got[p.id]});
    const miss=need.filter(p=>!(HD[p.id]&&HD[p.id].pv===p.pv));

// Everything below is from this player's point of view.
function pSeasons(){return [...new Set(S.matches.map(m=>m.date.slice(0,4)))].sort().reverse()}
function pMatches(all){const y=PM.season;return S.matches.filter(m=>all||y==='all'||m.date.startsWith(y)).slice().sort((a,b)=>a.date<b.date?1:-1)}
function resultOf(m,ti){const gs=m.teams.map(t=>t.goals);if(gs.some(g=>g===''||g==null))return null;const mine=+gs[ti],best=Math.max(...gs.map(Number));
  return mine===best?(gs.filter(g=>+g===best).length===1?'W':'D'):'L'}
function myGames(ms){const me=PM.data.me.id;return ms.map(m=>{const ti=m.teams.findIndex(t=>t.players.includes(me));return ti<0||m.myatt==='a'?null:{m,ti,t:m.teams[ti],late:m.myatt==='l',res:resultOf(m,ti),potm:m.potm===me,g:+m.stats?.[me]?.g||0,a:+m.stats?.[me]?.a||0}}).filter(Boolean)}
function pSummary(){const ms=pMatches(),g=myGames(ms),me=PM.data.me.id;
  const W=g.filter(x=>x.res==='W').length,D=g.filter(x=>x.res==='D').length,L=g.filter(x=>x.res==='L').length,res=W+D+L;
  const gf=g.reduce((s,x)=>s+(+x.t.goals||0),0);
  // streaks (chronological)
  let cur='',n=0,bestW=0,run=0,unb=0,bestUnb=0;g.slice().reverse().forEach(x=>{if(!x.res)return;run=x.res==='W'?run+1:0;bestW=Math.max(bestW,run);unb=x.res!=='L'?unb+1:0;bestUnb=Math.max(bestUnb,unb)});
  for(const x of g){if(!x.res)continue;if(!cur){cur=x.res;n=1}else if(x.res===cur)n++;else break}
  // teammates
  const mates={};g.forEach(x=>x.t.players.forEach(id=>{if(id===me)return;const o=mates[id]=mates[id]||{id,n:0,w:0,r:0};o.n++;if(x.res){o.r++;if(x.res==='W')o.w++}}));
  const ml=Object.values(mates).filter(o=>pById(o.id));
  const most=ml.slice().sort((a,b)=>b.n-a.n)[0];const best=ml.filter(o=>o.r>=2&&o.w>0).sort((a,b)=>b.w/b.r-a.w/a.r||b.r-a.r)[0];
  const kits={};g.forEach(x=>{const k=x.t.kit||'';kits[k]=(kits[k]||0)+1});
  const goals=g.reduce((n,x)=>n+x.g,0),assists=g.reduce((n,x)=>n+x.a,0);
  return {goals,assists,g,ms,apps:g.length,W,D,L,res,win:res?W/res:null,gf,potm:g.filter(x=>x.potm).length,att:ms.length?g.length/ms.length:null,streak:cur?cur+n:'',bestW,bestUnb,mates:ml,most,best,kits}}
function pAvail(){const kick=p=>p.kickoff||kickoffISO(p.match_date);const y=PM.season;
  const ps=PM.data.polls.filter(p=>p.kind!=='tournament'&&(y==='all'||String(p.match_date).startsWith(y)));let answered=0,ins=0,drops=0,joins=0,lead=[];
  const rows=ps.map(p=>{const log=p.log||[],first=log.find(l=>l.status!=='cleared');const tags=log.map(l=>classify({...l},kick(p)).tag).filter(Boolean);

const LEVELS=['Rookie','Squad Player','Regular','Starter','Key Player','Fan Favourite','Captain Material','Club Legend','Icon'];
const XP_ON=150,XP_LATE=75,XP_NOSHOW=-200,XP_CH1=10,XP_CHM=15,XP_CHSQ=150,XP_PEER=10,XP_VOTE=20,XP_PRED=5,XP_PROF=100;
const myPeer=mid=>{const o={};(PM.data.peer||[]).forEach(([m,r,v])=>{if(m===mid)o[r]=+v});return o};

/* Chemistry XP: rating teammates is how managers build teams, so it pays. First rating of each teammate +10,
   re-rating each teammate from your team within 7 days of a match +15, every squad-mate rated +150 (kept while it stays complete). */
const chemLog=()=>(PM.data.chemLog||[]).map(([r,at])=>({r,d:new Date(at).toLocaleDateString('en-CA',{timeZone:'America/Edmonton'})}));
const chemMates=()=>PM.data.players.filter(p=>!p.guest&&p.active!==false);
