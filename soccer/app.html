<title>Airdrie Team Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: sticky club header + angled tab bar, one working column; FC-style cut-corner panels; kit-coloured team columns */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F3F6FB; --ink:#0B1630; --muted:#56627A; --line:#D6DDE9;
  --accent:#D96A0F; --accent-ink:#FFFFFF; --gold:#B8862A; --warn:#B4531A; --bad:#C62F3E; --good:#138A5A;
  --hdr1:#0A1F44; --hdr2:#123A7A; --hdr-ink:#F4F7FB;
  --gold1:#F6DC86; --gold2:#B8862A; --silver1:#EEF1F4; --silver2:#9AA4AF; --bronze1:#EDBB8C; --bronze2:#94603A; --card-ink:#17120A;
  --star1:#0B1D3F; --star2:#1C3F86; --star-ink:#F7D27A;
  --blue:#2F6FD6; --green:#1E9A52; --orange:#EE8A1A; --red:#D23B3B; --purple:#7B4BC9; --black:#2A2E35;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --cut:12px; --club-orange:#E07B24; --boards:#C9D1D8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060D1A; --surface:#0E1A2F; --surface2:#13223C; --ink:#EAF0F8; --muted:#8D9BB4; --line:#22324E;
  --accent:#F58A2A; --accent-ink:#1B0C00; --gold:#F2C46B; --warn:#FFB547; --bad:#FF5C6C; --good:#3DDC97;
  --hdr1:#050B17; --hdr2:#0E2552; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060D1A; --surface:#0E1A2F; --surface2:#13223C; --ink:#EAF0F8; --muted:#8D9BB4; --line:#22324E;
  --accent:#F58A2A; --accent-ink:#1B0C00; --gold:#F2C46B; --warn:#FFB547; --bad:#FF5C6C; --good:#3DDC97;
  --hdr1:#050B17; --hdr2:#0E2552; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding-block:12px 4px;flex-wrap:wrap}
.brand{align-items:center}.crest{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--club-orange)}
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 42%,#0E3F80 0,#072F63 45%,#041C3D 100%);display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.sp-crest{position:relative;width:min(56vw,260px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #E07B24,0 18px 50px rgba(0,0,0,.5)}
.sp-crest img{width:100%;height:100%;display:block}
.sp-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,235,190,.55) 50%,transparent 65%);transform:translateX(-120%)}
.sp-ring{position:absolute;top:calc(min(56vw,260px)/-2*0.1);width:calc(min(56vw,260px)*1.1);left:50%;margin-left:calc(min(56vw,260px)*-.55);overflow:visible}
.sp-ring circle{fill:none;stroke:#E07B24;stroke-width:2.5;stroke-dasharray:604;stroke-dashoffset:604;transform:rotate(-90deg);transform-origin:center}
.sp-t{margin-top:18px;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:#F2C46B}
.sp-s{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#E07B24}
@media (prefers-reduced-motion:no-preference){
  .sp-crest{animation:spIn .9s cubic-bezier(.2,.9,.25,1.2) both}
  .sp-shine{animation:spShine .8s .75s ease-out both}
  .sp-ring circle{animation:spRing 1s .2s ease-out forwards}
  .sp-t{animation:spUp .5s .7s ease-out both}.sp-s{animation:spUp .5s .85s ease-out both}
}
@keyframes spIn{from{transform:scale(.55) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spShine{to{transform:translateX(120%)}}
@keyframes spRing{to{stroke-dashoffset:0}}
@keyframes spUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand small{color:var(--muted);font-size:13px}
.sync{margin-left:auto;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 8px}
nav.tabs button{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h2{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
button,.btn{font:inherit;cursor:pointer}
.btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.num{font-variant-numeric:tabular-nums}
.pos{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.3}
.pos.DEF{color:#2F6FD6} .pos.MID{color:#1E9A52} .pos.FWD{color:#D23B3B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pos.DEF{color:#7EA9F0}:root:not([data-theme="light"]) .pos.FWD{color:#F08A8A}:root:not([data-theme="light"]) .pos.MID{color:#5FD08E}}
:root[data-theme="dark"] .pos.DEF{color:#7EA9F0}:root[data-theme="dark"] .pos.FWD{color:#F08A8A}:root[data-theme="dark"] .pos.MID{color:#5FD08E}

/* availability chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 10px 5px 6px;cursor:pointer;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .o{font-family:var(--f-display);font-weight:700;font-size:13px;min-width:22px;text-align:center}
.grp{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;padding-block:6px;border-top:1px dashed var(--line)}
.grp:first-child{border-top:0}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.team .hd{padding:10px 12px;color:#fff;display:flex;align-items:center;gap:8px}
.team .hd input{background:rgba(255,255,255,.18);border:0;color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;width:100%}
.team .hd select{background:rgba(0,0,0,.18);border:0;color:#fff;padding:3px}
.plist{list-style:none;margin:0;padding:4px 0}
.plist li{display:grid;grid-template-columns:40px 1fr auto auto;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist select{padding:2px 4px;font-size:12px}
.lock{background:none;border:0;padding:2px 4px;color:var(--muted);font-size:14px}
.lock[aria-pressed="true"]{color:var(--warn)}
.stats{padding:10px 12px;background:var(--surface2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stats .d{font-size:11px}
.up{color:var(--good)} .dn{color:var(--bad)}
.lines{font-size:12px;color:var(--muted);padding:0 12px 8px;background:var(--surface2)}
.balance{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:600;font-size:12px}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.meh{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* FIFA-style cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;border-radius:12px 12px 40px 40px/12px 12px 24px 24px;padding:10px 10px 14px;color:var(--card-ink);cursor:pointer;border:0;text-align:left;font:inherit;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 1px 0 rgba(0,0,0,.08)}
.card.gold{--t1:var(--gold1);--t2:var(--gold2)} .card.silver{--t1:var(--silver1);--t2:var(--silver2)} .card.bronze{--t1:var(--bronze1);--t2:var(--bronze2)}
.card.off{opacity:.5}
.card .ovr{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:.9}
.card .ps{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.05em}
.card .cn{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;margin-top:10px;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cs{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;margin-top:6px;font-size:13px;font-variant-numeric:tabular-nums}
.card .cs b{font-family:var(--f-display);font-size:15px;margin-right:3px}
.card .fm{position:absolute;right:10px;top:10px;font-size:12px;font-weight:700}
.card .wl{font-size:11px;margin-top:6px;opacity:.8}

/* matches */
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.score .k{width:12px;height:12px;border-radius:3px;display:inline-block}
.score input{width:52px;text-align:center}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal{background:var(--bg);color:var(--ink);border-radius:14px;width:100%;max-width:760px;padding:16px;border:1px solid var(--line)}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal .mh h2{margin:0}
.modal .mh .x{margin-left:auto}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.attrs input{width:100%}
.rate{border-top:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:6px}
.rate .attrs{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.rate .attrs label{font-size:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* share card: fixed look so the screenshot is identical on every phone */
.sharecard{background:#0F1B2B;color:#F2F5F8;border-radius:14px;padding:18px;font-family:var(--f-body);max-width:560px;margin:0 auto}
.sharecard .sh{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.sharecard .sd{color:#A9B6C6;font-size:14px;margin:4px 0 14px}
.sharecard .sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sharecard .st{background:#172638;border-radius:10px;overflow:hidden}
.sharecard .st h4{margin:0;padding:8px 10px;font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff}
.sharecard .st ol{margin:0;padding:6px 10px 10px 30px;font-size:14px}
.sharecard .st li{padding:2px 0}
.sharecard .st li em{font-style:normal;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;color:#A9B6C6;margin-left:6px}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.tb select{padding:3px 6px}
.stitle{background:var(--surface2);border-top:1px solid var(--line);padding:8px 12px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.prate{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;max-width:400px;margin:0 auto 8px;font-size:12px;color:var(--muted)}
.prate b{color:var(--ink);font-family:var(--f-display);font-size:15px}
.prate span:first-child{width:100%;text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pwrap{padding:4px 12px 12px}
.pitch{position:relative;width:100%;max-width:400px;aspect-ratio:3/4;margin:0 auto;border-radius:18px;border:5px solid var(--boards);background:#2F8F52;overflow:hidden}
.pitch .mk{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:25%;background:none;border:0;padding:0;font:inherit;color:#fff;z-index:1}
button.tok{cursor:pointer}
.tok .dot{width:32px;height:32px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.02em;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.tok .tn{font-size:10px;line-height:1.15;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:4px;max-width:100%;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tok.sel .dot{outline:3px solid #FFD54A;outline-offset:2px}
.subs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:8px;font-size:13px}
.subs>span:first-child{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.subb{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:13px}
button.subb{cursor:pointer}.subb.sel{outline:3px solid #FFD54A}
.sharecard .subs>span:first-child{color:#A9B6C6}.sharecard .subb{background:#172638;border-color:#2A3B52;color:#F2F5F8}
.sharecard.one{max-width:440px}
.rot{background:#172638;border-radius:10px;padding:8px 10px;margin:-4px 0 12px;font-size:14px;font-weight:600}
.rot .kitsw.sm{vertical-align:-1px}.rot .arr{color:#A9B6C6;margin-inline:4px}.rot .rt{color:#A9B6C6;font-size:12px;font-weight:500;margin-top:3px}
.kitsw{width:26px;height:26px;border-radius:6px;flex:none;display:inline-block}.kitsw.sm{width:12px;height:12px;border-radius:3px}
.star{color:#D9A21B;margin-left:4px;font-size:.95em}
.fbadge{white-space:nowrap;margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:18px;background:#172638;padding:4px 10px;border-radius:8px}
.sharecard .st h4 small{float:right;font-size:14px;opacity:.85}
.gintro{color:var(--muted);max-width:65ch;margin-top:0}
.gtoc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.gtoc a{font-size:13px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px}
.gsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;scroll-margin-top:170px}
.gsec summary{cursor:pointer;padding:12px 14px;font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.gbody{padding:0 16px 14px;max-width:70ch;line-height:1.55}
.gbody ul,.gbody ol{padding-left:20px;margin:6px 0}.gbody li{margin:4px 0}.gbody p{margin:8px 0}
.gbody .tbl{margin:8px 0}.gbody td{text-align:left;white-space:normal}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.pos.GST{color:var(--gold)}
.chip.addg{padding-left:10px;border-style:dashed}
.pollp summary{cursor:pointer}
.qr{display:flex;gap:6px;flex-wrap:wrap}
.qb{min-width:46px;padding:8px 10px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font:700 15px var(--f-display);cursor:pointer;clip-path:polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px))}
.qb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qb.skip{margin-left:auto}.qb.skip[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:var(--bg)}
.rate[data-skip="1"] b{text-decoration:line-through;opacity:.6}
.more summary{cursor:pointer;margin-top:4px}
.login{max-width:420px;margin:32px auto;text-align:left}.lcrest{width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 2px var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);padding:10px 12px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.tile span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile b{font:800 30px/1.1 var(--f-display);color:var(--ink)}
.tile.warn b{color:var(--bad)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.charts .panel{min-width:0}
.chart{overflow-x:auto;margin-top:6px}.chart svg{width:100%;min-width:280px;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .vl{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--f-body)}.chart .bar{fill:var(--accent)}
.chart g[data-tip]:hover .bar{fill:color-mix(in srgb,var(--accent) 80%,var(--ink))}
.lbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.lb ol{list-style:none;margin:8px 0 0;padding:0}.lb li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.lb li:last-child{border-bottom:0}.lb .rk{color:var(--muted);font-weight:700}.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stbl th{padding:0}.sortb{background:none;border:0;color:var(--muted);font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.05em;padding:6px;cursor:pointer;white-space:nowrap}
.stbl td:first-child{white-space:nowrap}.linkb{background:none;border:0;color:var(--ink);font:600 13px var(--f-body);padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}.tag.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}

/* Supabase sync: one row per document in atb_docs, shaped like the db API the page already uses */
let supa=null, supaUser=null, teamOwner=null, myName='', isAdmin=false;
const ADMIN_EMAIL='rsramansingh96@gmail.com';
const MGR_DOMAINS=['aufc-managers.invalid','managers.aufc.local'];
function supaDB(client,uid){
  const cols={};
  const snap=col=>({docs:[...cols[col].map].map(([id,d])=>({id,exists:true,data:()=>d}))});
  const emit=col=>{const c=cols[col];if(!c.ready)return;const s=snap(col);c.cbs.forEach(f=>f(s))};
  function watch(col,fn,err){
    if(!cols[col]){cols[col]={map:new Map(),cbs:[],ready:false};
      client.from('atb_docs').select('id,data').eq('col',col).then(({data,error})=>{
        if(error){err&&err(error);return}data.forEach(r=>cols[col].map.set(r.id,r.data));cols[col].ready=true;emit(col)})}
    cols[col].cbs.push(fn);if(cols[col].ready)fn(snap(col));
  }
  client.channel('atb-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'atb_docs'},p=>{
    const row=p.eventType==='DELETE'?p.old:p.new;if(!row||row.owner!==uid||!cols[row.col])return;
    if(p.eventType==='DELETE')cols[row.col].map.delete(row.id);else cols[row.col].map.set(row.id,row.data);emit(row.col)}).subscribe();
  const split=path=>{const i=path.indexOf('/');return [path.slice(0,i),path.slice(i+1)]};
  return {
    collection:col=>({onSnapshot:(fn,err)=>watch(col,fn,err)}),
    doc:path=>{const [col,id]=split(path);return {
      async set(data){const {error}=await client.from('atb_docs').upsert({owner:uid,col,id,data,updated_at:new Date().toISOString()});if(error)throw error;cols[col]&&(cols[col].map.set(id,data));},
      async delete(){const {error}=await client.from('atb_docs').delete().eq('col',col).eq('id',id);if(error)throw error;cols[col]&&cols[col].map.delete(id)},
      onSnapshot(fn,err){watch(col,s=>{const d=s.docs.find(x=>x.id===id);fn(d||{id,exists:false,data:()=>undefined})},err)}}}
  };
}

/* ---------- ratings model ---------- */
// Scores follow last season's sheet: FWD skips Defending, MID skips Speed+Strength, DEF skips Ball Skill, PACE = Speed.
function scores(a){
  const fwd=(a.pas+a.sho+a.bal+a.min+a.tea+a.spd+a.sta+a.str)/80;
  const mid=(a.pas+a.sho+a.def+a.bal+a.min+a.tea+a.sta)/70;
  const def=(a.pas+a.sho+a.def+a.min+a.tea+a.spd+a.sta+a.str)/80;
  const pace=a.spd/10;
  return {fwd,mid,def,pace,ovr:Math.round((fwd+mid+def+pace)/4*100)};
}
let CACHE=null;
function compute(){
  const ms=S.matches.slice().sort((a,b)=>a.date<b.date?-1:1);
  const out={};
  for(const p of S.players){
    let rs=ms.filter(m=>m.ratings&&m.ratings[p.id]).map(m=>({date:m.date,r:m.ratings[p.id]}));
    const N=+S.settings.recentN||0; if(N>0) rs=rs.slice(-N);
    const w=p.baseN>0?Math.min(p.baseN,+S.settings.baseW):(rs.length?0.5:1);
    const a={};for(const k of K){let s=(p.base?.[k]??7)*w;for(const x of rs)s+=+x.r[k];a[k]=s/(w+rs.length)}
    const sc=scores(a);
    const hist=rs.map(x=>({date:x.date,ovr:scores(x.r).ovr}));
    let W=0,D=0,L=0;
    for(const m of ms){const ti=m.teams.findIndex(t=>t.players.includes(p.id));if(ti<0)continue;const gs=m.teams.map(t=>t.goals);if(gs.some(g=>g===''||g==null))continue;
      const mine=+gs[ti],best=Math.max(...gs.map(Number));const top=gs.filter(g=>+g===best).length;
      if(mine===best&&top===1)W++;else if(mine===best)D++;else L++}
    const apps=ms.filter(m=>m.teams.some(t=>t.players.includes(p.id))).length;const motm=ms.filter(m=>m.potm===p.id).length;
    out[p.id]={...sc,a,hist,W,D,L,games:rs.length,apps,motm};
  }
  return out;
}
const R=id=>CACHE[id]||{fwd:0,mid:0,def:0,pace:0,ovr:0,a:{},hist:[]};
const pById=id=>S.players.find(p=>p.id===id);
const lateFlag=id=>{if(!st.loaded)return '';const c=(commitCache||(commitCache=commitment()))[id];return c&&c.drops>=2?`<span class="lf" title="${c.drops} late drops">⚠${c.drops}</span>`:''};let commitCache=null;
const star=id=>pById(id)?.star?'<span class="star" title="Star player">★</span>':'';
const posOf=id=>(draft.posOverride&&draft.posOverride[id])||pById(id)?.pos||'MID';
function teamStats(ids){
  const rs=ids.map(R);
  const f=k=>avg(rs.map(r=>r[k]))*100;
  const c={DEF:0,MID:0,FWD:0};ids.forEach(id=>c[posOf(id)]++);
  return {atk:f('fwd'),mid:f('mid'),def:f('def'),pace:f('pace'),tot:(f('fwd')+f('mid')+f('def')+f('pace'))/4,c,n:ids.length};
}

/* ---------- balancer ---------- */
function lastPairs(){
  const ms=S.matches.slice().sort((a,b)=>a.date<b.date?1:-1).filter(m=>m.date<draft.date);
  const set=new Set();const m=ms[0];if(!m)return set;
  for(const t of m.teams)for(const a of t.players)for(const b of t.players)if(a<b)set.add(a+'|'+b);
  return set;
}
function cost(T,pairs){
  const st=T.map(teamStats);
  const spread=k=>{const v=st.map(s=>s[k]);return Math.max(...v)-Math.min(...v)};
  let c=0;
  const sz=st.map(s=>s.n);c+=Math.max(0,Math.max(...sz)-Math.min(...sz)-1)*1000;
  for(const p of POS){const v=st.map(s=>s.c[p]);const d=Math.max(...v)-Math.min(...v);c+=d*6+Math.max(0,d-1)*60}
  c+=spread('tot')*12+spread('atk')*3+spread('mid')*3+spread('def')*3+spread('pace')*1.5;
  for(const t of T){const sc={};for(const id of t)if(pById(id)?.star){const p=posOf(id);sc[p]=(sc[p]||0)+1}for(const p in sc)if(sc[p]>1)c+=(sc[p]-1)*800}
  if(S.settings.mix&&pairs.size){for(const t of T)for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){const a=t[i],b=t[j];if(pairs.has(a<b?a+'|'+b:b+'|'+a))c+=1.2}}
  return c;
}
function balance(ids,n,locks){
  const pairs=lastPairs();const results=[];
  const order={DEF:0,MID:1,FWD:2};
  for(let run=0;run<80;run++){
    const T=Array.from({length:n},()=>[]);
    ids.filter(id=>locks[id]!=null&&locks[id]<n).forEach(id=>T[locks[id]].push(id));
    const free=ids.filter(id=>!(locks[id]!=null&&locks[id]<n)).map(id=>({id,k:order[posOf(id)],o:R(id).ovr+Math.random()*6}))
      .sort((a,b)=>a.k-b.k||b.o-a.o);
    for(const x of free){
      let best=0,bv=1e9;
      T.forEach((t,i)=>{const v=t.length*1000+t.filter(id=>posOf(id)===posOf(x.id)).length*100+t.reduce((s,id)=>s+R(id).ovr,0)/50+Math.random();if(v<bv){bv=v;best=i}});
      T[best].push(x.id);
    }
    let cur=cost(T,pairs),imp=true,guard=0;
    while(imp&&guard++<40){imp=false;
      for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){
        for(let i=0;i<T[a].length;i++)for(let j=0;j<T[b].length;j++){
          const x=T[a][i],y=T[b][j];if(locks[x]!=null||locks[y]!=null)continue;
          T[a][i]=y;T[b][j]=x;const c=cost(T,pairs);
          if(c<cur-1e-9){cur=c;imp=true}else{T[a][i]=x;T[b][j]=y}
        }
      }
    }
    const sig=T.map(t=>t.slice().sort().join(',')).sort().join('/');
    if(!results.some(r=>r.sig===sig))results.push({T:T.map(t=>t.slice()),c:cur,sig});
  }
  results.sort((a,b)=>a.c-b.c);
  return results.slice(0,8);
}
function sortTeam(t){const o={DEF:0,MID:1,FWD:2};return t.slice().sort((a,b)=>o[posOf(a)]-o[posOf(b)]||R(b).ovr-R(a).ovr)}

/* ---------- commitment + analytics ---------- */
function kickoffISO(date){const t=S.settings.time||'';const m=t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);let h=m?+m[1]:19,mi=m&&m[2]?+m[2]:0;
  const mer=m&&m[3]?m[3].toLowerCase():(/pm/i.test(t)?'pm':/am/i.test(t)?'am':(h<12?'pm':''));if(mer==='pm'&&h<12)h+=12;if(mer==='am'&&h===12)h=0;
  return new Date(`${date}T${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}:00`).toISOString()}
const lateH=()=>+S.settings.lateHours||24;
function classify(e,kick){const hb=(new Date(kick)-new Date(e.at))/36e5;let tag='';
  if(e.status!=='cleared'){if(hb<0)tag='after';else if(hb<lateH()){if(e.status==='out'&&e.prev_status==='in')tag='drop';else if(e.status==='in')tag='join'}}
  return {hb,tag}}
const fmtHB=h=>h<0?`${r1(-h)} h after kick-off`:h<48?`${r1(h)} h before`:`${Math.round(h/24)} days before`;
const verb=e=>e.status==='cleared'?'answer cleared (reset)':e.status==='in'?(e.prev_status==='out'?'changed to <b>in</b>':'said <b>in</b>'):(e.prev_status==='in'?'dropped <b>out</b>':'said <b>out</b>');
const TAG={drop:'<span class="tag bad">⚠ Late drop</span>',join:'<span class="tag good">＋ Late join</span>',after:'<span class="tag">After kick-off</span>'};
function activityHTML(log,kick){if(!log||!log.length)return '';const cl=log.slice().sort((a,b)=>a.at<b.at?-1:1).map(e=>({e,...classify(e,kick)}));const late=cl.filter(x=>x.tag==='drop'||x.tag==='join').length;
  return `<details class="act"><summary><b>Activity</b> · ${log.length} change${log.length>1?'s':''}${late?` · <span class="tag bad">${late} last-minute</span>`:''}</summary>
    <ol class="alog">${cl.slice().reverse().map(({e,hb,tag})=>`<li><span class="at num">${new Date(e.at).toLocaleString(undefined,{weekday:'short',hour:'numeric',minute:'2-digit'})}</span><span class="who">${esc(pById(e.player_id)?.name||e.player_id)} ${verb(e)}</span><span class="small muted num">${fmtHB(hb)}</span>${TAG[tag]||''}</li>`).join('')}</ol></details>`}
let st={loaded:false,loading:false,polls:[],logs:[],err:''};
async function loadStats(){if(cloud!=='supa'||st.loading)return;st.loading=true;
  try{const a=await supa.from('atb_polls').select('id,match_date,kickoff,players').eq('owner',teamOwner);if(a.error)throw a.error;st.polls=a.data;st.logs=[];
    const ids=a.data.map(p=>p.id);if(ids.length){const b=await supa.from('atb_rsvp_log').select('poll_id,player_id,status,prev_status,at').in('poll_id',ids).order('at').limit(10000);if(b.error)throw b.error;st.logs=b.data}
    st.loaded=true;st.err=''}catch(e){st.err=e.message||'Could not load answer history'}st.loading=false;if(loaded)render()}
function commitment(){const out={},by={};st.logs.forEach(l=>(by[l.poll_id]=by[l.poll_id]||[]).push(l));
  for(const p of st.polls){const logs=by[p.id]||[],kick=p.kickoff||kickoffISO(p.match_date);
    for(const pl of p.players){const o=out[pl.id]=out[pl.id]||{asked:0,answered:0,drops:0,joins:0,changes:0,lead:[]};o.asked++;
      const mine=logs.filter(l=>l.player_id===pl.id&&l.status!=='cleared');if(mine.length){o.answered++;o.lead.push((new Date(kick)-new Date(mine[0].at))/36e5);o.changes+=mine.length-1}
      mine.forEach(l=>{const c=classify(l,kick);if(c.tag==='drop')o.drops++;if(c.tag==='join')o.joins++})}}
  return out}
function playerStats(){const C=st.loaded?commitment():{};const nM=S.matches.length;
  return S.players.filter(p=>!p.guest).map(p=>{const r=R(p.id),c=C[p.id]||{asked:0,answered:0,drops:0,joins:0,changes:0,lead:[]};
    const start=scores(Object.fromEntries(K.map(k=>[k,+(p.base?.[k]??7)]))).ovr;const res=r.W+r.D+r.L;
    return {p,ovr:r.ovr,delta:r.hist.length?r.ovr-start:0,apps:r.apps,att:nM?r.apps/nM:null,W:r.W,D:r.D,L:r.L,win:res?r.W/res:null,res,motm:r.motm,
      asked:c.asked,resp:c.asked?c.answered/c.asked:null,drops:c.drops,joins:c.joins,changes:c.changes,lead:c.lead.length?avg(c.lead):null}})}
const pct=x=>x==null?'–':Math.round(x*100)+'%';
// Single-series bar chart: one accent hue, rounded data-ends, 2px gaps, recessive grid, per-bar hover tooltip, selective labels.
function barChart(rows,{h=150,fmt=v=>v,label}={}){if(!rows.length)return '<p class="small muted">No data yet.</p>';
  const W=Math.max(300,rows.length*44),pad={l:30,r:8,t:14,b:26},iw=W-pad.l-pad.r,ih=h-pad.t-pad.b,max=Math.max(1,...rows.map(r=>r.v));
  const nice=Math.ceil(max/ (max>10?5:1))*(max>10?5:1),bw=iw/rows.length,y=v=>pad.t+ih-(v/nice)*ih,ticks=[0,nice/2,nice];
  const maxI=rows.findIndex(r=>r.v===max),last=rows.length-1;
  return `<div class="chart" role="img" aria-label="${esc(label||'')}"><svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="xMidYMid meet">
    ${ticks.map(t=>`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}" class="grid"/><text x="${pad.l-6}" y="${y(t)+4}" class="ax" text-anchor="end">${fmt(t)}</text>`).join('')}
    ${rows.map((r,i)=>{const x=pad.l+i*bw+1,w=Math.max(2,bw-2),top=y(r.v),hh=pad.t+ih-top,rr=Math.min(4,w/2,hh);
      const path=hh>0?`M${x},${pad.t+ih} V${top+rr} Q${x},${top} ${x+rr},${top} H${x+w-rr} Q${x+w},${top} ${x+w},${top+rr} V${pad.t+ih} Z`:'';
      return `<g data-tip="${esc(r.tip)}"><rect x="${x-1}" y="${pad.t}" width="${bw}" height="${ih}" fill="transparent"/>${path?`<path d="${path}" class="bar"/>`:''}
        ${(i===maxI||i===last)?`<text x="${x+w/2}" y="${top-4}" class="vl" text-anchor="middle">${fmt(r.v)}</text>`:''}
        <text x="${x+w/2}" y="${h-8}" class="ax" text-anchor="middle">${esc(r.k)}</text></g>`}).join('')}
  </svg></div>`}
function spark(vals){if(vals.length<2)return '';const W=160,H=36,mn=Math.min(...vals)-1,mx=Math.max(...vals)+1,x=i=>4+i*(W-8)/(vals.length-1),y=v=>H-4-(v-mn)/(mx-mn)*(H-8);
  const d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="OVR by match"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></svg>`}
let statsSort={k:'ovr',d:-1};

  const asked=PS.reduce((a,x)=>a+x.asked,0),answered=PS.reduce((a,x)=>a+(x.resp||0)*x.asked,0),drops=PS.reduce((a,x)=>a+x.drops,0);

  const top=(arr,key,fmt,filter=()=>true,n=5,dir=-1)=>arr.filter(filter).sort((a,b)=>dir*((a[key]??-1e9)-(b[key]??-1e9))).slice(0,n)

  const board=(t,sub,list)=>`<div class="panel lb"><h3>${t}</h3><div class="small muted">${sub}</div><ol>${list}</ol></div>`;

      <label class="small row" style="gap:6px">🏆 Player of the Match <select id="potm${m.id}" data-a="potm" data-id="${m.id}"><option value="">Not picked</option>${m.teams.flatMap(t=>t.players).filter(id=>pById(id)).sort((a,b)=>pById(a).name.localeCompare(pById(b).name)).map(id=>`<option value="${id}" ${m.potm===id?'selected':''}>${esc(pById(id).name)}</option>`).join('')}</select></label>
      <div class="score">${m.teams.map((t,i)=>`<label class="srow"><span class="k" style="background:${KITHEX[t.kit]||'#888'}"></span><span class="sn">${esc(t.name)}</span><input class="num" id="g${m.id}_${i}" type="number" min="0" inputmode="numeric" placeholder="–" value="${t.goals??''}" data-a="goal" data-id="${m.id}" data-i="${i}" aria-label="Goals ${esc(t.name)}"></label>`).join('')}</div>
    </div>`}).join('')}</div>`;
}

function tier(o){return o>=78?"gold":o>=71?"silver":"bronze"}
let squadFilter='ALL',showOff=false;
function vSquad(){
  let ps=S.players.filter(p=>showOff||(p.active!==false&&!p.guest));
  if(squadFilter!=='ALL')ps=ps.filter(p=>p.pos===squadFilter);
  ps.sort((a,b)=>R(b.id).ovr-R(a.id).ovr);
  return `<h2>Squad</h2><div class="row" style="margin-bottom:12px">${['ALL',...POS].map(f=>`<button class="chip" aria-pressed="${squadFilter===f}" data-a="sf" data-f="${f}" style="padding-left:10px">${f==='ALL'?'All':f}</button>`).join('')}
    <label class="small row" style="gap:4px;margin-left:8px"><input type="checkbox" id="showoff" data-a="showoff" ${showOff?'checked':''}> Show inactive &amp; guests</label>
    <button class="btn primary" data-a="addp" style="margin-left:auto">Add player</button></div>
  <div class="cards">${ps.map(p=>{const r=R(p.id);const h=r.hist;const fm=h.length?h[h.length-1].ovr-r.ovr:0;
    const f=k=>Math.round((r.a[k]||0)*10);
    return cardHTML(p)}).join('')}</div>`;
}

/* ---------- managers (admin only; accounts are created by the atb-managers edge function) ---------- */
let mgrs={list:null,loading:false,err:''};
async function mgrCall(body){const {data,error}=await supa.functions.invoke('atb-managers',{body});
  if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e){}throw new Error(m)}if(data&&data.error)throw new Error(data.error);return data}
async function loadMgrs(){mgrs.loading=true;mgrs.err='';try{mgrs.list=(await mgrCall({action:'list'})).managers}catch(e){mgrs.err=e.message}mgrs.loading=false;if(view==='managers')render()}
const genPw=()=>{const a='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789';const b=new Uint32Array(12);crypto.getRandomValues(b);return [...b].map(x=>a[x%a.length]).join('')};
function vManagers(){
  if(!mgrs.list&&!mgrs.loading&&!mgrs.err)setTimeout(loadMgrs,0);
  const when=t=>t?new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'Never';
  return `<h2>Managers</h2>
  <div class="panel stack"><p class="small muted" style="margin:0">Managers sign in with a username and password you give them. They can do everything in the app (squad, ratings, matches, links) on this team’s data. Only you (${ADMIN_EMAIL}) can see this page and add or remove managers.</p>
    <div class="row" style="align-items:flex-end"><label class="f" style="flex:1 1 160px">Username<input id="mu" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="e.g. harjot"></label>
    <label class="f" style="flex:1 1 160px">Password<input id="mp" autocomplete="new-password" value="${genPw()}"></label>
    <button class="btn" data-a="mgen" type="button">New password</button><button class="btn primary" data-a="madd">Add manager</button></div>
    <span class="small muted" id="mmsg" role="status"></span></div>
  <h2>Current managers</h2>
  ${mgrs.err?`<div class="panel"><span style="color:var(--bad)">${esc(mgrs.err)}</span> <button class="btn" data-a="mreload">Try again</button></div>`:
    !mgrs.list?'<div class="panel muted">Loading…</div>':!mgrs.list.length?'<div class="panel muted">No managers yet. Add one above, then send them the app link, their username and password.</div>':
    `<div class="mlist">${mgrs.list.map(m=>`<div class="panel row"><div style="flex:1 1 160px"><b>${esc(m.username)}</b><div class="small muted">Added ${when(m.created_at)} · last sign-in ${when(m.last_sign_in_at)}</div></div>
      <input id="rp_${m.member}" placeholder="New password" style="flex:1 1 140px"><button class="btn" data-a="mreset" data-id="${m.member}">Set password</button><button class="btn danger" data-a="mdel" data-id="${m.member}">Remove</button></div>`).join('')}</div>`}`;
}

function vGuide(){
  const sec=(id,t,body,open)=>`<details class="gsec" id="g-${id}" ${open?'open':''}><summary>${t}</summary><div class="gbody">${body}</div></details>`;

  ${sec('life','The weekly cycle',`<ol>
    <li><b>Before Saturday:</b> open Match Day, tap everyone who is coming, press <b>Balance</b>.</li>
    <li>Check the teams, move or lock anyone by hand, pick formations if you want.</li>
    <li>Press <b>Save match</b>, then <b>Share to WhatsApp</b> and post the card or text. It never shows ratings.</li>
    <li><b>After the game:</b> open Matches &amp; Ratings, type each team’s goals, then <b>Rate players</b>.</li>
    <li>The new ratings are averaged into every player’s numbers, so next week’s balance uses up-to-date form.</li></ol>`,true)}

  ${sec('squad','Squad and players',`<ul>
    <li>Each player has a <b>name</b>, one <b>position</b> (DEF, MID or FWD), an <b>Active this season</b> tick, a <b>★ Star player</b> tick, and nine <b>starting ratings</b> from 1 to 10.</li>
    <li><b>Add player</b> (Squad tab) creates a player with starting ratings you type; new players default to 7 in everything.</li>
    <li>Returning players’ starting ratings are their averages from last season’s Excel sheet.</li>
    <li>Inactive players stay in the database but are hidden from Match Day and the squad list (tick <b>Show inactive</b> to see them).</li>
    <li>Position decides which line a player is counted in for team balance and where they go on the pitch.</li></ul>`)}

  ${sec('ratings','Ratings and scores',`<p>The nine attributes: Passing, Shooting, Defending, Ball Skill, Mindset, Team Work, Speed, Stamina, Strength.</p>
    <p><b>Current attributes</b> = average of the starting ratings and every match rating the player has received:</p>
    <ul><li>Starting ratings count as <b>${S.settings.baseW} matches</b> (Settings → Last season counts as), or as many matches as the player actually had last season if fewer.</li>
    <li>A brand-new player’s starting ratings count as half a match once they have real ratings, so their true form takes over quickly.</li>
    <li>Settings → Average over can limit this to the last 3, 5, 8 or 12 matches.</li></ul>
    <p>From the attributes come four scores, the same formulas as last season’s sheet:</p>
    <div class="tbl"><table><tr><th>Score</th><th>Average of</th></tr>
    <tr><td>FWD</td><td>everything except Defending</td></tr><tr><td>MID</td><td>everything except Speed and Strength</td></tr>
    <tr><td>DEF</td><td>everything except Ball Skill</td></tr><tr><td>PACE</td><td>Speed only</td></tr></table></div>
    <p><b>OVR</b> = average of FWD, MID, DEF and PACE, shown out of 100 (a 7.4 average shows as 74).</p>`)}

  ${sec('avail','Match Day: who’s in',`<ul>
    <li>The date defaults to the next Saturday; time comes from Settings (${esc(S.settings.time)}).</li>
    <li>Players are grouped by position with their OVR. Tap to mark in; <b>Everyone</b> and <b>Clear</b> do what they say.</li>
    <li>Choose 2, 3 or 4 teams and how many play <b>on pitch per team</b> (keeper included). <b>Balance</b> needs at least two players per team.</li>
    <li>Your Match Day selections are remembered on the device you made them on until you save the match.</li></ul>`)}

  ${sec('link','Availability link',`<ul>
    <li>Needs sync (signed in on the Vercel app). On Match Day press <b>Open link for [date]</b>, then <b>Copy WhatsApp message</b> and post it.</li>
    <li>Players open the link, tap their name once (their phone remembers it) and press <b>I’m in</b> or <b>Can’t make it</b>. They can change their answer any time until you close the link.</li>
    <li>The page shows names, positions and who’s in. It never shows ratings, and nobody can see or change your squad, matches or settings through it.</li>
    <li>Only active squad players are on the link; guests are not.</li>

    <li><b>Close link</b> stops new answers; <b>Reopen link</b> allows them again. <b>Reset answers</b> (tap twice) clears every answer on the link so players start fresh; the link itself stays the same. Each date gets its own link.</li>
    <li>Anyone with the link can answer for any name on it, so share it only in your group.</li></ul>`)}

  ${sec('guests','Guest players',`<ul>
    <li><b>＋ Guest</b> on Match Day adds a one-off player with a name, position and level (Beginner 60 to Top 90). Every attribute starts at that level.</li>
    <li>Guests are marked in straight away. If teams already exist they join the team that needs them most, like a late arrival.</li>

    <li>You can rate guests after the game. <b>Remove guests</b> deletes all of them; their old match ratings stop counting.</li></ul>`)}

  ${sec('balance','How teams are balanced',`<p>The app tries 80 different starting splits, improves each one by swapping players between teams until no swap helps, and keeps the 8 best distinct results. <b>Another balanced option</b> steps through those 8.</p>
    <p>Each split gets a penalty score; lower is better. What it counts, from strongest to weakest:</p>
    <div class="tbl"><table><tr><th>Rule</th><th>Penalty</th></tr>
    <tr><td>Team sizes differ by more than 1</td><td>1000 per extra player</td></tr>
    <tr><td>Two ★ stars with the same position on one team</td><td>800 per extra star</td></tr>
    <tr><td>DEF, MID or FWD counts differ by more than 1 between teams</td><td>60 per extra, plus 6 per player of difference</td></tr>

    <p>The header shows the <b>Overall gap</b>: the difference between the best and worst team Total. Under 1.5 points is marked Balanced.</p>`)}

  ${sec('stars','Star players',`<ul><li>Tick ★ Star player on a player’s card.</li>

  ${sec('manual','Moving and locking',`<ul><li>Use the team dropdown next to a player to move them. Team ratings and the gap update immediately.</li>

    <li><b>Late arrivals and dropouts:</b> once teams exist, tapping a player in adds just that player to the team that needs them most (fewest players, then fewest of their position, then lowest rating). Tapping a player out removes only them. Nobody else moves. Press Balance again if you want a full reshuffle.</li></ul>`)}

  ${sec('form','Formations and the pitch',`<ul>
    <li><b>On pitch per team</b> (default 8) is the number of starters, keeper included. Everyone else is a sub.</li>
    <li>Tick <b>Keeper</b> to reserve one starter as goalkeeper.</li>

    <li><b>Placing players:</b> each line is filled first with players of that position, best score for the line first. The keeper is the best remaining defender by DEF score. Empty spots are filled from the leftovers by that line’s score. Whoever is left becomes a sub.</li>
    <li>Press <b>Pitch</b> to see it. Tap two players (on the pitch or in subs) to swap them.</li>

    <li>Changing the team (balance, move) keeps the formation but re-places players.</li></ul>`)}

  ${sec('share','Sharing to WhatsApp',`<ul><li><b>All teams</b> card: date, time, the rotation line, and each team’s players with positions.</li>
    <li><b>Team on pitch</b> card: one team’s formation on the pitch plus subs.</li>
    <li><b>Save as image</b> makes a picture; <b>Copy text for WhatsApp</b> copies a text version. You can also just screenshot the card.</li>
    <li>Shared cards and text never include ratings, OVR or scores.</li></ul>`)}

  ${sec('rot','Match-night rotation',(()=>{const g=+S.settings.gameMin||9,c=+(S.settings.changeMin??1),t=+S.settings.sessionMin||120,reps=Math.floor(t/((g+c)*3));
    return `<p>One pitch, three teams: <b>A v B → B v C → C v A</b>, repeated. Each block of three games has every team playing two and resting one, so only whole blocks keep time equal.</p>
    <p>Blocks = session ÷ ((game + changeover) × 3), rounded down. With your settings (${t} min session, ${g}-min games, ${c}-min change) that is <b>${reps} blocks</b>, ${reps*3} games, <b>${reps*2} games each</b>.</p>
    <p>With 4 teams it uses a 6-game round (AB, CD, AC, BD, AD, BC); each team plays 3 per round. With 2 teams no rotation is shown.</p>`})())}

  ${sec('save','Saving a match',`<ul><li><b>Save match</b> stores the date, teams, kit colours, formations and line-ups.</li>
    <li>Saving again while editing updates the same match instead of making a new one.</li>

  ${sec('rate','Rating after the game',`<ul><li>Open <b>Rate players</b> on the match. Each player gets one row of buttons: <b>−1, −½, =, +½, +1</b>, meaning how they played compared with their usual level. <b>=</b> is selected by default.</li>
    <li>A button sets all nine ratings to the player’s current average plus that amount (rounded to 0.5, kept between 1 and 10).</li>
    <li><b>All 9 ratings</b> opens the detailed boxes if you want to rate one attribute differently. Already-rated players show their saved ratings.</li>
    <li><b>Skip</b> leaves a player unrated for this match (didn’t turn up, left injured). Skipping a rated player removes their rating for that match.</li>
    <li><b>Save ratings</b> saves every player in the match. The badge on the match shows how many are rated.</li>

  ${sec('results','Scores, wins and form',`<ul><li>Type each team’s total goals for the night on the match. Results only count once every team has a score.</li>

  ${sec('stats','Stats and commitment',`<ul>
    <li><b>Stats tab:</b> season totals, players per match, balance gap per match, leaderboards and a sortable table of every player.</li>
    <li><b>Activity log:</b> every answer on the availability link is recorded automatically with its time: said in, said out, changed to in, dropped out, and answers cleared by Reset. Open <b>Activity</b> on the Match Day link panel to see it, newest first, with how long before kick-off each change happened.</li>

    <li>Players with 2 or more late drops show ⚠ and the count next to their name on Match Day.</li>
    <li><b>Att.</b> = matches played ÷ matches saved this season. <b>±</b> = current OVR minus their starting OVR. <b>Balance gap</b> is saved when you save a match; older matches use today’s ratings.</li>

  ${sec('cards','Player cards',`<ul><li>Cards follow the EA FC layout: <b>gold</b> OVR 78+, <b>silver</b> 71–77, <b>bronze</b> 70 and below. ★ star players get a black-and-gold special card.</li>

    <li>Tap a card for the full attribute table and match-by-match form.</li></ul>`)}

  ${sec('data','Where data lives and sync',`<ul>
    <li><b>Privacy:</b> the Vercel app opens to a manager sign-in screen. Without your email and password nothing loads: no squad, no ratings, no roster file. There is no sign-up button. Players only ever see WhatsApp cards and the availability page, which shows names and positions.</li>
    <li><b>Forgot password?</b> on the sign-in screen emails you a reset link; opening it lets you set a new password.</li>
    <li><b>Signed in:</b> squad, matches and settings are stored in your private Supabase database and appear on every device signed in with the same email within a second or two. Nobody else can read them.</li>
    <li>The first time a device signs in and the cloud is empty, that device’s squad and matches are uploaded.</li>
    <li><b>Not signed in:</b> everything stays in that browser only. Clearing Safari data erases it, so use Export backup.</li>
    <li>The Claude-hosted version keeps its own copy in your Claude account, separate from the Vercel app.</li>
    <li>Match Day selections (who’s in, draft teams) are kept per device until you save the match.</li>
    <li><b>Offline:</b> on the Vercel app the screens load even with no signal at the gym. Changes made offline may not save; you’ll see a message when the connection drops and when it’s back.</li>
    <li><b>Theme:</b> the button in the header cycles Auto (follows your phone), Dark and Light. It’s remembered per device.</li></ul>`)}

  ${sec('season','New season roster',`<ul><li>The roster file carries a season label (now ${esc(S.settings.season||'2026')}). When it changes, each device updates its squad once on next open: players not on the roster are removed, new ones added, names and positions refreshed. Ratings you’ve set are kept.</li>
    <li>After that, adding or deleting players by hand is never overridden.</li></ul>`)}

  ${sec('managers','Managers and access',`<ul>
    <li><b>Admin:</b> ${ADMIN_EMAIL} is the only account that sees the <b>Managers</b> tab and can add, reset or remove managers.</li>
    <li><b>Add manager:</b> type a username; a strong password is suggested (or type your own, 8+ characters). The login details are copied so you can send them privately.</li>
    <li>Managers sign in with their <b>username</b> and password. They see and change the same squad, ratings, matches, settings and availability links as you, live.</li>
    <li><b>Set password</b> replaces a manager’s password. <b>Remove</b> deletes their login immediately; everything they changed stays.</li>
    <li>Managers can’t use Forgot password; they ask you to set a new one. Their logins have no real email address, so no reset email can ever be sent for them.</li>
    <li>Players never need an account: they only get WhatsApp cards and the availability link.</li></ul>`)}

  ${sec('backup','Backup, delete and reset',`<ul><li><b>Export backup</b> saves one file with the squad, matches and settings. <b>Import backup</b> adds or replaces players and matches with the same IDs; it does not delete anything else.</li>
    <li><b>Delete player</b> removes them from the squad and today’s teams. Their past ratings stay inside old matches but no longer count anywhere.</li>

    <li>Both deletes ask for a second tap. A deleted player can be brought back with <b>Undo</b> for a few seconds; a deleted match cannot.</li></ul>`)}`;

/* ---------- formations + pitch ---------- */
const fsum=f=>f.split('-').reduce((s,x)=>s+ +x,0);
const onPitch=()=>+S.settings.onPitch||8;
// outfield players to place: the pitch limit (keeper counts toward it), never more than the team has
const target=(ids,gk)=>Math.max(1,Math.min(onPitch(),ids.length)-(gk?1:0));
function autoForm(ids,gk){const T=target(ids,gk);const c={DEF:0,MID:0,FWD:0};ids.forEach(id=>c[posOf(id)]++);const n=ids.length||1;
  const want=POS.map(p=>c[p]/n*T);const out=want.map(x=>Math.max(T>=3?1:0,Math.floor(x)));
  while(out.reduce((a,b)=>a+b,0)<T){let bi=0,bv=-1;want.forEach((w,i)=>{const r=w-out[i];if(r>bv){bv=r;bi=i}});out[bi]++}
  while(out.reduce((a,b)=>a+b,0)>T){let bi=0;out.forEach((v,i)=>{if(v-want[i]>out[bi]-want[bi])bi=i});out[bi]--}
  return out.join('-')}
function formOpts(ids,gk){const T=target(ids,gk);const o=[];
  for(let d=1;d<=5;d++)for(let m=1;m<=5;m++){const f=T-d-m;if(f>=1&&f<=4)o.push(d+'-'+m+'-'+f)}
  const a=autoForm(ids,gk);if(!o.includes(a))o.push(a);return o.sort((x,y)=>x<y?1:-1)}
function autoOrder(ids,f,gk){
  const L=f.split('-').map(Number);const lines=[['DEF',L[0],'def'],['MID',L[1],'mid'],['FWD',L[2],'fwd']];
  let pool=ids.slice();const got={DEF:[],MID:[],FWD:[]};
  for(const [pos,n,k] of lines){const c=pool.filter(id=>posOf(id)===pos).sort((a,b)=>R(b)[k]-R(a)[k]).slice(0,n);got[pos].push(...c);pool=pool.filter(id=>!c.includes(id))}
  let g=[];if(gk&&pool.length){pool.sort((a,b)=>R(b).def-R(a).def);g=[pool.shift()]}
  for(const [pos,n,k] of lines){while(got[pos].length<n&&pool.length){pool.sort((a,b)=>R(b)[k]-R(a)[k]);got[pos].push(pool.shift())}}
  if(gk&&!g.length){const d=got.DEF.length?got.DEF:got.MID.length?got.MID:got.FWD;g=[d.pop()]}
  return [...g,...got.DEF,...got.MID,...got.FWD,...pool];
}
function getLU(ids,lu){
  let gk=!!(lu&&lu.gk)&&ids.length>1;let f=lu&&lu.f;const cap=ids.length-(gk?1:0);
  if(!f||fsum(f)!==target(ids,gk))f=autoForm(ids,gk);
  if(lu&&lu.f===f&&!!lu.gk===gk&&lu.order&&lu.order.length===ids.length&&ids.every(id=>lu.order.includes(id)))return {f,gk,order:lu.order.slice()};
  return {f,gk,order:autoOrder(ids,f,gk)};
}
function splitLU(lu){const L=lu.f.split('-').map(Number);let i=lu.gk?1:0;const o=lu.order;
  const r={GK:lu.gk?o.slice(0,1):[],DEF:o.slice(i,i+=L[0]),MID:o.slice(i,i+=L[1]),FWD:o.slice(i,i+=L[2])};r.SUB=o.slice(i);return r}
const shortName=n=>{n=String(n||'?');const w=n.split(/\s+/);return n.length>10&&w.length>1?w[0]+' '+w[w.length-1][0]+'.':n};
const initials=n=>String(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const PITCH_SVG=`<svg class="mk" viewBox="0 0 300 400" preserveAspectRatio="none" aria-hidden="true"><rect width="300" height="400" fill="#2F8F52"/>${[0,2,4,6,8].map(i=>`<rect y="${i*40}" width="300" height="40" fill="#2A8249"/>`).join("")}<g fill="none" stroke="#FFFFFF" stroke-opacity=".75" stroke-width="2"><rect x="8" y="8" width="284" height="384" rx="16"/><line x1="8" y1="200" x2="292" y2="200"/><circle cx="150" cy="200" r="36"/><path d="M78 8 Q78 72 150 72 Q222 72 222 8"/><path d="M78 392 Q78 328 150 328 Q222 328 222 392"/></g><circle cx="150" cy="200" r="3" fill="#FFFFFF" fill-opacity=".8"/><rect x="122" y="1" width="56" height="7" rx="2" fill="#FFFFFF"/><rect x="122" y="392" width="56" height="7" rx="2" fill="#FFFFFF"/></svg>`;
function pitchHTML(t,lu,ti,interactive){
  const g=splitLU(lu);const Y={GK:90,DEF:71,MID:49,FWD:26};const col=KITHEX[t.kit]||'#555';let k=0;const sel=draft.sel;
  const tok=(id,role,x,y,idx,w)=>{const p=pById(id);const on=interactive&&sel&&sel.t===ti&&sel.k===idx;
    return `<${interactive?'button':'div'} class="tok${on?' sel':''}" style="left:${x}%;top:${y}%;width:${w}%" ${interactive?`data-a="slot" data-i="${ti}" data-k="${idx}" aria-label="${esc(p?.name)} ${role}"`:''}><span class="dot" style="background:${col}">${p?.photo?`<img src="${p.photo}" alt="">`:esc(initials(p?.name))}</span><span class="tn">${esc(shortName(p?.name))}</span></${interactive?'button':'div'}>`};
  let html='';let idx=0;
  for(const role of ['GK','DEF','MID','FWD']){const ids=g[role];const k=ids.length,w=Math.min(30,(k>=4?150:94)/k);ids.forEach((id,i)=>{const x=k>=4?13+i*74/(k-1):(i+1)/(k+1)*100;const y=Y[role]+(k>=4?(i%2?-5:4):0);html+=tok(id,role,x,y,idx++,w)})}
  const subs=g.SUB.map(id=>{const p=pById(id);const i=idx++;const on=interactive&&sel&&sel.t===ti&&sel.k===i;
    return interactive?`<button class="subb${on?' sel':''}" data-a="slot" data-i="${ti}" data-k="${i}">${esc(p?.name)}</button>`:`<span class="subb">${esc(p?.name)}</span>`}).join('');
  let rate='';if(interactive){const st=teamStats([...g.GK,...g.DEF,...g.MID,...g.FWD]);
    rate=`<div class="prate num"><span>On pitch (${st.n})</span><span>Att <b>${r1(st.atk)}</b></span><span>Mid <b>${r1(st.mid)}</b></span><span>Def <b>${r1(st.def)}</b></span><span>Pace <b>${r1(st.pace)}</b></span><span>Total <b>${r1(st.tot)}</b></span></div>`}
  return `${rate}<div class="pitch">${PITCH_SVG}${html}</div>${subs?`<div class="subs"><span>Subs</span>${subs}</div>`:''}`;
}

function teamText(t){const g=splitLU(t.lu);const nm=id=>pById(id)?.name;const ln=(lab,ids)=>ids.length?`${lab}: ${ids.map(nm).join(', ')}\n`:'';
  return `${KITEMO[t.kit]||'▪️'} *${t.name.toUpperCase()}* (${t.lu.f})\n`+ln('🧤 GK',g.GK)+ln('🛡️ DEF',g.DEF)+ln('⚙️ MID',g.MID)+ln('🎯 FWD',g.FWD)+ln('🔁 Subs',g.SUB)}
/* Night rotation: one pitch, every team plays the same number of games; repeat only whole cycles */
function rotation(d){const n=d.teams.length;if(n<3)return null;
  const P=n===3?[[0,1],[1,2],[2,0]]:[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
  const st=S.settings,g=+st.gameMin||9,c=+(st.changeMin??1),tot=+st.sessionMin||120;
  const reps=Math.max(1,Math.floor(tot/((g+c)*P.length)));const games=reps*P.length;
  const each=games*2/n;return {P,reps,g,c,games,each}}
function rotLine(d,emoji){const r=rotation(d);if(!r)return '';
  const nm=i=>d.teams[i].name.replace(/^team\s+/i,'');const k=i=>emoji?(KITEMO[d.teams[i].kit]||'▪️')+' '+nm(i):`<span class="kitsw sm" style="background:${KITHEX[d.teams[i].kit]}"></span> ${esc(nm(i))}`;
  const seq=r.P.map(([a,b])=>`${k(a)} v ${k(b)}`).join(emoji?' → ':' <span class="arr">→</span> ');
  const tail=`repeat ${r.reps}× · ${r.g}-min games · ${r.c}-min change · ${r.each} games each`;
  return emoji?`🔄 ${seq}\n${tail}\n\n`:`<div class="rot"><div>${seq}</div><div class="rt">${tail}</div></div>`}
function shareText(d){const head=`⚽ *Saturday Soccer* – ${fmtDate(d.date)}, ${S.settings.time}\n\n`+rotLine(d,true);
  if(shareSel!=='all')return head+teamText(d.teams[+shareSel]);

  if(a==='nonein'){draft.avail=[];draft.teams=null;draft.locks={};saveDraft();render();return}
  if(a==='balance'){const ids=draft.avail.filter(id=>pById(id));Object.keys(draft.locks).forEach(k=>{if(!ids.includes(k))delete draft.locks[k]});
    draft.alts=balance(ids,draft.n,draft.locks).map(r=>r.T);draft.altI=0;draft.teams=draft.alts[0];
    while(draft.names.length<draft.n)draft.names.push('');saveDraft();render();return}
  if(a==='reroll'){draft.altI=((draft.altI||0)+1)%draft.alts.length;draft.teams=draft.alts[draft.altI];saveDraft();render();toast('Option '+(draft.altI+1)+' of '+draft.alts.length);return}
  if(a==='lock'){const i=+el.dataset.i;draft.locks[id]!=null?delete draft.locks[id]:draft.locks[id]=i;saveDraft();render();return}
  if(a==='savematch'){const mm=draftAsMatch();const old=draft.editing&&S.matches.find(x=>x.id===draft.editing);
    const m={id:old?old.id:draft.date+'-'+uid(),date:mm.date,teams:mm.teams.map((t,i)=>({...t,goals:old?.teams[i]?.goals??null})),ratings:old?.ratings||{},createdAt:old?.createdAt||Date.now(),gap:(()=>{const t=mm.teams.map(x=>teamStats(x.players).tot);return Math.round((Math.max(...t)-Math.min(...t))*10)/10})()};
    await putMatch(m);draft.editing=m.id;saveDraft();toast('Match saved');render();return}
  if(a==='newmatch'){Object.assign(draft,{editing:null,teams:null,avail:[],locks:{},alts:[],date:nextSat(),names:[],lu:[],pitch:{},sel:null});saveDraft();render();return}
  if(a==='share'){shareModal(draftAsMatch());return}
  if(a==='sharem'){shareModal(S.matches.find(x=>x.id===id));return}
  if(a==='editm'){const m=S.matches.find(x=>x.id===id);Object.assign(draft,{editing:m.id,date:m.date,n:m.teams.length,kits:m.teams.map(t=>t.kit),names:m.teams.map(t=>t.name),teams:m.teams.map(t=>t.players.filter(id=>pById(id))),lu:m.teams.map(t=>t.lu||null),avail:m.teams.flatMap(t=>t.players),locks:{},alts:[]});saveDraft();view='match';ls('atb_view',view);render();window.scrollTo(0,0);return}
  if(a==='delm'){if(el.dataset.sure){delMatch(id);toast('Match deleted');}else{el.dataset.sure=1;el.textContent='Tap again to delete';setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent='Delete'}},3000)}return}
  if(a==='rate'){rateModal(id);return}
  if(a==='delp'){if(el.dataset.sure){const snap=JSON.parse(JSON.stringify(pById(id)));await delPlayer(id);closeModal();toast('Deleted '+snap.name,()=>{putPlayer(snap);toast('Restored '+snap.name)})}else{el.dataset.sure=1;el.textContent='Tap again to delete';setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent='Delete player'}},3000)}return}
  if(a==='pitch'){const i=+el.dataset.i;draft.pitch=draft.pitch||{};draft.pitch[i]=!draft.pitch[i];draft.sel=null;saveDraft();render();return}
  if(a==='slot'){const i=+el.dataset.i,k=+el.dataset.k;const s=draft.sel;
    if(s&&s.t===i&&s.k!==k){const lu=teamLU(i);[lu.order[s.k],lu.order[k]]=[lu.order[k],lu.order[s.k]];draft.sel=null}else draft.sel=s&&s.t===i&&s.k===k?null:{t:i,k};saveDraft();render();return}
  if(a==='shareteam'){shareModal(draftAsMatch(),String(el.dataset.i));return}
  if(a==='sharesel'){shareModal(lastShareM,el.dataset.s);return}
  if(a==='gosync'){view='settings';ls('atb_view',view);render();setTimeout(()=>$('#syncsec')?.scrollIntoView(),50);return}
  if(a==='forgot'){const email=$('#se').value.trim();const msg=$('#smsg');if(!email){msg.textContent='Type your email first.';return}
    if(!email.includes('@')){msg.textContent='Managers: ask the admin to reset your password.';return}
    const {error}=await supa.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});msg.textContent=error?error.message:'If that email has an account, a reset link is on its way.';return}
  if(a==='setpw'){const pw=$('#np').value;if(pw.length<8){$('#npmsg').textContent='Use at least 8 characters.';return}const {error}=await supa.auth.updateUser({password:pw});
    if(error){$('#npmsg').textContent=error.message;return}closeModal();toast('Password updated');return}
  if(a==='signin'||a==='signup'){const email=$('#se').value.trim(),password=$('#sp').value;const msg=$('#smsg');if(!email||!password){msg.textContent='Enter your email or username and password.';return}
    el.disabled=true;msg.textContent=a==='signin'?'Signing in…':'Creating account…';
    try{let r;
      if(a==='signin'&&!email.includes('@')){for(const d of MGR_DOMAINS){r=await supa.auth.signInWithPassword({email:email.toLowerCase()+'@'+d,password});if(!r.error)break}}
      else r=a==='signin'?await supa.auth.signInWithPassword({email,password}):await supa.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
      if(r.error)throw r.error;if(r.data.session){location.reload();return}
      msg.textContent='Account created. Open the confirmation email, then come back and sign in.'}catch(err){msg.textContent=err.message||'Could not sign in'}el.disabled=false;return}
  if(a==='signout'){await supa.auth.signOut();location.reload();return}
  if(a==='qr'){const d=+el.dataset.d;K.forEach(k=>{const i=$(`#r_${CSS.escape(id)}_${k}`);i.value=Math.min(10,Math.max(1,Math.round((+i.dataset.b+d)*2)/2))});
    el.parentNode.querySelectorAll('.qb').forEach(b=>b.setAttribute('aria-pressed',b===el));el.closest('.rate').dataset.skip='';return}
  if(a==='qskip'){const row=el.closest('.rate');const on=row.dataset.skip!=='1';row.dataset.skip=on?'1':'';el.parentNode.querySelectorAll('.qb').forEach(b=>b.setAttribute('aria-pressed',on?b===el:b.dataset.d==='0'));return}
  if(a==='bump'){const d=+el.dataset.d;K.forEach(k=>{const i=$(`#r_${CSS.escape(id)}_${k}`);i.value=Math.min(10,Math.max(1,(+i.value||7)+d))});return}
  if(a==='saverate'){const m=JSON.parse(JSON.stringify(S.matches.find(x=>x.id===id)));m.ratings=m.ratings||{};
    document.querySelectorAll('.rate[data-pid]').forEach(row=>{const pid=row.dataset.pid;if(row.dataset.skip==='1'){delete m.ratings[pid];return}const o={};K.forEach(k=>{o[k]=Math.min(10,Math.max(1,+$(`#r_${CSS.escape(pid)}_${k}`).value||7))});m.ratings[pid]=o});
    await putMatch(m);closeModal();toast('Ratings saved');return}
  if(a==='theme'){theme=THEMES[(THEMES.indexOf(theme)+1)%3];ls('atb_theme',theme);applyTheme(theme);return}
  if(a==='rmphoto'){pendPhoto=null;$('#pface').textContent=initials($('#pn').value);const pv=document.querySelector('.cardprev .ph');if(pv)pv.innerHTML=SIL;return}
  if(a==='addguest'){openModal(`<div class="mh"><h2>Add guest</h2><button class="btn ghost x" data-a="close">Close</button></div><div class="stack">
    <div class="row" style="align-items:flex-end;gap:10px"><label class="f" style="flex:1 1 180px">Name<input id="gn"></label><label class="f">Position<select id="gp">${POS.map(x=>`<option>${x}</option>`).join('')}</select></label>
    <label class="f">Level<select id="gl">${[[60,'Beginner (60)'],[66,'Casual (66)'],[72,'Average (72)'],[78,'Good (78)'],[84,'Very good (84)'],[90,'Top (90)']].map(([v,l])=>`<option value="${v}" ${v===72?'selected':''}>${l}</option>`).join('')}</select></label></div>
    <p class="small muted" style="margin:0">Guests appear only on Match Day and are left out of the squad and availability link. You can rate them after the game like anyone else.</p>
    <div class="row"><button class="btn primary" data-a="saveguest">Add and mark in</button></div></div>`);setTimeout(()=>$('#gn')?.focus(),50);return}
  if(a==='saveguest'){const name=$('#gn').value.trim();if(!name){toast('Enter a name');return}const v=+$('#gl').value/10;const gid='guest-'+slug(name)+'-'+uid().slice(-3);
    await putPlayer({id:gid,name,pos:$('#gp').value,guest:true,active:true,base:Object.fromEntries(K.map(k=>[k,v])),baseN:0});draft.avail.push(gid);
    if(draft.teams){const pos=$('#gp').value;let bi=0,bv=1e9;draft.teams.forEach((t,i)=>{const x=t.length*1000+t.filter(y=>posOf(y)===pos).length*100+teamStats(t).tot;if(x<bv){bv=x;bi=i}});draft.teams[bi].push(gid);draft.alts=[draft.teams]}
    saveDraft();closeModal();render();toast(name+' added as a guest');return}
  if(a==='clearguests'){if(el.dataset.sure){for(const p of S.players.filter(p=>p.guest))await delPlayer(p.id);toast('Guests removed')}else{el.dataset.sure=1;el.textContent='Tap again to remove all guests';setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent='Remove guests'}},3000)}return}
  if(a==='pollopen'){el.disabled=true;const players=S.players.filter(p=>p.active!==false&&!p.guest).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>({id:p.id,name:p.name,pos:p.pos}));
    const {data,error}=await supa.from('atb_polls').insert({owner:teamOwner,kickoff:kickoffISO(draft.date),match_date:draft.date,time_label:S.settings.time,title:'Saturday Soccer',players}).select('id').single();
    if(error){toast('Could not open link: '+error.message);el.disabled=false;return}poll={date:draft.date,id:data.id,open:true,rsvp:{},loading:false,err:null};render();toast('Link ready. Copy the WhatsApp message');return}
  if(a==='pollrefresh'){await loadPoll(true);st.loaded=false;loadStats();toast('Answers updated');return}
  if(a==='polluse'){const s=new Set(draft.avail);Object.entries(poll.rsvp).forEach(([k,v])=>{if(!pById(k))return;v==='in'?s.add(k):s.delete(k)});draft.avail=[...s];saveDraft();render();toast('Who’s playing updated from the link');return}
  if(a==='pollcopy'){const t=`⚽ *Saturday Soccer* – ${fmtDate(draft.date)}, ${S.settings.time}\nTap your name and say if you’re in:\n${pollUrl(poll.id)}`;try{await navigator.clipboard.writeText(t);toast('Copied. Paste it in WhatsApp')}catch(err){$('#pollurl').select();toast('Copy the link from the box')}return}
  if(a==='pollreset'){if(!el.dataset.sure){el.dataset.sure=1;el.textContent='Tap again to clear all answers';setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent='Reset answers'}},3000);return}
    const {error}=await supa.from('atb_rsvp').delete().eq('poll_id',poll.id);if(error){toast('Could not reset: '+error.message);return}poll.rsvp={};render();toast('All answers cleared. Players can answer again');return}
  if(a==='mgen'){$('#mp').value=genPw();return}
  if(a==='mreload'){mgrs={list:null,loading:false,err:''};render();return}
  if(a==='madd'){const username=$('#mu').value.trim().toLowerCase(),password=$('#mp').value;const msg=$('#mmsg');el.disabled=true;msg.textContent='Adding…';
    try{await mgrCall({action:'create',username,password});const t=`Airdrie United Team Builder\n${location.origin+location.pathname.replace(/[^/]*$/,'')}\nUsername: ${username}\nPassword: ${password}`;
      try{await navigator.clipboard.writeText(t);toast('Added '+username+'. Login details copied')}catch(e){toast('Added '+username)}mgrs.list=null;render()}
    catch(e){msg.textContent=e.message;el.disabled=false}return}
  if(a==='mreset'){const pw=$('#rp_'+CSS.escape(id)).value;if(pw.length<8){toast('Use at least 8 characters');return}try{await mgrCall({action:'reset',member:id,password:pw});toast('Password updated')}catch(e){toast(e.message)}return}
  if(a==='mdel'){if(!el.dataset.sure){el.dataset.sure=1;el.textContent='Tap again to remove';setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent='Remove'}},3000);return}
    try{await mgrCall({action:'remove',member:id});toast('Manager removed. They can no longer sign in');mgrs.list=null;render()}catch(e){toast(e.message)}return}
  if(a==='pollclose'||a==='pollreopen'){const open=a==='pollreopen';const {error}=await supa.from('atb_polls').update({open}).eq('id',poll.id);if(error){toast('Could not update link');return}poll.open=open;render();toast(open?'Link reopened':'Link closed. Players can no longer answer');return}
  if(a==='ssort'){const k=el.dataset.k;statsSort=statsSort.k===k?{k,d:-statsSort.d}:{k,d:k==='p'?1:-1};render();return}
  if(a==='gjump'){e.preventDefault();const d=document.getElementById('g-'+el.dataset.g);if(d){d.open=true;d.scrollIntoView({behavior:'smooth',block:'start'})}return}
  if(a==='sf'){squadFilter=el.dataset.f;render();return}
  if(a==='addp'){playerModal(null);return}
  if(a==='editp'){playerModal(id);return}
  if(a==='savep'){const name=$('#pn').value.trim();if(!name){toast('Enter a name');return}
    const old=id?pById(id):null;const base={};K.forEach(k=>base[k]=Math.min(10,Math.max(1,+$('#pb_'+k).value||7)));
    let nid=id||slug(name);if(!id&&pById(nid))nid+='-'+uid().slice(-3);
    const rec={...(old||{baseN:0}),id:nid,name,pos:$('#pp').value,active:$('#pa').checked,star:$('#pstar').checked,number:$('#pno').value.replace(/\D/g,'').slice(0,2),nation:$('#pnat').value,base};if(pendPhoto!==undefined){if(pendPhoto)rec.photo=pendPhoto;else delete rec.photo}
    await putPlayer(rec);closeModal();toast('Saved '+name);return}
  if(a==='copytxt'){const t=shareText(lastShare);try{await navigator.clipboard.writeText(t);toast('Copied. Paste it in WhatsApp')}catch(err){openModal(`<div class="mh"><h2>Copy text</h2><button class="btn ghost x" data-a="close">Close</button></div><textarea id="ctxt" style="width:100%;height:300px;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px">${esc(t)}</textarea>`);$('#ctxt').select()}return}
  if(a==='saveimg'){if(!window.html2canvas){toast('Image tool did not load. Take a screenshot instead');return}
    el.disabled=true;try{const c=await html2canvas($('#sharecard'),{backgroundColor:'#0F1B2B',scale:2});const blob=await new Promise(r=>c.toBlob(r,'image/png'));await saveFile('teams-'+lastShare.date+'.png',blob,'image/png')}catch(err){toast('Could not make the image. Take a screenshot instead')}el.disabled=false;return}
  if(a==='export'){await saveFile('airdrie-teams-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,1),'application/json');return}
});
document.addEventListener('change',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='date'){draft.date=el.value||nextSat();poll.date=null;saveDraft();render();return}
  if(a==='nteams'){draft.n=+el.value;draft.teams=null;draft.lu=[];draft.pitch={};draft.alts=[];draft.locks={};saveDraft();render();return}
  if(a==='tname'){draft.names[+el.dataset.i]=el.value.trim();saveDraft();render();return}
  if(a==='tkit'){const i=+el.dataset.i;const old=draft.kits[i];draft.kits[i]=el.value;const nm=draft.names[i];if(!nm||nm==='Team '+KITS[old])draft.names[i]='';saveDraft();render();return}
  if(a==='move'){const to=+el.value,id=el.dataset.id;draft.teams=draft.teams.map(t=>t.filter(x=>x!==id));draft.teams[to].push(id);if(draft.locks[id]!=null)draft.locks[id]=to;draft.alts=[draft.teams];saveDraft();render();return}
  if(a==='goal'){const m=JSON.parse(JSON.stringify(S.matches.find(x=>x.id===el.dataset.id)));const v=el.value;m.teams[+el.dataset.i].goals=v===''?null:+v;await putMatch(m);return}
  if(a==='set'){const k=el.dataset.k;S.settings[k]=el.type==='checkbox'?el.checked:(k==='time'?el.value:+el.value);await putSettings();return}
  if(a==='showoff'){showOff=el.checked;render();return}
  if(a==='potm'){const m=JSON.parse(JSON.stringify(S.matches.find(x=>x.id===el.dataset.id)));m.potm=el.value||null;await putMatch(m);if(el.value)toast('🏆 '+pById(el.value).name);return}
  if(a==='photo'){const f=el.files[0];if(!f)return;try{pendPhoto=await shrinkPhoto(f);$('#pface').innerHTML=`<img src="${pendPhoto}" alt="">`;const pv=document.querySelector('.cardprev .ph');if(pv)pv.innerHTML=`<img src="${pendPhoto}" alt="">`}catch(err){toast('Could not read that photo')}el.value='';return}
  if(a==='form'){const i=+el.dataset.i;const lu=teamLU(i);draft.lu[i]={f:el.value,gk:lu.gk};draft.sel=null;saveDraft();render();return}
  if(a==='gk'){const i=+el.dataset.i;draft.lu[i]={gk:el.checked};draft.sel=null;saveDraft();render();return}
  if(a==='import'){const f=el.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.players))throw 0;
      for(const p of j.players)await putPlayer(p);for(const m of j.matches||[])await putMatch(m);if(j.settings){Object.assign(S.settings,j.settings);await putSettings()}toast('Imported '+j.players.length+' players, '+(j.matches||[]).length+' matches')}catch(err){toast('That file is not a Team Builder backup')}el.value='';return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
(function(){const sp=$('#splash');let seen=false;try{seen=sessionStorage.getItem('atb_splash')==='1';sessionStorage.setItem('atb_splash','1')}catch(e){}
  if(seen){sp.remove();return}
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const hide=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),500)};
  sp.addEventListener('click',hide);setTimeout(hide,reduce?600:2100)})();
/* hover/tap tooltip for chart marks */
(()=>{const tip=document.createElement('div');tip.className='tip';tip.hidden=true;document.body.appendChild(tip);
  const show=e=>{const t=e.target.closest?.('[data-tip]');if(!t){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;
    const x=Math.min(innerWidth-tip.offsetWidth-8,Math.max(8,e.clientX-tip.offsetWidth/2));tip.style.left=x+'px';tip.style.top=Math.max(8,e.clientY-tip.offsetHeight-12)+'px'};
  document.addEventListener('pointermove',show);document.addEventListener('pointerdown',show);document.addEventListener('scroll',()=>tip.hidden=true,{passive:true})})();
addEventListener('offline',()=>toast('You’re offline. Changes may not save until you reconnect.'));
addEventListener('online',()=>toast('Back online'));
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.parent===window&&!location.hostname.endsWith('claude.ai')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
boot();
})();
</script>
