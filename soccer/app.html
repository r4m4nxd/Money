function chemTodo(){const d=PM.data,me=d.me.id,t=todayISO(),L=chemLog(),mine=d.chem||{};
  const m=S.matches.filter(x=>x.date<=t&&x.date>=addDays(t,-7)&&x.myatt!=='a'&&x.teams.some(tm=>tm.players.includes(me))).sort((a,b)=>a.date<b.date?1:-1)[0];
  const pr=m?myPeer(m.id):{},mates=m?m.teams.find(tm=>tm.players.includes(me)).players.filter(id=>id!==me&&pById(id)&&!pById(id).guest&&(!L.some(x=>x.r===id&&x.d>=m.date)||pr[id]==null)):[];
  const never=[];return {m,mates,never,pr,xp:mates.filter(id=>pr[id]==null).length*XP_PEER+mates.filter(id=>!L.some(x=>x.r===id&&x.d>=m.date)).length*XP_CHM+never.length*XP_CH1+(never.length||mates.some(id=>!mine[id])?XP_CHSQ:0)}}
const XPRULES=[['Play a match, on time',XP_ON],['Play but arrive late','+'+XP_LATE+' (half)'],['Say OUT on the link','0 (no penalty)'],['Win / draw','+50 / +20'],['Goal / assist','+40 / +25'],['Player of the Match',200],['Team of the Week',100],['Answer the link 2+ days early','+50 (else +20)'],['Tournament squad / winners / runners-up','+200 / +500 / +250'],['Earn a badge',100],['Beat your usual match rating','+40'],['Improve your focus area','+30'],['Your best match yet','+75'],['Open the app each day','+5 a day'],['Streak of 3 / 7 / 14 / 30 / 60 / 100 days','+15 / +40 / +80 / +150 / +250 / +400'],['Weekly challenge done','+60 each, +100 for all 3'],['Weekly league top 3','+150 / +100 / +50'],['Beat your weekly rival','+75'],['Prediction right: winner / POTM / exact goals','+30 / +50 / +40 (+15 within 1)'],['Rate a teammate’s match (1–10, within 7 days)','+'+XP_PEER+' each'],['Vote for Player of the Match','+'+XP_VOTE],['Make a prediction','+'+XP_PRED],['Complete your profile (nickname, card, style, best position, photo, birthday)','+'+XP_PROF],['Rate a teammate’s chemistry (first time)','+'+XP_CH1+' each'],['Rate your teammates within 7 days of a match','+'+XP_CHM+' each'],['Every squad-mate rated (keep it complete)','+'+XP_CHSQ],['No-show (said IN, didn’t come)',XP_NOSHOW+' and no link points']];
function xpEvents(){const me=PM.data.me.id,ev=[],noshow=new Set();
  S.matches.forEach(m=>{if(!m.teams.some(t=>t.players.includes(me)))return;const d=m.date;
    if(m.myatt==='a'){noshow.add(d);ev.push({d,x:XP_NOSHOW,l:'No-show'});return}
    ev.push({d,x:m.myatt==='l'?XP_LATE:XP_ON,l:m.myatt==='l'?'Played (arrived late)':'Played on time'});
    const ti=m.teams.findIndex(t=>t.players.includes(me)),r=resultOf(m,ti);if(r==='W')ev.push({d,x:50,l:'Win'});else if(r==='D')ev.push({d,x:20,l:'Draw'});
    const st=m.stats?.[me];if(st?.g)ev.push({d,x:40*st.g,l:`${st.g} goal${st.g>1?'s':''}`});if(st?.a)ev.push({d,x:25*st.a,l:`${st.a} assist${st.a>1?'s':''}`});
    if(m.potm===me)ev.push({d,x:200,l:'Player of the Match'});
    if(PM.data.totw?.match===m.id&&PM.data.totw.order.includes(me))ev.push({d,x:100,l:'Team of the Week'})});
  PM.data.polls.forEach(p=>{const f=(p.log||[]).find(l=>l.status!=='cleared');if(!f||noshow.has(String(p.match_date)))return;const lead=(new Date(p.kickoff||kickoffISO(p.match_date))-new Date(f.at))/36e5;
    ev.push({d:String(p.match_date),x:lead>=48?50:20,l:lead>=48?'Answered early':'Answered the link'})});
  S.tourns.filter(t=>(t.squad||[]).includes(me)&&t.date<=todayISO()).forEach(t=>{ev.push({d:t.date,x:200,l:'Tournament squad: '+t.name});if(t.place==='champ')ev.push({d:t.date,x:500,l:'Tournament winners'});if(t.place==='runner')ev.push({d:t.date,x:250,l:'Tournament runners-up'});const st=t.stats?.[me];if(st?.g)ev.push({d:t.date,x:40*st.g,l:`${st.g} tournament goal${st.g>1?'s':''}`});if(st?.a)ev.push({d:t.date,x:25*st.a,l:`${st.a} tournament assist${st.a>1?'s':''}`})});
  {const L=chemLog(),first={};L.forEach(x=>{if(!first[x.r]||x.d<first[x.r])first[x.r]=x.d});Object.keys(PM.data.chem||{}).forEach(r=>{if(!first[r])first[r]=''});
    const by={};Object.values(first).forEach(dd=>by[dd]=(by[dd]||0)+1);Object.entries(by).forEach(([dd,n])=>ev.push({d:dd,x:n*XP_CH1,l:`Rated chemistry with ${n} teammate${n>1?'s':''}`}));
    S.matches.forEach(m=>{if(m.myatt==='a')return;const tm=m.teams.find(t=>t.players.includes(me));if(!tm)return;const end=addDays(m.date,7);
      const n=tm.players.filter(id=>id!==me&&L.some(x=>x.r===id&&x.d>=m.date&&x.d<=end)).length;if(n)ev.push({d:m.date,x:n*XP_CHM,l:`Chemistry after the match (${n} teammate${n>1?'s':''})`})});
    const sq=chemMates();if(sq.length&&sq.every(p=>(PM.data.chem||{})[p.id]))ev.push({d:'',x:XP_CHSQ,l:'Full squad chemistry'})}
  {const pm={};(PM.data.peer||[]).forEach(([mid])=>pm[mid]=(pm[mid]||0)+1);Object.entries(pm).forEach(([mid,n])=>{const m=S.matches.find(x=>x.id===mid);ev.push({d:m?m.date:'',x:n*XP_PEER,l:`Match ratings for ${n} teammate${n>1?'s':''}`})})}
  S.matches.forEach(m=>{if(m.myvote&&m.teams.some(t=>t.players.includes(me)))ev.push({d:m.date,x:XP_VOTE,l:'Voted for Player of the Match'})});
  Object.keys(PM.data.preds||{}).forEach(d=>ev.push({d,x:XP_PRED,l:'Made a prediction'}));
  if(profDone())ev.push({d:'',x:XP_PROF,l:'Profile complete'});
  badgeList().filter(b=>b.got).forEach(b=>ev.push({d:'',x:100,l:'Badge: '+b.n}));
  compEvents(ev);

/* ---------- Unlocks: card designs, chemistry styles and PlayStyles open up as players earn XP; the admin can keep some for themselves ----------

const ulOf=(t,k)=>{const u=ULK()[t];if(u&&u[k]!=null)return +u[k];return t==='ps'?psDef(k):(UL_DEF[t]||{})[k]??0};

function ulState(t,k){const v=ulOf(t,k),own=amOwner();if(v===-1)return own?{only:true}:{hide:true};if(!PM||own||v<=0)return {};const xp=myXP();return xp>=v?{}:{lock:true,need:v,have:xp}}

const SLCFG=[[/^(pno|mno|pfno)$/,0,99,1,true],[/^pht$/,139,210,1,true,' cm'],[/^sm$/,30,240,5],[/^gm$/,3,30,1],[/^cm$/,0,10,1],[/^gyear$/,1949,2030,1,true],[/^gqty$/,0,100,1],[/^t(min|max)$/,4,80,1,true],[/^(gg|ga)_/,0,15,1],[/^(pb|r)_/,1,10,.5]];
const VDESC=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
function sliderize(root){if(!root||!root.querySelectorAll)return;
  root.querySelectorAll('input[type=number],input[inputmode=numeric],input.num').forEach(inp=>{if(inp.dataset.sl||inp.type==='password'||inp.type==='hidden'||inp.closest('[data-noslide]'))return;
    // counts (scores, goals, assists, quantities): − value + stepper
    if(/^(g[^_]*_\d+|gg_|ga_|tsg_|tsa_|gqty)/.test(inp.id||'')&&!/^(gm|gyear)$/.test(inp.id)){inp.dataset.sl='1';const emp=/^g[^_]*_\d+$/.test(inp.id)&&!/^g[ga]_/.test(inp.id),mx=/^gqty/.test(inp.id)?999:/^g[^_]*_\d+$/.test(inp.id)&&!/^g[ga]_/.test(inp.id)?40:15;
      const w=document.createElement('span');w.className='stp';w.innerHTML='<button type="button" aria-label="Less">−</button><output></output><button type="button" aria-label="More">+</button>';inp.after(w);inp.type='hidden';
      const o=w.querySelector('output'),[bm,bp]=w.querySelectorAll('button');let t=0;
      const show=()=>{const v=VDESC.get.call(inp);o.textContent=v===''?(emp?'–':'0'):v;o.classList.toggle('off',v===''||v==='0');bm.disabled=v===''||(!emp&&+v<=0)};
      Object.defineProperty(inp,'value',{configurable:true,get(){return VDESC.get.call(this)},set(v){VDESC.set.call(this,v);show()}});
      const step=d=>{const cur=VDESC.get.call(inp);let n=cur===''?(d>0?0:null):+cur+d;if(n!=null&&n<0)n=emp?null:0;if(n!=null)n=Math.min(mx,n);VDESC.set.call(inp,n==null?'':String(n));show();inp.dispatchEvent(new Event('input',{bubbles:true}));clearTimeout(t);t=setTimeout(()=>inp.dispatchEvent(new Event('change',{bubbles:true})),450);try{navigator.vibrate&&navigator.vibrate(5)}catch(e){}};
      bm.onclick=e=>{e.preventDefault();step(-1)};bp.onclick=e=>{e.preventDefault();step(1)};show();return}
    const c=SLCFG.find(([re])=>re.test(inp.id||''));let [,mn,mx,st,emp,suf]=c||[];
    mn=mn??(inp.min!==''?+inp.min:0);mx=mx??(inp.max!==''?+inp.max:99);st=st??(inp.step&&inp.step!=='any'?+inp.step:1);suf=suf||'';
    inp.dataset.sl='1';const wrap=document.createElement('span');wrap.className='sld';const r=document.createElement('input');r.type='range';r.min=mn;r.max=mx;r.step=st;r.setAttribute('aria-label',inp.closest('label')?.firstChild?.textContent?.trim()||'value');
    const o=document.createElement('output');wrap.append(r,o);inp.after(wrap);inp.type='hidden';
    const show=v=>{const e=v===''||v==null;o.textContent=e?'–':v+suf;o.classList.toggle('off',e)};
    const fromInp=()=>{const v=VDESC.get.call(inp);r.value=v===''?mn:v;show(v===''&&emp?'':v===''?String(mn):v)};
    Object.defineProperty(inp,'value',{configurable:true,get(){return VDESC.get.call(this)},set(v){VDESC.set.call(this,v);fromInp()}});
    if(VDESC.get.call(inp)===''&&!emp)VDESC.set.call(inp,'');fromInp();
    r.addEventListener('input',()=>{const v=emp&&+r.value===mn?'':r.value;VDESC.set.call(inp,v);show(v);inp.dispatchEvent(new Event('input',{bubbles:true}))});
    r.addEventListener('change',()=>inp.dispatchEvent(new Event('change',{bubbles:true})))})}

function rotation(d){const n=d.teams.length;if(n<3)return null;

  const used=G*g+(G-1)*c;return {P,reps:Math.floor(G/P.length),extra:G%P.length,g,c,games:G,each:G*2/n,spare:Math.max(0,tot-used),tot}}

  if(a==='nteams'){draft.n=+el.value;draft.teams=null;draft.lu=[];draft.pitch={};draft.alts=[];draft.locks={};saveDraft();render();return}
  if(a==='tname'){draft.names[+el.dataset.i]=el.value.trim();saveDraft();render();return}
  if(a==='tkit'){const i=+el.dataset.i;const old=draft.kits[i];draft.kits[i]=el.value;const nm=draft.names[i];if(!nm||nm==='Team '+KITS[old])draft.names[i]='';saveDraft();render();return}
  if(a==='move'){const to=+el.value,id=el.dataset.id;draft.teams=draft.teams.map(t=>t.filter(x=>x!==id));draft.teams[to].push(id);if(draft.locks[id]!=null)draft.locks[id]=to;draft.alts=[draft.teams];saveDraft();render();return}
  if(a==='goal'){const m=JSON.parse(JSON.stringify(S.matches.find(x=>x.id===el.dataset.id)));const v=el.value;m.teams[+el.dataset.i].goals=v===''?null:+v;await putMatch(m);return}
  if(a==='awpick'){S.settings.awardPick={...(S.settings.awardPick||{}),[el.dataset.k]:el.value||undefined};if(!el.value)delete S.settings.awardPick[el.dataset.k];await putSettings();return}
  if(a==='set'){const k=el.dataset.k;S.settings[k]=el.type==='checkbox'?el.checked:(k==='time'?el.value:+el.value);if(k==='autoLink'&&el.checked)S.settings.appUrl=location.origin+location.pathname.replace(/[^/]*$/,'');if(k==='maxPlayers')syncOpenPolls();await putSettings();return}
  if(a==='dcap'){draft.caps={...(draft.caps||{}),[+el.dataset.i]:el.value};saveDraft();render();return}
  if(a==='tstaff'){const t={...S.tourns.find(x=>x.id===el.dataset.id)};t[el.dataset.k]=el.value.trim().slice(0,40);await putDoc('tournaments',t.id,t);return}
  if(a==='tcapt'||a==='tform'||a==='tgk'||a==='tonp'){const t=JSON.parse(JSON.stringify(S.tourns.find(x=>x.id===el.dataset.id)));const sq=(t.squad||[]).filter(pById);
    if(a==='tcapt')t.captain=el.value;const cur=tLU(t);if(a==='tform')t.lu={n:cur.n,f:el.value,gk:cur.gk};if(a==='tgk')t.lu={n:cur.n,gk:el.checked};if(a==='tonp')t.lu={n:+el.value,gk:cur.gk};if(a!=='tcapt'){t.lu=tLU(t);tSlot=null}await putDoc('tournaments',t.id,t);return}
  if(a==='gearphoto'){for(const f of [...el.files].slice(0,4-pendGear.length)){const u=await resizeImg(f,640);if(u)pendGear.push(u)}gThumbs();return}
  if(a==='gcol'){$('#gcols').innerHTML=gColSel(gColVals());return}
  if(a==='gcat'){$('#gm').className='stack gm c-'+el.value;return}
  if(a==='tsee'){const t={...S.tourns.find(x=>x.id===el.dataset.id)};Object.assign(t,tSeeVal(el.value,t,t.date));docAct='Tournament visibility';await putDoc('tournaments',t.id,t);return}
  if(a==='psone'||a==='psbulk'){const all=PSTYLES.flatMap(([,l])=>l).map(x=>x[1]),key=v=>v.toLowerCase().replace(/\.[a-z0-9]+$/,'').replace(/[^a-z]/g,'');const ic={...(S.settings.psIcons||{})};let n=0,miss=[];
    for(const f of el.files){const nm=a==='psone'?el.dataset.n:all.find(x=>key(f.name).includes(key(x)))||all.find(x=>key(x).includes(key(f.name))&&key(f.name).length>3);if(!nm){miss.push(f.name);continue}const u=await iconImg(f);if(u){ic[nm]=u;n++}}
    S.settings.psIcons=ic;await putSettings();render();toast(`${n} icon${n===1?'':'s'} updated`+(miss.length?`. Not matched: ${miss.slice(0,4).join(', ')}${miss.length>4?'…':''}`:''));return}
  if(a==='settip'){if(!isAdmin)return;const u=$('#tipurl').value.trim();if(u&&!/^https:\/\/[^\s"'<>]+$/.test(u)){toast('Use a full https:// link');return}S.settings.tip={on:$('#tipon').checked,url:u||TIPURL};await putSettings();toast('Saved');return}
  if(a==='godset'){if(!isAdmin)return;const k=el.dataset.k;const {error}=await supa.from('atb_notify').update({[k]:el.checked}).eq('member',supaUser.id).eq('team',teamOwner);if(error){toast('Could not save');el.checked=!el.checked;return}ntf[k]=el.checked;toast(el.checked?'Alerts on':'Alerts off');return}
  if(a==='setportal'){S.settings.playerLogin=el.value==='on';S.settings.playerSetup=el.value==='setup';await putSettings();toast(el.value==='on'?'Player portal is open':el.value==='setup'?'Players can now create their PIN. The portal stays closed':'Player sign-in is closed');render();return}
  if(a==='showoff'){showOff=el.checked;render();return}
  if(a==='ntfen'){const {error}=await supa.from('atb_notify').update({enabled:el.checked}).eq('member',supaUser.id).eq('team',teamOwner);if(!error){ntf.enabled=el.checked;toast(el.checked?'Alerts resumed':'Alerts paused')}return}
  if(a==='clubprev'){$('#pcbadge').innerHTML=clubBadge(el.value)||'<span class="cb"></span>';return}
  if(a==='potm'){const m=JSON.parse(JSON.stringify(S.matches.find(x=>x.id===el.dataset.id)));m.potm=el.value||null;await putMatch(m);if(el.value)toast('🏆 '+pById(el.value).name);return}
  if(a==='photo'){const f=el.files[0];if(!f)return;try{const cp=await cropPhoto(f);if(!cp){el.value='';return}pendPhoto=cp.src;pendCut=cp.cut;$('#pface').innerHTML=`<img src="${pendPhoto}" alt="">`;const pv=document.querySelector('.cardprev .ph');if(pv){pv.innerHTML=`<img src="${pendPhoto}" alt="">`;pv.classList.toggle('cut',!!pendCut)}}catch(err){toast('Could not read that photo')}el.value='';return}
  if(a==='form'){const i=+el.dataset.i;const lu=teamLU(i);draft.lu[i]={f:el.value,gk:lu.gk};draft.sel=null;saveDraft();render();return}
  if(a==='gk'){const i=+el.dataset.i;draft.lu[i]={gk:el.checked};draft.sel=null;saveDraft();render();return}
  if(a==='import'){const f=el.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.players))throw 0;
      for(const p of j.players)await putPlayer(p);for(const m of j.matches||[])await putMatch(m);if(j.settings){Object.assign(S.settings,j.settings);await putSettings()}toast('Imported '+j.players.length+' players, '+(j.matches||[]).length+' matches')}catch(err){toast('That file is not a Team Builder backup')}el.value='';return}
});

  if(seen){sp.remove();return}
  {const box=sp.querySelector('.sp-stars'),R=Math.min(innerWidth*.56,260),N=22,star='<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 1.5l2.9 6.9 7.4.6-5.6 4.9 1.7 7.3L12 17.3l-6.4 3.9 1.7-7.3L1.7 9l7.4-.6z"/></svg>';let h='';
    for(let i=0;i<N;i++){const a=Math.PI*(1.08+.84*i/(N-1)),rx=R*.78,ry=R*.74,x=Math.cos(a)*rx,y=Math.sin(a)*ry-R*.02,sc=.75+.35*Math.sin(Math.PI*i/(N-1));
      h+=`<i class="sp-star" style="--x:${x.toFixed(1)}px;--y:${y.toFixed(1)}px;--sx:${(x*2.6-R*1.4).toFixed(1)}px;--sy:${(R*1.9).toFixed(1)}px;--s:${sc.toFixed(2)};--d:${(.35+i*.045).toFixed(3)}s">${star}</i>`}
    box.innerHTML=h}
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const hide=()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),500)};

(()=>{const tip=document.createElement('div');tip.className='tip';tip.hidden=true;document.body.appendChild(tip);
  const show=e=>{const t=e.target.closest?.('[data-tip]');if(!t){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;
    const x=Math.min(innerWidth-tip.offsetWidth-8,Math.max(8,e.clientX-tip.offsetWidth/2));tip.style.left=x+'px';tip.style.top=Math.max(8,e.clientY-tip.offsetHeight-12)+'px'};
  document.addEventListener('pointermove',show);document.addEventListener('pointerdown',show);document.addEventListener('scroll',()=>tip.hidden=true,{passive:true})})();
