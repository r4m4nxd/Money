<title>Airdrie Team Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: sticky club header + angled tab bar, one working column; FC-style cut-corner panels; kit-coloured team columns */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F3F6FB; --ink:#0B1630; --muted:#56627A; --line:#D6DDE9;
  --accent:#D96A0F; --accent-ink:#FFFFFF; --gold:#B8862A; --warn:#B4531A; --bad:#C62F3E; --good:#138A5A;
  --hdr1:#0A1F44; --hdr2:#123A7A; --hdr-ink:#F4F7FB;
  --gold1:#F6DC86; --gold2:#B8862A; --silver1:#EEF1F4; --silver2:#9AA4AF; --bronze1:#EDBB8C; --bronze2:#94603A; --card-ink:#17120A;
  --star1:#0B1D3F; --star2:#1C3F86; --star-ink:#F7D27A;
  --blue:#2F6FD6; --green:#1E9A52; --orange:#EE8A1A; --red:#D23B3B; --purple:#7B4BC9; --black:#2A2E35;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --cut:12px; --club-orange:#E07B24; --boards:#C9D1D8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060D1A; --surface:#0E1A2F; --surface2:#13223C; --ink:#EAF0F8; --muted:#8D9BB4; --line:#22324E;
  --accent:#F58A2A; --accent-ink:#1B0C00; --gold:#F2C46B; --warn:#FFB547; --bad:#FF5C6C; --good:#3DDC97;
  --hdr1:#050B17; --hdr2:#0E2552; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060D1A; --surface:#0E1A2F; --surface2:#13223C; --ink:#EAF0F8; --muted:#8D9BB4; --line:#22324E;
  --accent:#F58A2A; --accent-ink:#1B0C00; --gold:#F2C46B; --warn:#FFB547; --bad:#FF5C6C; --good:#3DDC97;
  --hdr1:#050B17; --hdr2:#0E2552; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding-block:12px 4px;flex-wrap:wrap}
.brand{align-items:center}.crest{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--club-orange)}
#splash{position:fixed;inset:0;z-index:200;background:radial-gradient(circle at 50% 42%,#0E3F80 0,#072F63 45%,#041C3D 100%);display:grid;place-items:center;transition:opacity .45s ease,visibility .45s}
#splash.out{opacity:0;visibility:hidden}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.sp-crest{position:relative;width:min(56vw,260px);aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 3px #E07B24,0 18px 50px rgba(0,0,0,.5)}
.sp-crest img{width:100%;height:100%;display:block}
.sp-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,235,190,.55) 50%,transparent 65%);transform:translateX(-120%)}
.sp-ring{position:absolute;top:calc(min(56vw,260px)/-2*0.1);width:calc(min(56vw,260px)*1.1);left:50%;margin-left:calc(min(56vw,260px)*-.55);overflow:visible}
.sp-ring circle{fill:none;stroke:#E07B24;stroke-width:2.5;stroke-dasharray:604;stroke-dashoffset:604;transform:rotate(-90deg);transform-origin:center}
.sp-t{margin-top:18px;font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:#F2C46B}
.sp-s{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#E07B24}
@media (prefers-reduced-motion:no-preference){
  .sp-crest{animation:spIn .9s cubic-bezier(.2,.9,.25,1.2) both}
  .sp-shine{animation:spShine .8s .75s ease-out both}
  .sp-ring circle{animation:spRing 1s .2s ease-out forwards}
  .sp-t{animation:spUp .5s .7s ease-out both}.sp-s{animation:spUp .5s .85s ease-out both}
}
@keyframes spIn{from{transform:scale(.55) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spShine{to{transform:translateX(120%)}}
@keyframes spRing{to{stroke-dashoffset:0}}
@keyframes spUp{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand small{color:var(--muted);font-size:13px}
.sync{margin-left:auto;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 8px}
nav.tabs button{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h2{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
button,.btn{font:inherit;cursor:pointer}
.btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}textarea{width:100%;resize:vertical}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.num{font-variant-numeric:tabular-nums}
.pos{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.3}
.pos.DEF{color:#2F6FD6} .pos.MID{color:#1E9A52} .pos.FWD{color:#D23B3B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pos.DEF{color:#7EA9F0}:root:not([data-theme="light"]) .pos.FWD{color:#F08A8A}:root:not([data-theme="light"]) .pos.MID{color:#5FD08E}}
:root[data-theme="dark"] .pos.DEF{color:#7EA9F0}:root[data-theme="dark"] .pos.FWD{color:#F08A8A}:root[data-theme="dark"] .pos.MID{color:#5FD08E}

/* availability chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 10px 5px 6px;cursor:pointer;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .o{font-family:var(--f-display);font-weight:700;font-size:13px;min-width:22px;text-align:center}
.grp{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;padding-block:6px;border-top:1px dashed var(--line)}
.grp:first-child{border-top:0}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0;display:flex;flex-direction:column}.team .plist{flex:1 0 auto}
.team .hd{padding:10px 12px;color:#fff;display:flex;align-items:center;gap:8px}
.team .hd input{background:rgba(255,255,255,.18);border:0;color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;width:100%}
.team .hd select{background:rgba(0,0,0,.18);border:0;color:#fff;padding:3px}
.plist{list-style:none;margin:0;padding:4px 0}
.plist li{display:grid;grid-template-columns:40px 1fr auto auto;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist select{padding:2px 4px;font-size:12px}
.lock{background:none;border:0;padding:2px 4px;color:var(--muted);font-size:14px}
.lock[aria-pressed="true"]{color:var(--warn)}
.stats{padding:10px 12px;background:var(--surface2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stats .d{font-size:11px}
.up{color:var(--good)} .dn{color:var(--bad)}
.lines{font-size:12px;color:var(--muted);padding:0 12px 8px;background:var(--surface2)}
.balance{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:600;font-size:12px}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.meh{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* FIFA-style cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;border-radius:12px 12px 40px 40px/12px 12px 24px 24px;padding:10px 10px 14px;color:var(--card-ink);cursor:pointer;border:0;text-align:left;font:inherit;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 1px 0 rgba(0,0,0,.08)}
.card.gold{--t1:var(--gold1);--t2:var(--gold2)} .card.silver{--t1:var(--silver1);--t2:var(--silver2)} .card.bronze{--t1:var(--bronze1);--t2:var(--bronze2)}
.card.off{opacity:.5}
.card .ovr{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:.9}
.card .ps{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.05em}
.card .cn{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;margin-top:10px;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cs{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;margin-top:6px;font-size:13px;font-variant-numeric:tabular-nums}
.card .cs b{font-family:var(--f-display);font-size:15px;margin-right:3px}
.card .fm{position:absolute;right:10px;top:10px;font-size:12px;font-weight:700}
.card .wl{font-size:11px;margin-top:6px;opacity:.8}

/* matches */
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.mact{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.mact .btn{width:100%}.mact .mdel{grid-column:1/-1;justify-self:end;width:auto}@media(max-width:600px){.mact{grid-template-columns:1fr 1fr}}
.score{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.score .k{width:12px;height:12px;border-radius:3px;display:inline-block}
.score input{width:52px;text-align:center}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(6,10,16,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:24px 12px}
.scrim>.modal{max-height:100%;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:mIn .18s ease-out}@keyframes mIn{from{opacity:0;transform:scale(.97)}}.scrim>.modal.nudge{animation:nudge .25s}@keyframes nudge{50%{transform:scale(1.015)}}
body.mopen #main,body.mopen header.top{pointer-events:none;user-select:none}
.modal{background:var(--bg);color:var(--ink);border-radius:14px;width:100%;max-width:760px;padding:16px;border:1px solid var(--line)}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal .mh h2{margin:0}
.modal .mh .x{margin-left:auto}.modal .mh .mhb{margin-left:auto;display:flex;gap:6px;flex:none;align-items:center}.modal .mh .mhb .x{margin-left:0}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.attrs input{width:100%}
.rate{border-top:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:6px}
.atgrid{display:flex;flex-direction:column;gap:6px}.atrow{display:grid;grid-template-columns:minmax(90px,1fr) auto;gap:2px 10px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.atrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.atn{font-size:13px;color:var(--muted);text-align:right}.ads{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:3px}
.ad{width:10px;height:10px;border-radius:3px;display:inline-block}.ad.on{background:var(--good)}.ad.ns{background:#7A1020;color:#fff;font-size:8px;font-style:normal;display:inline-grid;place-items:center;line-height:1}.ad.off{background:var(--bad);opacity:.75}.ad.na{background:var(--line)}.ad.up{border:1px solid var(--line)}
.gai{display:flex;gap:10px}.gai label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.gai input{width:64px;padding:6px 8px}
.attrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding:8px 0;border-top:1px solid var(--line)}.attrow .an{font-weight:600;flex:1 1 120px}
.attseg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.attseg .as{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:700;padding:8px 10px;cursor:pointer;min-height:40px}
.attseg .as+.as{border-left:1px solid var(--line)}.attseg .as.p[aria-pressed=true]{background:var(--good);color:#fff}.attseg .as.l[aria-pressed=true]{background:var(--warn);color:#111}.attseg .as.a[aria-pressed=true]{background:var(--bad);color:#fff}
.sh3{margin:10px 0 0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.seasonbox{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fbin{font-size:14px;padding:6px 10px}
.rate .attrs{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.rate .attrs label{font-size:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* share card: fixed look so the screenshot is identical on every phone */
.sharecard{background:#0F1B2B;color:#F2F5F8;border-radius:14px;padding:18px;font-family:var(--f-body);max-width:560px;margin:0 auto}
.sharecard .sh{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.sharecard .sd{color:#A9B6C6;font-size:14px;margin:4px 0 14px}
.sharecard .sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sharecard .st{background:#172638;border-radius:10px;overflow:hidden}
.sharecard .st h4{margin:0;padding:8px 10px;font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff}
.sharecard .st ol{margin:0;padding:6px 10px 10px 30px;font-size:14px}
.sharecard .st li{padding:2px 0}
.sharecard .st li em{font-style:normal;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;color:#A9B6C6;margin-left:6px}
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.tb select{padding:3px 6px}
.stitle{background:var(--surface2);border-top:1px solid var(--line);padding:8px 12px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.prate{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;max-width:400px;margin:0 auto 8px;font-size:12px;color:var(--muted)}
.prate b{color:var(--ink);font-family:var(--f-display);font-size:15px}
.prate span:first-child{width:100%;text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pwrap{padding:4px 12px 12px}
.pitch{position:relative;width:100%;max-width:400px;aspect-ratio:3/4;margin:0 auto;border-radius:18px;border:5px solid var(--boards);background:#2F8F52;overflow:hidden}
.pitch .mk{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.tok{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:25%;background:none;border:0;padding:0;font:inherit;color:#fff;z-index:1}
button.tok{cursor:pointer}
.tok .dot{width:32px;height:32px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.02em;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.tok .tn{font-size:10px;line-height:1.15;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:4px;max-width:100%;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tok.sel .dot{outline:3px solid #FFD54A;outline-offset:2px}
.pitch.p2{container-type:inline-size;aspect-ratio:1/1.04;max-width:460px;border:0;border-radius:14px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.p2 .ptitle{position:absolute;top:4%;left:0;right:0;text-align:center;color:#111;font-family:var(--f-display);font-weight:900;font-size:clamp(17px,5.4vw,26px);letter-spacing:.01em;text-transform:uppercase;z-index:1;pointer-events:none;line-height:1}
.p2 .ptitle i{display:block;width:34px;height:4px;border-radius:2px;margin:6px auto 0}
.p2 .tok{gap:4px;color:#fff}.p2 .dw{position:relative;display:block}
.p2 .tok .dot{position:relative;width:clamp(30px,11cqw,50px);height:clamp(30px,11cqw,50px);border:2.5px solid var(--kc);background:#fff;color:#fff;font-size:clamp(11px,3.6cqw,17px);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.p2 .tok .dot.ini{background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.3),rgba(255,255,255,0) 70%),var(--kc);border-color:#fff;box-shadow:0 0 0 2.5px var(--kc),0 3px 8px rgba(0,0,0,.3)}
.p2 .dot.ini .sil{position:absolute;inset:18% 12% 0;width:76%;height:82%;fill:rgba(255,255,255,.28)}
.p2 .dot.ini b{position:relative;font-family:var(--f-display);font-weight:900;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.p2 .tok .dot img{object-position:50% 18%}
.p2 .nb{position:absolute;top:-4px;left:-7px;min-width:17px;height:17px;padding:0 3px;border-radius:99px;background:#fff;color:#111;font-size:10px;font-weight:800;display:grid;place-items:center;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.p2 .fg{position:absolute;top:-4px;right:-7px;width:17px;height:17px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1.5px #fff,0 1px 3px rgba(0,0,0,.3)}
.p2 .tok .tn{background:none;color:#fff;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(8px,2.7cqw,12px);line-height:1.35;padding:0 1px;text-shadow:0 1px 2px rgba(0,0,0,.55);display:block;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.p2 .fgc{background:#fff;display:grid;place-items:center;overflow:hidden}.p2 .fgc .cb{width:80%;height:80%;object-fit:contain}
.p2 .tok.sel .dot{outline:3px solid #FFD54A;outline-offset:2px}
.subs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-top:8px;font-size:13px}

/* One-time roster update when seed.json names a new season: drop players not on it, add new ones, refresh names/positions */
async function syncRoster(){quietLog=true;try{const j=await (await fetch('seed.json')).json();if(!j.season||S.settings.season===j.season)return;
  if(S.players.length){const keep=new Set(j.players.map(p=>p.id));let ch=0;
    for(const p of S.players.slice())if(!keep.has(p.id)){await delPlayer(p.id);ch++}
    for(const np of j.players){const cur=pById(np.id);if(!cur){await putPlayer(np);ch++}else if(cur.pos!==np.pos||cur.name!==np.name||cur.active===false){await putPlayer({...cur,name:np.name,pos:np.pos,active:true});ch++}}
    if(ch)toast('Squad updated to the '+j.season+' roster')}
  S.settings.season=j.season;await putSettings()}catch(e){}}

/* Supabase sync: one row per document in atb_docs, shaped like the db API the page already uses */
let supa=null, supaUser=null, teamOwner=null, myName='', isAdmin=false;
const ADMIN_EMAIL='rsramansingh96@gmail.com';
const MGR_DOMAINS=['aufc-managers.invalid','managers.aufc.local'];
function supaDB(client,uid){
  const cols={};
  const snap=col=>({docs:[...cols[col].map].map(([id,d])=>({id,exists:true,data:()=>d}))});
  const emit=col=>{const c=cols[col];if(!c.ready)return;const s=snap(col);c.cbs.forEach(f=>f(s))};
  function watch(col,fn,err){
    if(!cols[col]){cols[col]={map:new Map(),cbs:[],ready:false};
      client.from('atb_docs').select('id,data').eq('col',col).then(({data,error})=>{
        if(error){err&&err(error);return}data.forEach(r=>cols[col].map.set(r.id,r.data));cols[col].ready=true;emit(col)})}
    cols[col].cbs.push(fn);if(cols[col].ready)fn(snap(col));
  }
  client.channel('atb-'+uid).on('postgres_changes',{event:'*',schema:'public',table:'atb_docs'},p=>{
    const row=p.eventType==='DELETE'?p.old:p.new;if(!row||row.owner!==uid||!cols[row.col])return;
    if(p.eventType==='DELETE')cols[row.col].map.delete(row.id);else cols[row.col].map.set(row.id,row.data);emit(row.col)}).subscribe();
  const split=path=>{const i=path.indexOf('/');return [path.slice(0,i),path.slice(i+1)]};
  return {
    collection:col=>({onSnapshot:(fn,err)=>watch(col,fn,err)}),
    doc:path=>{const [col,id]=split(path);return {
      async set(data){const {error}=await client.from('atb_docs').upsert({owner:uid,col,id,data,updated_at:new Date().toISOString()});if(error)throw error;cols[col]&&(cols[col].map.set(id,data));},
      async delete(){const {error}=await client.from('atb_docs').delete().eq('col',col).eq('id',id);if(error)throw error;cols[col]&&cols[col].map.delete(id)},
      onSnapshot(fn,err){watch(col,s=>{const d=s.docs.find(x=>x.id===id);fn(d||{id,exists:false,data:()=>undefined})},err)}}}
  };
}

/* ---------- ratings model ---------- */
// Scores follow last season's sheet: FWD skips Defending, MID skips Speed+Strength, DEF skips Ball Skill, PACE = Speed.
function scores(a){
  const fwd=(a.pas+a.sho+a.bal+a.min+a.tea+a.spd+a.sta+a.str)/80;
  const mid=(a.pas+a.sho+a.def+a.bal+a.min+a.tea+a.sta)/70;
  const def=(a.pas+a.sho+a.def+a.min+a.tea+a.spd+a.sta+a.str)/80;
  const pace=a.spd/10;
  return {fwd,mid,def,pace,ovr:Math.round((fwd+mid+def+pace)/4*100)};
}
let CACHE=null;
function compute(){
  const ms=S.matches.slice().sort((a,b)=>a.date<b.date?-1:1);
  const out={};
  for(const p of S.players){
    let rs=ms.filter(m=>m.ratings&&m.ratings[p.id]).map(m=>({date:m.date,r:m.ratings[p.id]}));
    const N=+S.settings.recentN||0; if(N>0) rs=rs.slice(-N);
    const w=p.baseN>0?Math.min(p.baseN,+S.settings.baseW):(rs.length?0.5:1);
    const a={};for(const k of K){let s=(p.base?.[k]??7)*w;for(const x of rs)s+=+x.r[k];a[k]=s/(w+rs.length)}
    const sc=scores(a);
    const hist=rs.map(x=>({date:x.date,ovr:scores(x.r).ovr}));
    let W=0,D=0,L=0;
    for(const m of ms){const ti=m.teams.findIndex(t=>t.players.includes(p.id));if(ti<0||absentIn(m,p.id))continue;const gs=m.teams.map(t=>t.goals);if(gs.some(g=>g===''||g==null))continue;
      const mine=+gs[ti],best=Math.max(...gs.map(Number));const top=gs.filter(g=>+g===best).length;
      if(mine===best&&top===1)W++;else if(mine===best)D++;else L++}
    const apps=ms.filter(m=>playedIn(m,p.id)).length;const motm=ms.filter(m=>m.potm===p.id).length;
    out[p.id]={...sc,a,hist,W,D,L,games:rs.length,apps,motm};
  }
  return out;
}
const R=id=>CACHE[id]||{fwd:0,mid:0,def:0,pace:0,ovr:0,a:{},hist:[]};
const pById=id=>S.players.find(p=>p.id===id);
const lateFlag=id=>{if(!st.loaded)return '';const c=(commitCache||(commitCache=commitment()))[id];return c&&c.drops>=2?`<span class="lf" title="${c.drops} late drops">⚠${c.drops}</span>`:''};let commitCache=null;
const star=id=>pById(id)?.star?'<span class="star" title="Star player">★</span>':'';
const posOf=id=>(draft.posOverride&&draft.posOverride[id])||pById(id)?.pos||'MID';
function teamStats(ids){
  const rs=ids.map(R);
  const f=k=>avg(rs.map(r=>r[k]))*100;
  const c={DEF:0,MID:0,FWD:0};ids.forEach(id=>c[posOf(id)]++);
  return {atk:f('fwd'),mid:f('mid'),def:f('def'),pace:f('pace'),tot:(f('fwd')+f('mid')+f('def')+f('pace'))/4,c,n:ids.length};
}

/* ---------- balancer ---------- */
function lastPairs(){
  const ms=S.matches.slice().sort((a,b)=>a.date<b.date?1:-1).filter(m=>m.date<draft.date);
  const set=new Set();const m=ms[0];if(!m)return set;
  for(const t of m.teams)for(const a of t.players)for(const b of t.players)if(a<b)set.add(a+'|'+b);
  return set;
}
// Players with a late drop in the answer history; balancing spreads them so one team isn't left short on the night.
let riskyNow=new Set();
function riskySet(){if(S.settings.spreadLate===false)return new Set();const c=st.loaded?(commitCache||(commitCache=commitment())):{};const r=new Set(Object.keys(c).filter(k=>c[k].drops>0));S.matches.forEach(m=>Object.entries(m.att||{}).forEach(([id,v])=>{if(v==='a')r.add(id)}));return r}
function cost(T,pairs){
  const st=T.map(teamStats);
  const spread=k=>{const v=st.map(s=>s[k]);return Math.max(...v)-Math.min(...v)};
  let c=0;
  const sz=st.map(s=>s.n);c+=Math.max(0,Math.max(...sz)-Math.min(...sz)-1)*1000;
  for(const p of POS){const v=st.map(s=>s.c[p]);const d=Math.max(...v)-Math.min(...v);c+=d*6+Math.max(0,d-1)*60}
  c+=spread('tot')*12+spread('atk')*3+spread('mid')*3+spread('def')*3+spread('pace')*1.5;
  for(const t of T){const sc={};for(const id of t)if(pById(id)?.star){const p=posOf(id);sc[p]=(sc[p]||0)+1}for(const p in sc)if(sc[p]>1)c+=(sc[p]-1)*800}
  if(riskyNow.size){const v=T.map(t=>t.filter(id=>riskyNow.has(id)).length);const d=Math.max(...v)-Math.min(...v);c+=d*4+Math.max(0,d-1)*40}
  if(S.settings.mix&&pairs.size){for(const t of T)for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){const a=t[i],b=t[j];if(pairs.has(a<b?a+'|'+b:b+'|'+a))c+=1.2}}
  return c;
}
function balance(ids,n,locks){
  const pairs=lastPairs();const results=[];riskyNow=riskySet();
  const order={DEF:0,MID:1,FWD:2};
  for(let run=0;run<80;run++){
    const T=Array.from({length:n},()=>[]);
    ids.filter(id=>locks[id]!=null&&locks[id]<n).forEach(id=>T[locks[id]].push(id));
    const free=ids.filter(id=>!(locks[id]!=null&&locks[id]<n)).map(id=>({id,k:order[posOf(id)],o:R(id).ovr+Math.random()*6}))
      .sort((a,b)=>a.k-b.k||b.o-a.o);
    for(const x of free){
      let best=0,bv=1e9;
      T.forEach((t,i)=>{const v=t.length*1000+t.filter(id=>posOf(id)===posOf(x.id)).length*100+t.reduce((s,id)=>s+R(id).ovr,0)/50+Math.random();if(v<bv){bv=v;best=i}});
      T[best].push(x.id);
    }
    let cur=cost(T,pairs),imp=true,guard=0;
    while(imp&&guard++<40){imp=false;
      for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){
        for(let i=0;i<T[a].length;i++)for(let j=0;j<T[b].length;j++){
          const x=T[a][i],y=T[b][j];if(locks[x]!=null||locks[y]!=null)continue;
          T[a][i]=y;T[b][j]=x;const c=cost(T,pairs);
          if(c<cur-1e-9){cur=c;imp=true}else{T[a][i]=x;T[b][j]=y}
        }
      }
    }
    const sig=T.map(t=>t.slice().sort().join(',')).sort().join('/');
    if(!results.some(r=>r.sig===sig))results.push({T:T.map(t=>t.slice()),c:cur,sig});
  }
  results.sort((a,b)=>a.c-b.c);
  return results.slice(0,8);
}
function sortTeam(t){const o={DEF:0,MID:1,FWD:2};return t.slice().sort((a,b)=>o[posOf(a)]-o[posOf(b)]||(hideR?(pById(a)?.name||'').localeCompare(pById(b)?.name||''):R(b).ovr-R(a).ovr))}

      ${a.length?`<ol class="alog">${a.slice(0,60).map(row).join('')}</ol>`:'<p class="small muted">No activity yet.</p>'}</details>`}).join('')}</div>`}

function plog(action,detail){if(PM&&PM.tok)prpc('atb_player_log',{p_token:PM.tok,p_action:action,p_detail:detail||null}).catch(()=>{})}
async function prpc(fn,args){const {data,error}=await supa.rpc(fn,args);if(error)throw error;return data}
function playerSignedOut(msg){try{localStorage.removeItem('atb_player')}catch(e){}if(supaUser){ls('atb_mode','mgr');location.reload();return}PM=null;showLogin('',msg,'player')}

async function loadPlayer(){if(!PM||PM.loading)return;PM.loading=true;
  try{const d=PM.preview?await prpc('atb_admin_player_view',{p_player:PM.id}):await prpc('atb_player_data',{p_token:PM.tok});
    if(d.err&&PM.preview){toast('Could not open this profile');location.reload();return}
    if(d.err){PM.loading=false;playerSignedOut(d.err==='disabled'?'Player sign-in is turned off for now.':d.err==='blocked'?'Your profile access is turned off. Ask a manager.':'You were signed out (your PIN was reset or changed). Sign in again.');return}
    PM.data=d;PM.err='';
    S.players=[{...d.me},...d.players];S.matches=d.matches;S.tourns=d.tournaments||[];S.gear=d.gear||[];Object.assign(S.settings,d.settings);
    hideR=!d.showRatings;applyHide();$('#rbtn').hidden=true;
    $('#sub').textContent='Player profile';
    loaded=true}catch(e){PM.err=navigator.onLine?'Could not load your profile. Pull to refresh or try again.':'You’re offline.'}
  PM.loading=false;render()}

// Everything below is from this player's point of view.
function pSeasons(){return [...new Set(S.matches.map(m=>m.date.slice(0,4)))].sort().reverse()}
function pMatches(all){const y=PM.season;return S.matches.filter(m=>all||y==='all'||m.date.startsWith(y)).slice().sort((a,b)=>a.date<b.date?1:-1)}
function resultOf(m,ti){const gs=m.teams.map(t=>t.goals);if(gs.some(g=>g===''||g==null))return null;const mine=+gs[ti],best=Math.max(...gs.map(Number));
  return mine===best?(gs.filter(g=>+g===best).length===1?'W':'D'):'L'}
function myGames(ms){const me=PM.data.me.id;return ms.map(m=>{const ti=m.teams.findIndex(t=>t.players.includes(me));return ti<0||m.myatt==='a'?null:{m,ti,t:m.teams[ti],late:m.myatt==='l',res:resultOf(m,ti),potm:m.potm===me,g:+m.stats?.[me]?.g||0,a:+m.stats?.[me]?.a||0}}).filter(Boolean)}
function pSummary(){const ms=pMatches(),g=myGames(ms),me=PM.data.me.id;
  const W=g.filter(x=>x.res==='W').length,D=g.filter(x=>x.res==='D').length,L=g.filter(x=>x.res==='L').length,res=W+D+L;
  const gf=g.reduce((s,x)=>s+(+x.t.goals||0),0);
  // streaks (chronological)
  let cur='',n=0,bestW=0,run=0,unb=0,bestUnb=0;g.slice().reverse().forEach(x=>{if(!x.res)return;run=x.res==='W'?run+1:0;bestW=Math.max(bestW,run);unb=x.res!=='L'?unb+1:0;bestUnb=Math.max(bestUnb,unb)});
  for(const x of g){if(!x.res)continue;if(!cur){cur=x.res;n=1}else if(x.res===cur)n++;else break}
  // teammates
  const mates={};g.forEach(x=>x.t.players.forEach(id=>{if(id===me)return;const o=mates[id]=mates[id]||{id,n:0,w:0,r:0};o.n++;if(x.res){o.r++;if(x.res==='W')o.w++}}));
  const ml=Object.values(mates).filter(o=>pById(o.id));
  const most=ml.slice().sort((a,b)=>b.n-a.n)[0];const best=ml.filter(o=>o.r>=2&&o.w>0).sort((a,b)=>b.w/b.r-a.w/a.r||b.r-a.r)[0];
  const kits={};g.forEach(x=>{const k=x.t.kit||'';kits[k]=(kits[k]||0)+1});
  const goals=g.reduce((n,x)=>n+x.g,0),assists=g.reduce((n,x)=>n+x.a,0);
  return {goals,assists,g,ms,apps:g.length,W,D,L,res,win:res?W/res:null,gf,potm:g.filter(x=>x.potm).length,att:ms.length?g.length/ms.length:null,streak:cur?cur+n:'',bestW,bestUnb,mates:ml,most,best,kits}}
function pAvail(){const kick=p=>p.kickoff||kickoffISO(p.match_date);const y=PM.season;
  const ps=PM.data.polls.filter(p=>p.kind!=='tournament'&&(y==='all'||String(p.match_date).startsWith(y)));let answered=0,ins=0,drops=0,joins=0,lead=[];
  const rows=ps.map(p=>{const log=p.log||[],first=log.find(l=>l.status!=='cleared');const tags=log.map(l=>classify({...l},kick(p)).tag).filter(Boolean);
    if(first){answered++;lead.push((new Date(kick(p))-new Date(first.at))/36e5)}if(p.mine==='in')ins++;drops+=tags.filter(t=>t==='drop').length;joins+=tags.filter(t=>t==='join').length;
    return {p,first,final:p.mine,late:tags.includes('drop'),log}});
  return {rows,asked:ps.length,answered,ins,drops,joins,lead:lead.length?avg(lead):null}}
const hrs=h=>h==null?'–':h>=48?Math.round(h/24)+' days':Math.round(h)+' h';

function baseA(){const b=PM.data.me.base;return Object.fromEntries(K.map(k=>[k,+(b?.[k]??7)]))}
function growthInfo(){const rs=myRated();if(!rs.length)return null;const b=PM.data.me.base?baseA():null;
  const rec=rs.slice(-3),prev=rs.length>=4?rs.slice(-6,-3):null,av=(arr,k)=>avg(arr.map(x=>+x.r[k]||7));
  return (POSK[PM.data.me.pos]||POSK.MID).map(k=>{const now=av(rec,k),was=prev?av(prev,k):b?b[k]:rs.length>1?+rs[0].r[k]||7:null;return {k,now,d:was==null?null:now-was}})}
function focusInfo(){const me=PM.data.me,keys=POSK[me.pos]||POSK.MID,rs=myRated(),b=baseA(),w=+me.baseN>0?Math.min(+me.baseN,3):1;
  const run=(upto,k)=>{const arr=rs.slice(0,upto).map(x=>+x.r[k]||7);return (b[k]*w+arr.reduce((s,x)=>s+x,0))/(w+arr.length)};
  const weakest=upto=>keys.slice().sort((a,c)=>run(upto,a)-run(upto,c))[0];
  const hist=rs.map((x,i)=>{const f=weakest(i);return {date:x.m.date,k:f,ok:(+x.r[f]||7)>run(i,f)+0.01}});
  const k=weakest(rs.length);return {k,avg:run(rs.length,k),hist}}

  const res=g.filter(x=>x.res),W=res.filter(x=>x.res==='W').length;return {bestW,bestUnb,res:res.length,W,potm:g.filter(x=>x.potm).length,apps:g.length,goals:g.reduce((n,x)=>n+x.g,0),assists:g.reduce((n,x)=>n+x.a,0),maxG:Math.max(0,...g.map(x=>x.g))}}

const LEVELS=['Rookie','Squad Player','Regular','Starter','Key Player','Fan Favourite','Captain Material','Club Legend','Icon'];
const XPRULES=[['Play a match',150],['Arrive late',100],['Win / draw','+50 / +20'],['Goal / assist','+40 / +25'],['Player of the Match',200],['Team of the Week',100],['Answer the link 2+ days early','+50 (else +20)'],['Tournament squad / winners / runners-up','+200 / +500 / +250'],['Earn a badge',100],['No-show',-100]];
function xpEvents(){const me=PM.data.me.id,ev=[];
  S.matches.forEach(m=>{if(!m.teams.some(t=>t.players.includes(me)))return;const d=m.date;
    if(m.myatt==='a'){ev.push({d,x:-100,l:'No-show'});return}
    ev.push({d,x:m.myatt==='l'?100:150,l:m.myatt==='l'?'Played (late)':'Played'});
    const ti=m.teams.findIndex(t=>t.players.includes(me)),r=resultOf(m,ti);if(r==='W')ev.push({d,x:50,l:'Win'});else if(r==='D')ev.push({d,x:20,l:'Draw'});
    const st=m.stats?.[me];if(st?.g)ev.push({d,x:40*st.g,l:`${st.g} goal${st.g>1?'s':''}`});if(st?.a)ev.push({d,x:25*st.a,l:`${st.a} assist${st.a>1?'s':''}`});
    if(m.potm===me)ev.push({d,x:200,l:'Player of the Match'});

const ageAt=(dob,on)=>{if(!dob)return null;const b=new Date(dob+'T12:00'),d=new Date((on||todayISO())+'T12:00');let a=d.getFullYear()-b.getFullYear();if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))a--;return a};

// eligible: true, false, or null (no date of birth yet)
function eligible(t,p){const r=t.rule||{};if(!r.type||r.type==='open')return true;const a=ageAt(p.dob,r.asOf||t.date);if(a==null)return null;
  return (r.type==='max'||+r.min<=a||r.min==null||r.min==='')&&(r.type==='min'||+r.max>=a||r.max==null||r.max==='')}
const tRecord=t=>{const g=(t.games||[]).filter(x=>x.gf!==''&&x.gf!=null&&x.ga!==''&&x.ga!=null);return {W:g.filter(x=>+x.gf>+x.ga).length,D:g.filter(x=>+x.gf===+x.ga).length,L:g.filter(x=>+x.gf<+x.ga).length,GF:g.reduce((n,x)=>n+ +x.gf,0),GA:g.reduce((n,x)=>n+ +x.ga,0),n:g.length}};
const localCol=col=>col==='tournaments'?'tourns':col==='gear'?'gear':null;
async function putDoc(col,id,data){if(mode!=='db'){toast('Needs sync');return}try{await db.doc(col+'/'+id).set(data);const k=localCol(col);if(k){S[k]=[...S[k].filter(x=>x.id!==id),{...data,id}];render()}}catch(e){toast('Could not save: '+(e.message||e.code))}}

function tShareText(t){const sq=(t.squad||[]).filter(pById);return `🏆 *${t.name}* – ${fmtDate(t.date)}${t.time?', '+t.time:''}${t.venue?' · '+t.venue:''}\n${ruleTxt(t)}${t.format?' · '+t.format:''}\n\n*Squad*\n`+['DEF','MID','FWD'].map(pos=>sq.filter(id=>posOf(id)===pos).map(id=>`${pos} · ${pById(id).name}${t.captain===id?' (C)':''}`).join('\n')).filter(Boolean).join('\n')}

function tCareer(){const me=PM.data.me.id,L=myTourns().filter(t=>t.date<=todayISO());const o={n:L.length,champ:L.filter(t=>t.place==='champ').length,runner:L.filter(t=>t.place==='runner').length,g:0,a:0,W:0,D:0,L:0,cap:L.filter(t=>t.captain===me).length};

/* ---------- FC-style player page (managers: any player; players: themselves) ---------- */
// PlayStyles earned from real match ratings (out of 100); a "+" version at 88+
const PSTYLES=[['Finishing',[['','Finesse Shot',{sho:78,bal:74}],['','Chip Shot',{sho:75,bal:76}],['','Power Shot',{sho:80,str:72}],['','Dead Ball',{sho:76,pas:78}],['','Precision Header',{sho:76,str:76}],['','Acrobatic',{sho:76,bal:78}],['','Low Driven Shot',{sho:83}],['','Gamechanger',{sho:80,bal:80,min:76}]]],
  ['Passing',[['','Incisive Pass',{pas:80,min:75}],['','Pinged Pass',{pas:82}],['','Long Ball Pass',{pas:76,str:72}],['','Tiki Taka',{pas:78,tea:78}],['','Whipped Pass',{pas:76,spd:76}],['','Inventive',{pas:80,bal:78}]]],
  ['Defending',[['','Jockey',{def:75,spd:72}],['','Block',{def:80}],['','Intercept',{def:78,min:75}],['','Anticipate',{def:82}],['','Slide Tackle',{def:78,sta:78}],['','Aerial Fortress',{def:78,str:78}]]],
  ['Ball control',[['','Technical',{bal:78}],['','Rapid',{spd:82,bal:74}],['','First Touch',{bal:82}],['','Trickster',{bal:80,spd:78}],['','Press Proven',{bal:76,str:76}]]],
  ['Physical',[['','Quick Step',{spd:78}],['','Relentless',{sta:80,min:78}],['','Long Throw',{str:78,pas:70}],['','Bruiser',{str:82}],['','Enforcer',{str:78,def:75}]]],
  // goalkeeper ones are never automatic: managers award them
  ['Goalkeeper',[['','Far Throw',null],['','Footwork',null],['','Cross Claimer',null],['','Rush Out',null],['','Far Reach',null],['','Deflector',null]]]];
const PSOLD={'Low Driven Shot':'Low Driven','Long Ball Pass':'Long Ball'};
const psSlug=n=>n.toLowerCase().replace(/\s+/g,'-');
// EA FC icons: white = PlayStyle, gold = PlayStyle+ (a manager-uploaded icon wins)
const psIcon=(n,plus)=>`<img src="${S.settings.psIcons?.[n]||`icons/ps/${psSlug(n)}${plus?'+':''}.png`}" alt="" loading="lazy">`;
const psEdBtn=(n,o,au)=>{const on=o===true||(o===undefined&&au);return `<button type="button" class="pse${on?' on':''}${o===true?' give':''}${o===false?' take':''}" data-a="psset" data-n="${esc(n)}" data-au="${au?1:0}">${psBadge(n,on?'on':'')}<b>${esc(n)}</b><i>${o===true?'✓ Awarded':o===false?'✕ Removed':au?'Auto · earned':S.settings.psAuto!==false?'Auto · not earned':'Not awarded'}</i></button>`};
// st: '' (greyed), 'on' (awarded), 'plus' (elite)
const psBadge=(n,st)=>`<span class="psb${st?' '+st:''}">${psIcon(n,st==='plus')}</span>`;
const psAuto=(a,req)=>!!req&&Object.entries(req).every(([k,v])=>a[k]>=v);
let psCur=null;const psEarned=(a,req,name)=>{const o=psCur?.[name]??psCur?.[PSOLD[name]];return o===true?true:o===false?false:S.settings.psAuto!==false&&psAuto(a,req)};const psPlus=(a,req)=>!!req&&Object.entries(req).every(([k,v])=>a[k]>=Math.max(88,v+8));
const PSTYLE={pas:['🎯','Tiki Taka'],sho:['💥','Power Shot'],def:['🛡️','Intercept'],bal:['✨','Technical'],min:['🔥','Relentless'],tea:['🤝','Press Proven'],spd:['⚡','Rapid'],sta:['🔋','Engine'],str:['🦾','Bruiser']};
const PITCHFULL=`<svg class="mk" viewBox="0 0 300 330" preserveAspectRatio="none" aria-hidden="true">${[...Array(11)].map((_,i)=>`<rect y="${i*30}" width="300" height="30" fill="${i%2?'#2C7A36':'#338A3E'}"/>`).join('')}<g fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.4"><rect x="8" y="8" width="284" height="314"/><path d="M8 165H292"/><circle cx="150" cy="165" r="34"/><rect x="80" y="8" width="140" height="52"/><rect x="80" y="270" width="140" height="52"/></g></svg>`;
const FCGROUPS=[['Pace',['spd']],['Shooting',['sho']],['Passing',['pas','tea']],['Dribbling',['bal','min']],['Defending',['def']],['Physical',['str','sta']]];
function posRatings(r){const f=r.fwd*100,m=r.mid*100,d=r.def*100,pc=r.pace*100,x=v=>Math.round(v);
  return {ST:x(f),LW:x((f+pc)/2),RW:x((f+pc)/2),CAM:x((f+m)/2),LM:x((m+pc)/2),CM:x(m),RM:x((m+pc)/2),CDM:x((m+d)/2),LB:x((d+pc)/2),CB:x(d),RB:x((d+pc)/2)}}
function playerPage(id){const p=pById(id);if(!p)return;const r=R(id),show=!PM||PM.data.showRatings,v=n=>show?rv(n):'•';
  const a=Object.fromEntries(K.map(k=>[k,Math.round((r.a[k]||7)*10)]));
  psCur=p.ps||null;const earned=PSTYLES.flatMap(([,l])=>l).filter(x=>psEarned(a,x[2],x[1]));
  const t=p.star?'Special':tier(r.ovr)[0].toUpperCase()+tier(r.ovr).slice(1),age=ageAt(p.dob),club=p.club&&CLUB[p.club],nat=(NATIONS.find(n=>n[0]===p.nation)||[])[1];
  const ms=S.matches.filter(m=>playedIn(m,id)),g=ms.reduce((n,m)=>n+(+m.stats?.[id]?.g||0),0),as=ms.reduce((n,m)=>n+(+m.stats?.[id]?.a||0),0),potm=S.matches.filter(m=>m.potm===id).length;
  const tr=S.tourns.filter(x=>(x.squad||[]).includes(id)&&x.date<=todayISO());const star=n=>'★'.repeat(n||0)+'☆'.repeat(5-(n||0));
  const PR=posRatings(r),PP={ST:[50,12],LW:[17,17],RW:[83,17],CAM:[50,32],LM:[15,48],CM:[50,50],RM:[85,48],CDM:[50,67],LB:[17,82],CB:[50,86],RB:[83,82]};
  const best=Object.entries(PR).sort((x,y)=>y[1]-x[1])[0][0];
  openModal(`<div class="mh"><h2>${esc(titleName(p.name))}</h2><button class="btn ghost x" data-a="close">Close</button></div>
  <div class="pp">
    <div class="pptop"><div class="ppcard">${cardHTML(p,{btn:false,tier:!show&&PM?.data?.growth?tier(r.ovr):undefined})}</div>
      <div class="ppinfo"><div class="ppchips">${nat?`<span>${flagImg(p.nation)} ${esc(nat)}</span>`:''}${club?`<span>${clubBadge(p.club,'cb')} ${esc(club.n)}</span>`:''}<span><img src="icons/crest-640.jpg" class="cb" alt=""> ${esc((S.settings.club||{}).name||'Airdrie United')}</span><span class="tierc t-${tier(r.ovr)}">${t}</span></div>
        <div class="ppfacts"><div><i>Position</i><b>${p.pos}${show?` · best ${best}`:''}</b></div>${age!=null?`<div><i>Age</i><b>${age} years</b></div>`:''}
          <div><i>Foot</i><b>${esc(p.foot||'–')}</b></div><div><i>Height</i><b>${p.height?esc(p.height)+' cm':'–'}</b></div><div><i>Skills</i><b class="stars">${star(+p.skills)}</b></div><div><i>Weak foot</i><b class="stars">${star(+p.wf)}</b></div>
          ${p.number?`<div><i>Shirt</i><b>#${esc(p.number)}</b></div>`:''}</div>
        <div class="ppnums"><div><b>${ms.length}</b><i>Apps</i></div><div><b>${g}</b><i>Goals</i></div><div><b>${as}</b><i>Assists</i></div><div><b>${potm}</b><i>POTM</i></div><div><b>${tr.length}</b><i>Tournaments</i></div><div><b>${tr.filter(x=>x.place==='champ').length}</b><i>Titles</i></div></div></div></div>
    <div class="psgrid"><div class="gh2"><b>PlayStyles</b><span class="small muted">${earned.length} of ${PSTYLES.flatMap(([,l])=>l).length} awarded</span></div>${PSTYLES.map(([cat,l])=>`<div class="psrow"><i>${cat}</i><div>${l.map(x=>{const on=psEarned(a,x[2],x[1]),pl=on&&psPlus(a,x[2]);return `<div class="psx${on?' on':''}" title="${esc(x[1])}${on?' · awarded':' · not awarded yet'}">${psBadge(x[1],on?(pl?'plus':'on'):'')}<small>${x[1]}${pl?'+':''}</small></div>`}).join('')}</div></div>`).join('')}<p class="small muted" style="margin:2px 0 0">Coloured = awarded by the managers${S.settings.psAuto!==false?' or earned from match ratings':''}. Grey = not yet. Gold = elite (＋).</p></div>
    <div class="ppgrid">
      <div class="ppstats">${FCGROUPS.map(([nm,ks])=>{const gv=Math.round(ks.reduce((n,k)=>n+a[k],0)/ks.length);return `<div class="fcg"><div class="gh2"><b>${nm}</b><b class="num ${gv>=80?'hi':gv>=70?'md':'lo'}">${v(gv)}</b></div><div class="pbar"><i style="width:${show?gv:50}%"></i></div>${ks.map(k=>`<div class="sub"><span>${esc(KL[k])}</span><b class="num ${a[k]>=80?'hi':a[k]>=70?'md':'lo'}">${v(a[k])}</b></div>`).join('')}</div>`}).join('')}</div>
      <div class="pprpp"><b>Rating per position</b><div class="rpp">${PITCHFULL}${Object.entries(PP).map(([pos,[x,y]])=>`<span class="rp${pos===best&&show?' best':''}" style="left:${x}%;top:${y}%"><small>${pos}</small>${v(PR[pos])}</span>`).join('')}</div></div>
    </div>
    ${!show?'<p class="small muted">Numbers are private. Your managers can turn on “Players can see their own ratings”.</p>':''}
  </div>`);document.querySelector('.modal').classList.add('wide')}
