<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Airdrie United · Are you in?</title>
<meta name="theme-color" content="#072F63">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Saira+Condensed:wght@700;800&display=swap">
<style>
/* One screen for players: crest, date, their name, In / Out. Club night palette, single dark look on purpose. */
:root{--bg:#060D1A;--surface:#0E1A2F;--line:#22324E;--ink:#EAF0F8;--muted:#8D9BB4;--accent:#F58A2A;--accent-ink:#1B0C00;--good:#3DDC97;--bad:#FF5C6C;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;--f-body:"Barlow",system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;gap:12px;align-items:center}
header img{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 2px var(--accent)}
h1{font:800 26px/1 var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin:0}
.sub{color:var(--muted);margin-top:4px}
.when{margin-top:14px;background:linear-gradient(100deg,#0A1F44,#123A7A);border-left:4px solid var(--accent);padding:12px 14px}
.when .wd{font:800 22px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.when .wt{font:700 20px var(--f-display);color:#F2C46B;margin-top:2px}
.when .wc{font-size:13px;color:var(--muted);margin-top:4px}
.count{display:flex;gap:10px;margin:16px 0 10px}
.count div{flex:1;background:var(--surface);border:1px solid var(--line);padding:10px;text-align:center}
.count b{display:block;font:800 28px var(--f-display)}
.count .in b{color:var(--good)}.count b small{font-size:16px;color:var(--muted)}.count .wt2 b{color:#F2C46B}
.full{background:#2A2210;border:1px solid #6B5320;color:#F2C46B;padding:10px 12px;font-size:14px;margin:0 0 12px}
.st.wt{background:#6B5320;color:#F7E3A1}.count .out b{color:var(--bad)}
.me{background:linear-gradient(100deg,#0A1F44,#123A7A);border-bottom:2px solid var(--accent);padding:14px;margin-bottom:14px}
.me h2{font:800 20px var(--f-display);text-transform:uppercase;margin:0 0 8px}
.btns{display:flex;gap:8px}
.btns button{flex:1;padding:14px;font:800 18px var(--f-display);text-transform:uppercase;letter-spacing:.05em;border:0;cursor:pointer;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.bin{background:var(--good);color:#032014}.bout{background:#2A3A55;color:var(--ink)}
.btns button[aria-pressed="true"]{outline:3px solid #fff;outline-offset:-3px}
.pinl{display:block;font-size:13px;color:#C9D4E5;margin:2px 0 6px}
.pin{width:140px;font:800 26px var(--f-display);letter-spacing:.4em;text-align:center;margin-bottom:12px}
.pmsg{margin:10px 0 0;font-size:14px;color:#F2C46B}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:6px 0 0}
input{width:100%;padding:12px;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);margin-bottom:10px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:2px 4px;border-bottom:1px solid var(--line)}
li button.pick{flex:1;text-align:left;background:none;border:0;color:var(--ink);font:600 16px var(--f-body);cursor:pointer;padding:12px 0;min-height:44px}
.st{font:700 13px var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:2px 8px}
.st.in{background:var(--good);color:#032014}.st.out{background:#2A3A55;color:var(--muted)}
.pos{font:700 12px var(--f-display);color:var(--muted);width:32px}
.msg{text-align:center;color:var(--muted);padding:40px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* the profile teaser after voting: their card + what's waiting for them inside */
.tz{margin:0 0 16px;padding:14px;background:radial-gradient(120% 90% at 100% 0,#3B2A0E 0,transparent 60%),linear-gradient(135deg,#101E38,#0A1428);border:1.5px solid #F2C46B;border-radius:14px;display:grid;grid-template-columns:92px 1fr;gap:14px;align-items:center;animation:tzin .5s ease both}
@keyframes tzin{from{opacity:0;transform:translateY(10px)}}
.tzc{position:relative;width:92px;height:122px;border-radius:12px 12px 26px 26px;background:linear-gradient(160deg,#F6D98B,#B98A2E 60%,#7A5718);box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.35);overflow:hidden;color:#2A1A00}
.tzc.star{background:linear-gradient(160deg,#2B2B2B,#0B0B0B 60%,#3A2C10);color:#F6D98B}
.tzc img{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:62px;height:62px;object-fit:cover;border-radius:50%}
.tzc .ini{position:absolute;left:50%;top:34px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font:800 26px var(--f-display);background:rgba(0,0,0,.18)}
.tzc .lv{position:absolute;left:0;right:0;top:6px;text-align:center;font:800 15px/1 var(--f-display);letter-spacing:.04em}
.tzc .nm{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:800 13px var(--f-display);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.tzt{font:800 19px/1.15 var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:#F2C46B}
.tzl{list-style:none;margin:6px 0 10px;padding:0}.tzl li{display:block;border:0;padding:3px 0;font-size:14px}
.tzgo{display:block;text-align:center;background:var(--accent);color:var(--accent-ink);font:800 17px var(--f-display);text-transform:uppercase;letter-spacing:.06em;padding:12px;text-decoration:none;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));grid-column:1/-1;animation:tzp 2.4s ease-in-out 1s infinite}
@keyframes tzp{50%{filter:brightness(1.15);transform:scale(1.02)}}
@media (prefers-reduced-motion:reduce){.tz,.tzgo{animation:none}}
</style></head><body>
<div class="wrap" id="app"><p class="msg">Loading…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(()=>{
const SUPA_URL='https://dqjzufofmblerslcynzr.supabase.co',SUPA_KEY='sb_publishable_nO9M2WUxmc3smuX-FL0E8g_CNEzvTfE';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const pid=new URLSearchParams(location.search).get('p');
let sb,poll,rs={},at={},me=null,busy=false,pinState={},msg='',tz=null,tzFor=null;
const queue=()=>{const ins=poll.players.filter(p=>rs[p.id]==='in').map(p=>p.id).sort((a,b)=>(at[a]||'')<(at[b]||'')?-1:1);const m=poll.max_players||0;return {ok:m?ins.slice(0,m):ins,wait:m?ins.slice(m):[]}};
const fmt=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
function render(){
  if(!poll.open){app.innerHTML=head()+`<p class="msg">This link is closed. Ask in the group chat.</p>`;return}
  const q=queue(),ins=q.ok,outs=poll.players.filter(p=>rs[p.id]==='out');
  const mp=poll.players.find(p=>p.id===me);
  app.innerHTML=head()+`<div class="count"><div class="in"><b>${ins.length}${poll.max_players?`<small>/${poll.max_players}</small>`:''}</b>In</div>${q.wait.length?`<div class="wt2"><b>${q.wait.length}</b>Waitlist</div>`:''}<div class="out"><b>${outs.length}</b>Out</div><div><b>${poll.players.length-ins.length-q.wait.length-outs.length}</b>No answer</div></div>
  ${poll.max_players&&ins.length>=poll.max_players?`<p class="full">This week is full (${poll.max_players} players). Say you’re in to join the waitlist; you move up automatically if someone drops out.</p>`:''}
  ${mp?`<div class="me"><h2>${esc(mp.name)}, are you in?</h2>
      <label class="pinl" for="pin">${pinState[me]==='none'?'First time? Choose a PIN (4–6 digits; 6 is safer). You’ll use it every week, so only you can answer for your name.':'Your PIN'}</label>
      <input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="••••" value="${esc(ls('aufc_pin_'+me)||'')}">
      <div class="btns"><button class="bin" data-s="in" aria-pressed="${rs[me]==='in'}">I’m in</button><button class="bout" data-s="out" aria-pressed="${rs[me]==='out'}">Can’t make it</button></div>
      ${rs[me]==='in'&&q.wait.includes(me)?`<p class="pmsg">You’re #${q.wait.indexOf(me)+1} on the waitlist. You’ll move up automatically if someone drops out.</p>`:''}${msg?`<p class="pmsg" role="alert">${msg}</p>`:''}
      <button class="link" id="notme">Not ${esc(mp.name)}?</button>${tz&&tzFor===me?'':`<a class="link" id="prof" href="./" style="display:block;margin-top:6px">See your matches, teams and stats →</a>`}</div>${tz&&tzFor===me?teaser():''}`
     :`<div class="me"><h2>Tap your name</h2><input id="q" placeholder="Search your name" autocomplete="off"></div>`}
  <ul id="list">${poll.players.map(p=>`<li data-n="${esc(p.name.toLowerCase())}"><span class="pos">${esc(p.pos)}</span><button class="pick" data-id="${esc(p.id)}">${esc(p.name)}</button>${rs[p.id]?(q.wait.includes(p.id)?`<span class="st wt">Wait ${q.wait.indexOf(p.id)+1}</span>`:`<span class="st ${rs[p.id]}">${rs[p.id]==='in'?'In':'Out'}</span>`):''}</li>`).join('')}</ul>`;
  $('#q')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#list li').forEach(li=>li.hidden=!li.dataset.n.includes(q))});
}
// levels match the app: 500 XP for level 2, then each level needs 500 more than the last
const lvl=x=>{let L=1,need=500,base=0;while(x>=base+need){base+=need;L++;need+=500}return L};
function teaser(){const t=tz,first=String(t.nick||t.name||'').split(' ')[0],hooks=[];
  if(t.inTotw)hooks.push('⭐ Your <b>Team of the Week</b> card is waiting');
  if(t.gotRated>0)hooks.push(`👀 <b>${t.gotRated} teammate${t.gotRated>1?'s':''}</b> rated your last match. See how you did`);
  if(t.toRate>0)hooks.push(`✍️ Rate your <b>${t.toRate} teammate${t.toRate>1?'s':''}</b> from last match · <b>+${t.toRate*25} XP</b>`);
  if(t.team_name)hooks.push(`👕 Teams are out: you’re in <b>${esc(t.team_name)}</b>. See your line-up`);
  if(t.team_name&&!t.pred&&t.compete)hooks.push('🔮 Predict the winner, Player of the Match and your goals · <b>up to +120 XP</b>');
  if(t.compete&&t.wkRank)hooks.push(`🏆 You’re <b>#${t.wkRank}</b> of ${t.wkN} in this week’s league${t.wkRank>1?'. Catch the leader':'. Hold on to it!'}`);
  else if(t.compete&&t.lwRank)hooks.push(`🏆 You finished <b>#${t.lwRank}</b> last week. Start climbing again`);
  if(t.compete&&t.streak>1)hooks.push(`🔥 <b>${t.streak}-day streak</b>. Open your profile today to keep it`);
  else if(t.compete)hooks.push('🔥 Start a daily streak and earn XP every day');
  if(!t.token)hooks.push('Sign in with your name and this same PIN');
  const ini=String(t.name||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
  return `<div class="tz"><div class="tzc${t.star?' star':''}"><div class="lv">LV ${lvl(t.tot)}</div>${t.thumb?`<img src="${esc(t.thumb)}" alt="">`:`<div class="ini">${esc(ini)}</div>`}<div class="nm">${esc(t.nick||t.name)}</div></div>
    <div><div class="tzt">${esc(first)}, ${t.inTotw?'you made Team of the Week!':'your profile has news'}</div><ul class="tzl">${hooks.slice(0,4).map(h=>`<li>${h}</li>`).join('')}</ul></div>
    <a class="tzgo" id="tzgo" href="./">Open my profile →</a></div>`}
// after a vote (or on a return visit with the PIN saved): fetch the teaser and a one-tap profile sign-in
async function loadTeaser(pin){if(!me||!pin)return;try{const {data}=await sb.rpc('atb_vote_teaser',{p_poll:pid,p_player:me,p_pin:pin});if(data&&!data.err){tz=data;tzFor=me;render()}}catch(e){}}
function until(){if(!poll.kickoff)return '';const ms=new Date(poll.kickoff)-Date.now();if(ms<=0)return 'Kick-off has passed';
  const h=Math.floor(ms/36e5),d=Math.floor(h/24);return 'Kick-off in '+(d?d+' day'+(d>1?'s':'')+' ':'')+(h%24)+' h'+(d?'':' '+Math.floor(ms/6e4)%60+' min')}
const head=()=>`<header><img src="icons/crest-640.jpg" alt="Airdrie United crest"><div><h1>${esc(poll.title||'Saturday Soccer')}</h1><div class="sub">Airdrie United</div></div></header>
  <div class="when"><div class="wd">${fmt(poll.match_date)}</div><div class="wt">${esc(poll.time_label||'')}</div><div class="wc">${until()}</div></div>`;
async function loadPin(){if(!me||pinState[me])return;const {data}=await sb.rpc('atb_pin_status',{p_poll:pid,p_player:me});pinState[me]=data||'set'}
async function load(){const {data,error}=await sb.rpc('atb_poll_view',{p_poll:pid});
  if(error||!data){app.innerHTML='<p class="msg">This link doesn’t work any more. Ask in the group chat for the new one.</p>';return false}
  poll=data;poll.players=poll.players||[];rs={};at={};(data.rsvp||[]).forEach(x=>{rs[x.player_id]=x.status;at[x.player_id]=x.updated_at});
  me=ls('aufc_me');if(!poll.players.some(p=>p.id===me))me=null;return true}
app.addEventListener('click',async e=>{
  const pick=e.target.closest('.pick');if(pick){me=pick.dataset.id;ls('aufc_me',me);msg='';await loadPin();render();scrollTo({top:0,behavior:'smooth'});return}
  if(e.target.closest('#tzgo')&&tz){try{if(tz.token){const pl=poll.players.find(p=>p.id===me);localStorage.setItem('atb_player',JSON.stringify({tok:tz.token,team:tz.team,id:me,name:pl?.name||tz.name}));localStorage.setItem('atb_pl_use',JSON.stringify(Date.now()));localStorage.setItem('atb_view',JSON.stringify('me'))}
    localStorage.setItem('atb_plast',JSON.stringify(me));localStorage.setItem('atb_lrole',JSON.stringify('player'))}catch(x){}return}
  if(e.target.id==='prof'){try{localStorage.setItem('atb_plast',JSON.stringify(me));localStorage.setItem('atb_lrole',JSON.stringify('player'))}catch(x){}return}
  if(e.target.id==='notme'){me=null;ls('aufc_me',null);msg='';render();return}
  const b=e.target.closest('[data-s]');if(b&&me&&!busy){const pin=($('#pin')?.value||'').trim();const name=poll.players.find(p=>p.id===me)?.name||'';
    if(!/^[0-9]{4,6}$/.test(pin)){msg='Enter your 4–6 digit PIN first.';render();$('#pin')?.focus();return}
    busy=true;b.disabled=true;const status=b.dataset.s;
    const {data,error}=await sb.rpc('atb_vote',{p_poll:pid,p_player:me,p_status:status,p_pin:pin});busy=false;
    if(error){msg='Could not save. Check your signal and try again.';render();return}
    if(data==='ok'){ls('aufc_pin_'+me,pin);pinState[me]='set';await load();msg=status==='in'?(queue().wait.includes(me)?'':'You’re in. See you there!'):'Got it, you’re out this week.';loadTeaser(pin)}
    else if(data==='wrong_pin'){ls('aufc_pin_'+me,null);msg=`That PIN doesn’t match ${esc(name)}’s. If you forgot it, ask the manager to reset it.`}
    else if(data==='locked'){msg='Too many wrong PINs. Voting for this name is locked for an hour, or until the manager resets it.'}
    else if(data==='closed'){msg='This link is closed or your name isn’t on it. Ask in the group chat.'}
    else msg='Enter a 4–6 digit PIN.';
    render()}
});
(async()=>{if(!pid||!window.supabase){app.innerHTML='<p class="msg">Open the link from the group chat.</p>';return}
  sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false}});if(await load()){await loadPin();render();if(me&&ls('aufc_pin_'+me))loadTeaser(ls('aufc_pin_'+me))}
  setInterval(async()=>{if(document.visibilityState==='visible'&&!busy&&document.activeElement?.id!=='pin'&&await load())render()},20000)})();
})();
</script>
</body></html>
