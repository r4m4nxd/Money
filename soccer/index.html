<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Airdrie Team Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: sticky header + tab bar, one working column; teams laid out as a wrap grid of kit-coloured columns */
:root{
  --bg:#EDF1EC; --surface:#FFFFFF; --surface2:#F5F7F4; --ink:#13203A; --muted:#5B6679; --line:#D3DAD1;
  --accent:#177245; --accent-ink:#FFFFFF; --warn:#B4531A; --bad:#B42B2B; --good:#177245;
  --gold1:#F1D57A; --gold2:#B8912F; --silver1:#E3E7EB; --silver2:#9AA3AD; --bronze1:#E2B084; --bronze2:#9C6B43; --card-ink:#1A1A17;
  --blue:#2F6FD6; --green:#1E9A52; --orange:#EE8A1A; --red:#D23B3B; --purple:#7B4BC9; --black:#2A2E35;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1520; --surface:#16212E; --surface2:#1B2837; --ink:#E7ECF2; --muted:#93A0B2; --line:#27364A;
  --accent:#3DBB7C; --accent-ink:#06220F; --warn:#E59656; --bad:#EF6B6B; --good:#3DBB7C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#16212E; --surface2:#1B2837; --ink:#E7ECF2; --muted:#93A0B2; --line:#27364A;
  --accent:#3DBB7C; --accent-ink:#06220F; --warn:#E59656; --bad:#EF6B6B; --good:#3DBB7C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;padding-block:12px 4px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
.brand small{color:var(--muted);font-size:13px}
.sync{margin-left:auto;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-block:6px 8px}
nav.tabs button{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
h2{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:18px 0 8px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.04em;margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
button,.btn{font:inherit;cursor:pointer}
.btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{font:inherit;color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.num{font-variant-numeric:tabular-nums}
.pos{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;line-height:1.3}
.pos.DEF{color:#2F6FD6} .pos.MID{color:#1E9A52} .pos.FWD{color:#D23B3B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pos.DEF{color:#7EA9F0}:root:not([data-theme="light"]) .pos.FWD{color:#F08A8A}:root:not([data-theme="light"]) .pos.MID{color:#5FD08E}}
:root[data-theme="dark"] .pos.DEF{color:#7EA9F0}:root[data-theme="dark"] .pos.FWD{color:#F08A8A}:root[data-theme="dark"] .pos.MID{color:#5FD08E}

/* availability chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 10px 5px 6px;cursor:pointer;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .o{font-family:var(--f-display);font-weight:700;font-size:13px;min-width:22px;text-align:center}
.grp{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:start;padding-block:6px;border-top:1px dashed var(--line)}
.grp:first-child{border-top:0}

/* teams */
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.team .hd{padding:10px 12px;color:#fff;display:flex;align-items:center;gap:8px}
.team .hd input{background:rgba(255,255,255,.18);border:0;color:#fff;font-family:var(--f-display);font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.03em;padding:2px 6px;width:100%}
.team .hd select{background:rgba(0,0,0,.18);border:0;color:#fff;padding:3px}
.plist{list-style:none;margin:0;padding:4px 0}
.plist li{display:grid;grid-template-columns:40px 1fr auto auto;gap:8px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.plist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist select{padding:2px 4px;font-size:12px}
.lock{background:none;border:0;padding:2px 4px;color:var(--muted);font-size:14px}
.lock[aria-pressed="true"]{color:var(--warn)}
.stats{padding:10px 12px;background:var(--surface2);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700}
.stats span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stats .d{font-size:11px}
.up{color:var(--good)} .dn{color:var(--bad)}
.lines{font-size:12px;color:var(--muted);padding:0 12px 8px;background:var(--surface2)}
.balance{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:600;font-size:12px}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.meh{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}

/* FIFA-style cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;border-radius:12px 12px 40px 40px/12px 12px 24px 24px;padding:10px 10px 14px;color:var(--card-ink);cursor:pointer;border:0;text-align:left;font:inherit;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 1px 0 rgba(0,0,0,.08)}
.card.gold{--t1:var(--gold1);--t2:var(--gold2)} .card.silver{--t1:var(--silver1);--t2:var(--silver2)} .card.bronze{--t1:var(--bronze1);--t2:var(--bronze2)}
.card.off{opacity:.5}
.card .ovr{font-family:var(--f-display);font-weight:800;font-size:38px;line-height:.9}
.card .ps{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.05em}
.card .cn{font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;margin-top:10px;border-bottom:1px solid rgba(0,0,0,.25);padding-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cs{display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;margin-top:6px;font-size:13px;font-variant-numeric:tabular-nums}
.card .cs b{font-family:var(--f-display);font-size:15px;margin-right:3px}
.card .fm{position:absolute;right:10px;top:10px;font-size:12px;font-weight:700}
.card .wl{font-size:11px;margin-top:6px;opacity:.8}

/* matches */
.mlist{display:flex;flex-direction:column;gap:10px}
.mrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.score .k{width:12px;height:12px;border-radius:3px;display:inline-block}
.score input{width:52px;text-align:center}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,18,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal{background:var(--bg);color:var(--ink);border-radius:14px;width:100%;max-width:760px;padding:16px;border:1px solid var(--line)}
.modal .mh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.modal .mh h2{margin:0}
.modal .mh .x{margin-left:auto}
.attrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.attrs input{width:100%}
.rate{border-top:1px solid var(--line);padding-block:10px;display:flex;flex-direction:column;gap:6px}
.rate .attrs{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px}
.rate .attrs label{font-size:10px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td:first-child,th:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}

/* share card: fixed look so the screenshot is identical on every phone */
.sharecard{background:#0F1B2B;color:#F2F5F8;border-radius:14px;padding:18px;font-family:var(--f-body);max-width:560px;margin:0 auto}
.sharecard .sh{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.03em;line-height:1}
.sharecard .sd{color:#A9B6C6;font-size:14px;margin:4px 0 14px}
.sharecard .sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sharecard .st{background:#172638;border-radius:10px;overflow:hidden}
.sharecard .st h4{margin:0;padding:8px 10px;font-family:var(--f-display);font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.04em;color:#fff}
.sharecard .st ol{margin:0;padding:6px 10px 10px 30px;font-size:14px}
.sharecard .st li{padding:2px 0}
.sharecard .st li em{font-style:normal;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;color:#A9B6C6;margin-left:6px}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;z-index:80;font-weight:600;font-size:14px}
@media (max-width:520px){.stats{grid-template-columns:repeat(5,1fr)}.stats b{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .12s,color .12s}}
</style>

<header class="top"><div class="wrap" style="padding-block:0">
  <div class="brand"><h1>Airdrie Team Builder</h1><small id="sub">Saturday soccer</small><span class="sync" id="sync"></span></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="match">Match Day</button>
    <button role="tab" data-v="history">Matches &amp; Ratings</button>
    <button role="tab" data-v="squad">Squad</button>
    <button role="tab" data-v="settings">Settings</button>
  </nav>
</div></header>
<main class="wrap" id="main"><p class="empty">Loading squad…</p></main>
<div id="modal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(()=>{
const K=['pas','sho','def','bal','min','tea','spd','sta','str'];
const KL={pas:'Passing',sho:'Shooting',def:'Defending',bal:'Ball Skill',min:'Mindset',tea:'Team Work',spd:'Speed',sta:'Stamina',str:'Strength'};
const POS=['DEF','MID','FWD'];
const KITS={blue:'Blue',green:'Green',orange:'Orange',red:'Red',purple:'Purple',black:'Black'};
const KITHEX={blue:'#2F6FD6',green:'#1E9A52',orange:'#EE8A1A',red:'#D23B3B',purple:'#7B4BC9',black:'#2A2E35'};
const KITEMO={blue:'🟦',green:'🟩',orange:'🟧',red:'🟥',purple:'🟪',black:'⬛'};
const DEF_KITS=['blue','green','orange','red'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=x=>Math.round(x*10)/10;
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||uid();
function ls(k,v){try{if(v===undefined){const x=localStorage.getItem(k);return x?JSON.parse(x):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function nextSat(){const d=new Date();d.setHours(12);d.setDate(d.getDate()+((6-d.getDay()+7)%7));return d.toISOString().slice(0,10)}
function fmtDate(s){const d=new Date(s+'T12:00');return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}

/* ---------- state + storage ---------- */
const S={players:[],matches:[],settings:{baseW:3,recentN:0,mix:true,time:'7:00 – 9:00 PM'}};
let db=null, mode='local', loaded=false;
const draft=Object.assign({date:nextSat(),n:3,kits:DEF_KITS.slice(),names:[],avail:[],teams:null,locks:{},editing:null,alts:[]},ls('atb_draft')||{});
if(draft.date<new Date().toISOString().slice(0,10)&&!draft.editing){draft.date=nextSat()}
const saveDraft=()=>ls('atb_draft',draft);
let view=ls('atb_view')||'match';

const persistLocal=()=>ls('atb_state',S);
async function putPlayer(p){const i=S.players.findIndex(x=>x.id===p.id);i<0?S.players.push(p):S.players[i]=p;
  if(mode==='db'){try{await db.doc('players/'+p.id).set(p)}catch(e){toast('Could not save: '+(e.message||e.code))}}else persistLocal();render()}
async function putMatch(m){const i=S.matches.findIndex(x=>x.id===m.id);i<0?S.matches.push(m):S.matches[i]=m;
  if(mode==='db'){try{await db.doc('matches/'+m.id).set(m)}catch(e){toast('Could not save: '+(e.message||e.code))}}else persistLocal();render()}
async function delMatch(id){S.matches=S.matches.filter(m=>m.id!==id);if(mode==='db'){try{await db.doc('matches/'+id).delete()}catch(e){toast('Could not delete')}}else persistLocal();render()}
async function putSettings(){if(mode==='db'){try{await db.doc('settings/main').set(S.settings)}catch(e){}}else persistLocal();render()}

async function seedFromFile(){try{const r=await fetch('seed.json');const j=await r.json();for(const p of j.players){await putPlayer(p)}toast('Loaded '+j.players.length+' players')}catch(e){toast('Could not load last season’s squad')}}

async function boot(){
  let t=0;while(!window.claude&&t<15){await new Promise(r=>setTimeout(r,100));t++}
  try{db=window.claude?await window.claude.use('db'):null}catch(e){db=null}
  if(db){
    mode='db';$('#sync').textContent='Synced to your account';
    let got=0;const done=()=>{if(++got>=2){loaded=true;render()}};
    db.collection('players').onSnapshot(s=>{S.players=s.docs.map(d=>({...d.data(),id:d.id}));loaded&&render();done()},e=>{done()});
    db.collection('matches').onSnapshot(s=>{S.matches=s.docs.map(d=>({...d.data(),id:d.id}));loaded&&render();done()},e=>{done()});
    db.doc('settings/main').onSnapshot(d=>{if(d.exists){Object.assign(S.settings,d.data());loaded&&render()}},()=>{});
  }else{
    mode='local';$('#sync').textContent='Saved on this device';
    const st=ls('atb_state');
    if(st&&st.players&&st.players.length){Object.assign(S,st);S.settings=Object.assign({baseW:3,recentN:0,mix:true,time:'7:00 – 9:00 PM'},st.settings)}
    else{try{const j=await (await fetch('seed.json')).json();S.players=j.players;persistLocal()}catch(e){}}
    loaded=true;render();
  }
}

/* ---------- ratings model ---------- */
// Scores follow last season's sheet: FWD skips Defending, MID skips Speed+Strength, DEF skips Ball Skill, PACE = Speed.
function scores(a){
  const fwd=(a.pas+a.sho+a.bal+a.min+a.tea+a.spd+a.sta+a.str)/80;
  const mid=(a.pas+a.sho+a.def+a.bal+a.min+a.tea+a.sta)/70;
  const def=(a.pas+a.sho+a.def+a.min+a.tea+a.spd+a.sta+a.str)/80;
  const pace=a.spd/10;
  return {fwd,mid,def,pace,ovr:Math.round((fwd+mid+def+pace)/4*100)};
}
let CACHE=null;
function compute(){
  const ms=S.matches.slice().sort((a,b)=>a.date<b.date?-1:1);
  const out={};
  for(const p of S.players){
    let rs=ms.filter(m=>m.ratings&&m.ratings[p.id]).map(m=>({date:m.date,r:m.ratings[p.id]}));
    const N=+S.settings.recentN||0; if(N>0) rs=rs.slice(-N);
    const w=p.baseN>0?Math.min(p.baseN,+S.settings.baseW):(rs.length?0.5:1);
    const a={};for(const k of K){let s=(p.base?.[k]??7)*w;for(const x of rs)s+=+x.r[k];a[k]=s/(w+rs.length)}
    const sc=scores(a);
    const hist=rs.map(x=>({date:x.date,ovr:scores(x.r).ovr}));
    let W=0,D=0,L=0;
    for(const m of ms){const ti=m.teams.findIndex(t=>t.players.includes(p.id));if(ti<0)continue;const gs=m.teams.map(t=>t.goals);if(gs.some(g=>g===''||g==null))continue;
      const mine=+gs[ti],best=Math.max(...gs.map(Number));const top=gs.filter(g=>+g===best).length;
      if(mine===best&&top===1)W++;else if(mine===best)D++;else L++}
    out[p.id]={...sc,a,hist,W,D,L,games:rs.length};
  }
  return out;
}
const R=id=>CACHE[id]||{fwd:0,mid:0,def:0,pace:0,ovr:0,a:{},hist:[]};
const pById=id=>S.players.find(p=>p.id===id);
const posOf=id=>(draft.posOverride&&draft.posOverride[id])||pById(id)?.pos||'MID';
function teamStats(ids){
  const rs=ids.map(R);
  const f=k=>avg(rs.map(r=>r[k]))*100;
  const c={DEF:0,MID:0,FWD:0};ids.forEach(id=>c[posOf(id)]++);
  return {atk:f('fwd'),mid:f('mid'),def:f('def'),pace:f('pace'),tot:(f('fwd')+f('mid')+f('def')+f('pace'))/4,c,n:ids.length};
}

/* ---------- balancer ---------- */
function lastPairs(){
  const ms=S.matches.slice().sort((a,b)=>a.date<b.date?1:-1).filter(m=>m.date<draft.date);
  const set=new Set();const m=ms[0];if(!m)return set;
  for(const t of m.teams)for(const a of t.players)for(const b of t.players)if(a<b)set.add(a+'|'+b);
  return set;
}
function cost(T,pairs){
  const st=T.map(teamStats);
  const spread=k=>{const v=st.map(s=>s[k]);return Math.max(...v)-Math.min(...v)};
  let c=0;
  const sz=st.map(s=>s.n);c+=Math.max(0,Math.max(...sz)-Math.min(...sz)-1)*1000;
  for(const p of POS){const v=st.map(s=>s.c[p]);const d=Math.max(...v)-Math.min(...v);c+=d*6+Math.max(0,d-1)*60}
  c+=spread('tot')*12+spread('atk')*3+spread('mid')*3+spread('def')*3+spread('pace')*1.5;
  if(S.settings.mix&&pairs.size){for(const t of T)for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){const a=t[i],b=t[j];if(pairs.has(a<b?a+'|'+b:b+'|'+a))c+=1.2}}
  return c;
}
function balance(ids,n,locks){
  const pairs=lastPairs();const results=[];
  const order={DEF:0,MID:1,FWD:2};
  for(let run=0;run<80;run++){
    const T=Array.from({length:n},()=>[]);
    ids.filter(id=>locks[id]!=null&&locks[id]<n).forEach(id=>T[locks[id]].push(id));
    const free=ids.filter(id=>!(locks[id]!=null&&locks[id]<n)).map(id=>({id,k:order[posOf(id)],o:R(id).ovr+Math.random()*6}))
      .sort((a,b)=>a.k-b.k||b.o-a.o);
    for(const x of free){
      let best=0,bv=1e9;
      T.forEach((t,i)=>{const v=t.length*1000+t.filter(id=>posOf(id)===posOf(x.id)).length*100+t.reduce((s,id)=>s+R(id).ovr,0)/50+Math.random();if(v<bv){bv=v;best=i}});
      T[best].push(x.id);
    }
    let cur=cost(T,pairs),imp=true,guard=0;
    while(imp&&guard++<40){imp=false;
      for(let a=0;a<n;a++)for(let b=a+1;b<n;b++){
        for(let i=0;i<T[a].length;i++)for(let j=0;j<T[b].length;j++){
          const x=T[a][i],y=T[b][j];if(locks[x]!=null||locks[y]!=null)continue;
          T[a][i]=y;T[b][j]=x;const c=cost(T,pairs);
          if(c<cur-1e-9){cur=c;imp=true}else{T[a][i]=x;T[b][j]=y}
        }
      }
    }
    const sig=T.map(t=>t.slice().sort().join(',')).sort().join('/');
    if(!results.some(r=>r.sig===sig))results.push({T:T.map(t=>t.slice()),c:cur,sig});
  }
  results.sort((a,b)=>a.c-b.c);
  return results.slice(0,8);
}
function sortTeam(t){const o={DEF:0,MID:1,FWD:2};return t.slice().sort((a,b)=>o[posOf(a)]-o[posOf(b)]||R(b).ovr-R(a).ovr)}

        <input id="tn${i}" value="${esc(draft.names[i]||'Team '+KITS[kit])}" data-a="tname" data-i="${i}" aria-label="Team name">

        <ul class="plist">${sortTeam(t).map(id=>{const p=pById(id);return `<li><span class="pos ${posOf(id)}">${posOf(id)}</span><span class="nm">${esc(p?.name)}</span><span class="num muted small">${R(id).ovr}</span>

async function saveFile(name,data,mime){
  let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename:name,data});toast('Saved '+name)}catch(e){if(e.code!=='declined')toast('Could not save file')}return}
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const tab=e.target.closest('#tabs button');if(tab){view=tab.dataset.v;ls('atb_view',view);render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id;
  if(el.tagName==='SELECT'||el.tagName==='INPUT'&&el.type!=='checkbox')return;
  if(a==='scrim'&&e.target===el){closeModal();return}
  if(a==='close'){closeModal();return}
  if(a==='seed'){await seedFromFile();return}
  if(a==='av'){const s=new Set(draft.avail);s.has(id)?s.delete(id):s.add(id);draft.avail=[...s];saveDraft();render();return}
  if(a==='allin'){draft.avail=S.players.filter(p=>p.active!==false).map(p=>p.id);saveDraft();render();return}
  if(a==='nonein'){draft.avail=[];draft.teams=null;draft.locks={};saveDraft();render();return}
  if(a==='balance'){const ids=draft.avail.filter(id=>pById(id));Object.keys(draft.locks).forEach(k=>{if(!ids.includes(k))delete draft.locks[k]});
    draft.alts=balance(ids,draft.n,draft.locks).map(r=>r.T);draft.altI=0;draft.teams=draft.alts[0];
    while(draft.names.length<draft.n)draft.names.push('');saveDraft();render();return}
  if(a==='reroll'){draft.altI=((draft.altI||0)+1)%draft.alts.length;draft.teams=draft.alts[draft.altI];saveDraft();render();toast('Option '+(draft.altI+1)+' of '+draft.alts.length);return}
  if(a==='lock'){const i=+el.dataset.i;draft.locks[id]!=null?delete draft.locks[id]:draft.locks[id]=i;saveDraft();render();return}
  if(a==='savematch'){const mm=draftAsMatch();const old=draft.editing&&S.matches.find(x=>x.id===draft.editing);
    const m={id:old?old.id:draft.date+'-'+uid(),date:mm.date,teams:mm.teams.map((t,i)=>({...t,goals:old?.teams[i]?.goals??null})),ratings:old?.ratings||{},createdAt:old?.createdAt||Date.now()};
    await putMatch(m);draft.editing=m.id;saveDraft();toast('Match saved');render();return}
  if(a==='newmatch'){Object.assign(draft,{editing:null,teams:null,avail:[],locks:{},alts:[],date:nextSat(),names:[]});saveDraft();render();return}
  if(a==='share'){shareModal(draftAsMatch());return}
  if(a==='sharem'){shareModal(S.matches.find(x=>x.id===id));return}
  if(a==='editm'){const m=S.matches.find(x=>x.id===id);Object.assign(draft,{editing:m.id,date:m.date,n:m.teams.length,kits:m.teams.map(t=>t.kit),names:m.teams.map(t=>t.name),teams:m.teams.map(t=>t.players.slice()),avail:m.teams.flatMap(t=>t.players),locks:{},alts:[]});saveDraft();view='match';ls('atb_view',view);render();window.scrollTo(0,0);return}
  if(a==='delm'){if(el.dataset.sure){delMatch(id);toast('Match deleted');}else{el.dataset.sure=1;el.textContent='Tap again to delete';setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent='Delete'}},3000)}return}
  if(a==='rate'){rateModal(id);return}
  if(a==='bump'){const d=+el.dataset.d;K.forEach(k=>{const i=$(`#r_${CSS.escape(id)}_${k}`);i.value=Math.min(10,Math.max(1,(+i.value||7)+d))});return}
  if(a==='saverate'){const m=JSON.parse(JSON.stringify(S.matches.find(x=>x.id===id)));m.ratings=m.ratings||{};
    document.querySelectorAll('.rate[data-pid]').forEach(row=>{const pid=row.dataset.pid;const o={};K.forEach(k=>{o[k]=Math.min(10,Math.max(1,+$(`#r_${CSS.escape(pid)}_${k}`).value||7))});m.ratings[pid]=o});
    await putMatch(m);closeModal();toast('Ratings saved');return}
  if(a==='sf'){squadFilter=el.dataset.f;render();return}
  if(a==='addp'){playerModal(null);return}
  if(a==='editp'){playerModal(id);return}
  if(a==='savep'){const name=$('#pn').value.trim();if(!name){toast('Enter a name');return}
    const old=id?pById(id):null;const base={};K.forEach(k=>base[k]=Math.min(10,Math.max(1,+$('#pb_'+k).value||7)));
    let nid=id||slug(name);if(!id&&pById(nid))nid+='-'+uid().slice(-3);
    await putPlayer({...(old||{baseN:0}),id:nid,name,pos:$('#pp').value,active:$('#pa').checked,base});closeModal();toast('Saved '+name);return}
  if(a==='copytxt'){const t=shareText(lastShare);try{await navigator.clipboard.writeText(t);toast('Copied. Paste it in WhatsApp')}catch(err){openModal(`<div class="mh"><h2>Copy text</h2><button class="btn ghost x" data-a="close">Close</button></div><textarea id="ctxt" style="width:100%;height:300px;font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px">${esc(t)}</textarea>`);$('#ctxt').select()}return}
  if(a==='saveimg'){if(!window.html2canvas){toast('Image tool did not load. Take a screenshot instead');return}
    el.disabled=true;try{const c=await html2canvas($('#sharecard'),{backgroundColor:'#0F1B2B',scale:2});const blob=await new Promise(r=>c.toBlob(r,'image/png'));await saveFile('teams-'+lastShare.date+'.png',blob,'image/png')}catch(err){toast('Could not make the image. Take a screenshot instead')}el.disabled=false;return}
  if(a==='export'){await saveFile('airdrie-teams-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(S,null,1),'application/json');return}
});
document.addEventListener('change',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='date'){draft.date=el.value||nextSat();saveDraft();render();return}
  if(a==='nteams'){draft.n=+el.value;draft.teams=null;draft.alts=[];draft.locks={};saveDraft();render();return}
  if(a==='tname'){draft.names[+el.dataset.i]=el.value.trim();saveDraft();render();return}
  if(a==='tkit'){const i=+el.dataset.i;const old=draft.kits[i];draft.kits[i]=el.value;const nm=draft.names[i];if(!nm||nm==='Team '+KITS[old])draft.names[i]='';saveDraft();render();return}
  if(a==='move'){const to=+el.value,id=el.dataset.id;draft.teams=draft.teams.map(t=>t.filter(x=>x!==id));draft.teams[to].push(id);if(draft.locks[id]!=null)draft.locks[id]=to;draft.alts=[draft.teams];saveDraft();render();return}
  if(a==='goal'){const m=JSON.parse(JSON.stringify(S.matches.find(x=>x.id===el.dataset.id)));const v=el.value;m.teams[+el.dataset.i].goals=v===''?null:+v;await putMatch(m);return}
  if(a==='set'){const k=el.dataset.k;S.settings[k]=el.type==='checkbox'?el.checked:(k==='time'?el.value:+el.value);await putSettings();return}
  if(a==='showoff'){showOff=el.checked;render();return}
  if(a==='import'){const f=el.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.players))throw 0;
      for(const p of j.players)await putPlayer(p);for(const m of j.matches||[])await putMatch(m);if(j.settings){Object.assign(S.settings,j.settings);await putSettings()}toast('Imported '+j.players.length+' players, '+(j.matches||[]).length+' matches')}catch(err){toast('That file is not a Team Builder backup')}el.value='';return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
boot();
})();
</script>
